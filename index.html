  else if(l>st.max)out.push('vượt '+(l-st.max)+' ca so với '+(st.role==='FT'?'định mức ':'tối đa ')+st.max+' ca/tuần');
  if(wd>=7)out.push('không có ngày nghỉ trong tuần (BLLĐ 2019, Điều 111)');
  return {load:l,days:wd,issues:out};
}

/* ---------- tự xếp ---------- */
function weekHoursOf(k,sid){var h=0;for(var d=0;d<7;d++){var c=getCell(k,sid,d);if(c&&c.s!=='O')h+=hoursOf(c.s);}return h;}
function priorHours(k,sid){var h=0;for(var i=1;i<=3;i++)h+=weekHoursOf(addDays(k,-7*i),sid);return h;}
function skillRank(st,pid){var i=st.skills.indexOf(pid);return i<0?99:i;}
/* mức "Ưu tiên nhận ca" của PT: Cao nhận tỷ lệ ca cao hơn, Thấp nhận ít hơn (FT không áp dụng) */
function hpMul(st){return st.role==='FT'?1:st.hp==='cao'?0.5:st.hp==='thap'?2:1;}
/* Luồng chi phí nhỏ nhất (min-cost max-flow): tìm cách xếp đủ người nhiều nhất, rồi trong các cách đó chọn cách "rẻ" nhất. */
function mcmf(n){
  var to=[],cap=[],cost=[],nxt=[],head=[];for(var i=0;i<n;i++)head.push(-1);
  function add(u,v,c,w){to.push(v);cap.push(c);cost.push(w);nxt.push(head[u]);head[u]=to.length-1;to.push(u);cap.push(0);cost.push(-w);nxt.push(head[v]);head[v]=to.length-1;return to.length-2;}
  function run(s,t){
    var flow=0;
    for(var it=0;it<5000;it++){
      var dist=[],inq=[],pe=[],qq=[s],qi=0;for(var i=0;i<n;i++){dist.push(Infinity);inq.push(false);pe.push(-1);}
      dist[s]=0;inq[s]=true;
      while(qi<qq.length){var u=qq[qi++];inq[u]=false;for(var e=head[u];e!==-1;e=nxt[e]){var v=to[e];if(cap[e]>0&&dist[u]+cost[e]<dist[v]-1e-9){dist[v]=dist[u]+cost[e];pe[v]=e;if(!inq[v]){inq[v]=true;qq.push(v);}}}}
      if(dist[t]===Infinity)break;
      var f=Infinity,x=t;while(x!==s){f=Math.min(f,cap[pe[x]]);x=to[pe[x]^1];}
      x=t;while(x!==s){cap[pe[x]]-=f;cap[pe[x]^1]+=f;x=to[pe[x]^1];}
      flow+=f;
    }
    return flow;
  }
  return {add:add,run:run,cap:cap};
}
/* Xếp tự động, xét cả tuần cùng lúc, theo thứ tự quan trọng:
   1) đủ người theo định biên nhiều nhất có thể;
   2) FT (lương cố định) được xếp đủ định mức trước PT;
   3) vị trí theo thứ tự ưu tiên CHẶT: luôn lấp vị trí ưu tiên 1 của người đó trước, chỉ dùng vị trí 2, 3… khi vị trí trước đã đủ người;
   4) PT chia ca theo tỷ lệ đăng ký: tỷ lệ (giờ được xếp / giờ có thể làm theo đăng ký) gần nhau, nhân mức "Ưu tiên nhận ca" (Cao / Thường / Thấp);
   5) giữ trọn ca đã đăng ký: sau khi xếp, người đăng ký khung dài nhận thêm phần ca liền kề đang do người đăng ký khung ngắn hơn làm (keepBlocks).
   Ràng buộc: đã đào tạo vị trí, đã đăng ký đúng ngày/ca, không nghỉ phép, ≤ số ca tối đa, ≤ 1 ca/ngày, ≥ 1 ngày nghỉ/tuần.
   Không đụng vào ô đã xếp tay. */
/* FT có ca cố định (vd 2 ca/ngày): xếp trước, mỗi ngày đi làm nhận nguyên các ca cố định ở 1 vị trí.
   Ngày làm = ngày được đăng ký/không nghỉ, tối đa 6 ngày và tối đa định mức; ưu tiên ngày còn thiếu người nhiều. */
function ftNeedFix(k){
  var out=[];
  S.staff.forEach(function(st){
    if(st.role!=='FT'||fixOf(st).length||!inWeek(st,k))return;
    var r=S.reg[k]&&S.reg[k][st.id];if(!r)return;
    var cnt={},best=null;
    r.forEach(function(a){var L=regList(a);if(L.length<2)return;var key=L.join(',');cnt[key]=(cnt[key]||0)+1;if(!best||cnt[key]>cnt[best])best=key;});
    if(best)out.push({st:st,fix:best.split(',')});
  });
  return out;
}
function ftDayMode(st){return st.role==='FT'&&(+st.max||0)<=7;}
/* các ca FT làm trong ngày: ca đã đăng ký (nếu đăng ký cụ thể), "Cả ngày"/không đăng ký thì theo ca cố định */
function ftPlan(st,k,d){
  var a=avail(st,k,d);if(!a)return [];
  var lv=leaveOn(st.id,k,d);if(lv==='F')return [];
  var L=a==='A'?fixOf(st):regList(a);
  return L.filter(function(id){return !blocks(lv,id);});
}
/* FT làm nhiều ca/ngày: có ca cố định, hoặc tuần này đăng ký ít nhất 1 ngày từ 2 ca trở lên */
function ftMulti(st,k){
  if(st.role!=='FT')return false;if(fixOf(st).length>1)return true;
  var r=S.reg[k]&&S.reg[k][st.id];return !!(r&&r.some(function(a){return regList(a).length>1;}));
}
/* xếp trước FT làm nhiều ca/ngày: mỗi ngày đi làm nhận đúng các ca đã đăng ký (hoặc ca cố định), 1 vị trí, tối đa 6 ngày */
function preassignFT(k){
  var n=0,cov=coverage(k);
  S.staff.forEach(function(st){
    if(!ftMulti(st,k)||!inWeek(st,k)||!st.skills.length)return;
    /* ô đã xếp trước còn thiếu ca so với kế hoạch: nâng lên đủ (giữ vị trí) */
    for(var d0=0;d0<7;d0++){
      var c0=getCell(k,st.id,d0);if(!c0||c0.s==='O'||!c0.p)continue;
      var have=shiftsOf(c0.s),want=ftPlan(st,k,d0);
      if(!have.length||want.length<=have.length||have.some(function(id){return want.indexOf(id)<0;}))continue;
      var add=want.filter(function(id){return have.indexOf(id)<0;});
      setCell(k,st.id,d0,{s:comboOf(want),p:c0.p,ps:c0.ps,sw:c0.sw});add.forEach(function(id){if(cov[d0][id]&&cov[d0][id][c0.p]!=null)cov[d0][id][c0.p]++;});n+=add.length;
    }
    var info=staffInfo(k,st),dayCap=Math.min(6,ftDayMode(st)?(+st.max||6):6)-info.days,shiftCap=ftDayMode(st)?1e9:(+st.max||0)-info.load;
    if(dayCap<=0||shiftCap<=0)return;
    var cand=[];
    for(var d=0;d<7;d++){
      if(getCell(k,st.id,d))continue;
      var ids=ftPlan(st,k,d);if(!ids.length)continue;
      var need=0;ids.forEach(function(id){S.positions.forEach(function(p){need+=Math.max(0,needF(d,id,p.id)-cov[d][id][p.id]);});});
      cand.push({d:d,ids:ids,need:need});
    }
    cand.sort(function(x,y){return y.need-x.need||x.d-y.d;});
    cand.slice(0,dayCap).forEach(function(c){
      if(shiftCap<c.ids.length)return;
      var best=null,bs=-1e9;
      st.skills.forEach(function(pid,rank){if(!pos(pid))return;var g=0;c.ids.forEach(function(id){g+=Math.max(0,needF(c.d,id,pid)-cov[c.d][id][pid]);});var sc=(g>0?1e6:0)-rank*1000*afRank()+g;if(sc>bs){bs=sc;best=pid;}});
      if(!best)return;
      setCell(k,st.id,c.d,{s:comboOf(c.ids),p:best});c.ids.forEach(function(id){cov[c.d][id][best]++;});n+=c.ids.length;shiftCap-=c.ids.length;
    });
  });
  return n;
}
/* Ghép ca (lượt 1 cùng vị trí, lượt 2 khác vị trí): người đã làm ngày đó, có đăng ký thêm ca thiếu, còn ca trong tuần → làm thêm ca đó.
   Nhiều người đủ điều kiện thì ưu tiên người ít giờ trong tuần. FT chỉ ghép khi FT làm nhiều ca/ngày. */
function extraShifts(k,slots,cross){
  var n=0;
  slots.forEach(function(sl){
    while(sl.g>0){
      var best=null,bh=Infinity;
      S.staff.forEach(function(st){
        if(!inWeek(st,k)||!employed(st,addDays(k,sl.d)))return;
        if(st.role==='FT'&&!ftMulti(st,k))return;
        var c=getCell(k,st.id,sl.d);if(!c||c.s==='O'||!c.p||covers(c.s,sl.sh.id)||st.skills.indexOf(sl.p.id)<0)return;
        if(!cross&&c.p!==sl.p.id)return;
        if(!holdAfterOk(c,sl.sh.id,sl.p.id))return; /* vị trí xếp trước (FnB): không tách khối ca */
        if(overlapIds(shiftsOf(c.s),sl.sh.id))return; /* không ghép 2 ca trùng giờ trong 1 ngày */
        if(!splitOk(st,k,sl.d,shiftsOf(c.s).concat([sl.sh.id])))return; /* không tạo ca gãy khi đăng ký ca liền */
        var a=avail(st,k,sl.d),lv=leaveOn(st.id,k,sl.d);if(!availOk(a,sl.sh.id)||blocks(lv,sl.sh.id))return;
        var inf=staffInfo(k,st);if(!ftDayMode(st)&&inf.load+1>st.max)return;
        var hh=(c.p===sl.p.id?0:1e9)+skillRank(st,sl.p.id)*1e6*afRank()+hpMul(st)*weekHoursOf(k,st.id)/Math.max(1,capHours(st,k))+0.02*AF.ordw/4*Math.min(ordIdx(st,sl.p.id),5)+(posHold(sl.p.id)?Math.max(AF.exLong,0.3):AF.exLong)*Math.max(0,atomIds().length-regLenOf(st,k,sl.d));if(hh<bh){bh=hh;best={st:st,c:c};}
      });
      if(!best)break;
      var nps=JSON.parse(JSON.stringify(best.c.ps||{}));if(sl.p.id!==best.c.p)nps[sl.sh.id]=sl.p.id;
      var dv2=Math.max(best.c.dv||0,regDev(best.st,k,sl.d,sl.sh.id));setCell(k,best.st.id,sl.d,{s:comboOf(shiftsOf(best.c.s).concat([sl.sh.id])),p:best.c.p,ps:Object.keys(nps).length?nps:undefined,sw:best.c.sw,dv:dv2||undefined});sl.g--;n++;
    }
  });
  return n;
}
/* trọng số Tự xếp theo phương án:
   kMul: hệ số chia đều giờ theo tỷ lệ đăng ký · ordw: thứ tự nhân viên trong vị trí · cross: cho ghép ca sang vị trí khác
   keepFair: giữ trọn ca chỉ khi không làm lệch tỷ lệ · longBonus / exLong: ưu tiên người đăng ký khung dài (ít người, ca dài) */
var AF_MODES={
  A:{id:'A',name:'Chia đều',desc:'Giờ xếp theo đúng tỷ lệ đăng ký: ai đăng ký nhiều được nhiều. Công bằng, giữ chân PT.',kMul:1,ordw:4,cross:true,keepFair:true,longBonus:0,exLong:0},
  B:{id:'B',name:'Ca dài, ít người',desc:'Ưu tiên người đăng ký khung dài làm trọn ca. Ít người đi làm, ít giao ca.',kMul:0.3,ordw:4,cross:true,keepFair:false,longBonus:40,exLong:0.3},
  C:{id:'C',name:'Đúng người đúng chỗ',desc:'Người đứng đầu mỗi vị trí được xếp trước, không ghép sang vị trí khác.',kMul:1,ordw:300,cross:false,keepFair:true,longBonus:0,exLong:0},
  D:{id:'D',name:'Chia đều, bỏ ưu tiên',desc:'Bỏ số thứ tự giữa các nhân viên cùng vị trí và bỏ ưu tiên 1, 2, 3 giữa các vị trí: ai đã đào tạo vị trí đó đều như nhau, giờ chia đều theo tỷ lệ đăng ký.',kMul:1,ordw:0,cross:true,keepFair:true,longBonus:0,exLong:0,rankW:0}
};
var AF=AF_MODES.A;
/* trọng số ưu tiên giữa các vị trí của phương án đang chạy: 1 = xét ưu tiên 1, 2, 3; 0 = mọi vị trí đã đào tạo ngang nhau (phương án D) */
function afRank(){return AF.rankW==null?1:AF.rankW;}
function regLenOf(st,k,d){var a=avail(st,k,d);if(!a)return 0;return a==='A'?atomIds().length:regList(a).length;}
/* đổi vị trí 1 ca của 1 người (giữ nguyên giờ làm) */
function setAtomPos(k,st,d,shId,pid){
  var c=getCell(k,st.id,d),ids=shiftsOf(c.s),m={};ids.forEach(function(id){m[id]=posOf(c,id);});m[shId]=pid;
  var p0=c.p;if(!ids.some(function(id){return m[id]===p0;}))p0=m[ids[0]];var ps={};ids.forEach(function(id){if(m[id]!==p0)ps[id]=m[id];});
  var o=JSON.parse(JSON.stringify(c));o.p=p0;if(Object.keys(ps).length)o.ps=ps;else delete o.ps;setCell(k,st.id,d,o);
}
/* lấp chỗ thiếu bằng cách đổi vị trí người đang làm cùng ca (kể cả ô đã xếp tay): chỉ lấy từ chỗ đang dư,
   hoặc dây chuyền 2 bước. Không đổi giờ ai, không đụng ô đổi ca / nghỉ phép. */
function rebalancePos(k){
  var n=0,P=S.positions.map(function(x){return x.id;});
  for(var guard=0;guard<80;guard++){
    var cov=coverage(k),done=false;
    for(var d=0;d<7&&!done;d++){var AT=atomShifts();for(var a=0;a<AT.length&&!done;a++){var sh=AT[a];
      var over=function(q){return cov[d][sh.id][q]>needF(d,sh.id,q);};
      var who=function(q,pid,not){return S.staff.filter(function(st){if(st===not)return false;var c=getCell(k,st.id,d);return c&&c.s&&c.s!=='O'&&!c.sw&&covers(c.s,sh.id)&&posOf(c,sh.id)===q&&st.skills.indexOf(pid)>=0&&!blocks(leaveOn(st.id,k,d),sh.id)&&holdAfterOk(c,sh.id,pid);})
        .sort(function(x,y){return skillRank(x,pid)-skillRank(y,pid)||ordIdx(x,pid)-ordIdx(y,pid);});};
      for(var i=0;i<P.length&&!done;i++){var p=P[i];if(needF(d,sh.id,p)<=cov[d][sh.id][p])continue;
        for(var j=0;j<P.length&&!done;j++){var q=P[j];if(q===p||!over(q))continue;var L=who(q,p);if(L.length){setAtomPos(k,L[0],d,sh.id,p);n++;done=true;}}
        for(var j2=0;j2<P.length&&!done;j2++){var q2=P[j2];if(q2===p||over(q2))continue;var X=who(q2,p);
          for(var x=0;x<X.length&&!done;x++)for(var r=0;r<P.length&&!done;r++){var rr=P[r];if(rr===p||rr===q2||!over(rr))continue;var Y=who(rr,q2,X[x]);if(Y.length){setAtomPos(k,X[x],d,sh.id,p);setAtomPos(k,Y[0],d,sh.id,q2);n+=2;done=true;}}}
      }
    }}
    if(!done)break;
  }
  return n;
}
function autofill(k){
  /* ô có sẵn trước khi bấm Tự xếp: không lấy ca của các ô này (vẫn có thể được đổi vị trí cùng ca để lấp chỗ thiếu) */
  var sp=repairSplits(k),lp=fixLostPos(k); /* ô ca gãy sai đăng ký: xoá để xếp lại từ đầu; ca trống vị trí: gán lại vị trí */
  var snap={};S.staff.forEach(function(st){for(var d=0;d<7;d++)if(getCell(k,st.id,d))snap[st.id+'|'+d]=1;});
  var rp=rebalancePos(k),added=0,moved=0,r=null;
  for(var it=0;it<4;it++){
    r=autofillOnce(k);added+=r.added;
    var mv=keepBlocks(k,snap);moved+=mv;
    if(!mv)break;
  }
  rp+=rebalancePos(k);var cf=chainFill(k);added+=cf;
  if(rp||cf){var cv=coverage(k);r.unmet=r.unmet.filter(function(u){return cv[u.d][u.sh.id][u.p.id]<needF(u.d,u.sh.id,u.p.id);});}
  return {added:added,moved:moved,unmet:r.unmet,blocks:moved,repos:rp,splits:sp,lostpos:lp};
}
/* tỷ lệ giờ đã xếp / giờ có thể làm theo đăng ký trong tuần, nhân mức Ưu tiên nhận ca (Cao tính thấp hơn, Thấp tính cao hơn) */
function fairR(st,k){return hpMul(st)*weekHoursOf(k,st.id)/Math.max(1,capHours(st,k));}
function spanOf(ids){var a=null,b=null;ids.forEach(function(id){var t=shiftSpan(shift(id));if(!t)return;if(a==null||t[0]<a)a=t[0];if(b==null||t[1]>b)b=t[1];});return a==null?null:[a,b];}
/* gom ca: trả về số lượt ca đã chuyển sang người đăng ký khung dài hơn */
function keepBlocks(k,snap){
  var moved=0,atoms=atomIds();
  for(var d=0;d<7;d++){
    var ppl=S.staff.filter(function(st){return inWeek(st,k)&&st.skills.length&&employed(st,addDays(k,d));}).map(function(st){
      var a=avail(st,k,d),c=getCell(k,st.id,d);if(!a||a==='A'||!c||c.s==='O')return null;var L=regList(a);if(L.length<2)return null;
      if(st.role==='FT'&&!ftMulti(st,k))return null;return {st:st,a:a,n:L.length};
    }).filter(Boolean).sort(function(x,y){return y.n-x.n||hpMul(x.st)-hpMul(y.st);});
    ppl.forEach(function(P){
      for(var guard=0;guard<6;guard++){
        var c=getCell(k,P.st.id,d);if(!c||c.s==='O')break;
        var have=shiftsOf(c.s),sp=spanOf(have);if(!sp)break;
        var inf=staffInfo(k,P.st);if(!ftDayMode(P.st)&&inf.load+1>P.st.max)break;
        var lv=leaveOn(P.st.id,k,d),best=null,bs=1e18;
        atoms.forEach(function(m){
          var t=shiftSpan(shift(m));if(!t||have.indexOf(m)>=0||overlapIds(have,m))return;
          if(t[0]!==sp[1]&&t[1]!==sp[0])return;                       /* chỉ nhận phần liền kề, giữ ca liền mạch */
          if(!availOk(P.a,m)||blocks(lv,m))return;
          S.staff.forEach(function(st){
            if(st.id===P.st.id||snap[st.id+'|'+d])return;              /* không lấy từ ô có sẵn trước khi Tự xếp */
            var cb=getCell(k,st.id,d);if(!cb||cb.s==='O'||!covers(cb.s,m))return;
            var q=posOf(cb,m),rk=P.st.skills.indexOf(q);if(rk<0)return;
            if(!holdAfterOk(c,m,q))return;                                        /* vị trí xếp trước (FnB): không tách khối ca */
            var rkB=st.skills.indexOf(q);if(afRank()&&rkB>=0&&rk>rkB)return;      /* vị trí này là ưu tiên cao hơn của người đang làm thì không lấy */
            if(AF.keepFair&&!posHold(q)&&fairR(P.st,k)>fairR(st,k)+1e-9)return;  /* vị trí xếp trước (FnB): luôn gom cho ít lần bàn giao */                 /* người nhận đang được xếp tỷ lệ giờ / giờ đăng ký cao hơn người nhường thì không lấy */
            var bl=shiftsOf(cb.s),bsp=spanOf(bl);
            if(bl.length>1){var bt=shiftSpan(shift(m));if(bt[0]!==bsp[0]&&bt[1]!==bsp[1])return;}   /* không cắt ca người nhường thành 2 khúc */
            var ba=avail(st,k,d),bn=(ba&&ba!=='A')?regList(ba).length:(ba==='A'?99:0);
            if(bn>P.n||(bn===P.n&&bl.length>have.length))return;      /* lấy của người đăng ký khung ngắn hơn, hoặc khung bằng nhau nhưng đang làm ít hơn hoặc bằng */
            if(bl.length===1&&staffInfo(k,st).days<=1)return;          /* không làm ai mất ca duy nhất trong tuần */
            var sc=AF.keepFair?-1e6*fairR(st,k)+(q===c.p?0:1e3)+rk*10*afRank():(q===c.p?0:1e6)+rk*1e3*afRank()-weekHoursOf(k,st.id);
            if(sc<bs){bs=sc;best={m:m,st:st,cb:cb,q:q};}
          });
        });
        if(!best)break;
        /* người nhường bỏ phần ca m */
        var rest=shiftsOf(best.cb.s).filter(function(x){return x!==best.m;});
        if(!rest.length)setCell(k,best.st.id,d,null);

function capHours(st,k){
  var day=[];
  for(var d=0;d<7;d++){var a=avail(st,k,d),lv=leaveOn(st.id,k,d),b=0;if(!a||lv==='F'){day.push(0);continue;}
    S.shifts.forEach(function(sh){if(availOk(a,sh.id)&&!blocks(lv,sh.id))b=Math.max(b,hoursOf(sh.id));});day.push(b);}
  return day.sort(function(a,b){return b-a;}).slice(0,Math.min(st.max,6)).reduce(function(s,x){return s+x;},0);
}
function capShifts(st,k){
  var n=0;
  for(var d=0;d<7;d++){var a=avail(st,k,d),lv=leaveOn(st.id,k,d);if(!a||lv==='F')continue;if(S.shifts.some(function(sh){return availOk(a,sh.id)&&!blocks(lv,sh.id);}))n++;}
  return Math.min(n,6);
}
/* Giải thích từng chỗ còn thiếu người: ai đã đăng ký ca đó và vì sao không xếp được */
function gapReasons(k,d,shId,pid){
  var out=[];
  S.staff.forEach(function(st){
    if(!employed(st,addDays(k,d)))return;
    var a=avail(st,k,d);if(!a||!availOk(a,shId))return;
    var lv=leaveOn(st.id,k,d),c=getCell(k,st.id,d),info=staffInfo(k,st),p=pos(pid),why;
    if(blocks(lv,shId))why='nghỉ phép';
    else if(st.skills.indexOf(pid)<0)why='chưa được đào tạo '+(p?p.name:'vị trí này');
    else if(c&&c.s==='O')why='đã đặt Nghỉ ngày này';
    else if(c&&covers(c.s,shId))why='đang làm '+(pos(c.p)?pos(c.p).name:'vị trí khác')+' ca này';
    else if(c&&st.role==='FT'&&!ftMulti(st,k))why='FT đã có ca '+shiftLabel(c.s)+' (FT làm 1 ca/ngày, trừ khi đăng ký nhiều ca)';
    else if(c&&!ftDayMode(st)&&info.load>=st.max)why='đã có ca '+shiftLabel(c.s)+', đã đủ '+st.max+' ca tối đa trong tuần';
    else if(c)why='ghép thêm được ca này: bấm Tự xếp lịch';
    else if(info.load>=st.max)why='đã đủ '+st.max+' ca tối đa trong tuần';
    else if(info.days>=6)why='đã làm 6 ngày (cần 1 ngày nghỉ)';
    else why='xếp được: bấm Tự xếp lịch hoặc bấm vào ô để xếp';
    out.push({st:st,why:why});
  });
  return out;
}
/* Phần giờ đăng ký chưa được xếp của 1 người 1 ngày, kèm lý do (xét theo thứ tự, lý do đầu tiên đúng thì dừng) */
function regMiss(k,st,d,cov){
  var a=avail(st,k,d);if(!a||a==='A')return null;
  var R=regList(a);if(!R.length)return null;
  var c=getCell(k,st.id,d),have=(c&&c.s!=='O')?shiftsOf(c.s):[];
  var miss=R.filter(function(id){return !have.some(function(x){return x===id||overlapIds([x],id);});});
  if(!miss.length)return null;
  var lv=leaveOn(st.id,k,d),info=staffInfo(k,st),why,kind;
  /* ca cần người trùng giờ với phần chưa xếp, ở vị trí đã đào tạo / chưa đào tạo */
  var trained=[],other=[],full=[];
  S.shifts.forEach(function(sh){
    if(isComp(sh.id)||!miss.some(function(m){return m===sh.id||overlapIds([m],sh.id);}))return;
    if(!availOk(a,sh.id)||have.some(function(x){return overlapIds([x],sh.id);}))return;
    S.positions.forEach(function(pp){var n=needF(d,sh.id,pp.id);if(!n)return;var g=n-cov[d][sh.id][pp.id];
      if(st.skills.indexOf(pp.id)<0){if(g>0)other.push(pp.name);}else if(g>0)trained.push(pp.name);else full.push(pp.name);});
  });
  function uniq(L){return L.filter(function(x,i){return L.indexOf(x)===i;});}
  if(st.quitDate&&addDays(k,d)>st.quitDate){why='đã nghỉ việc';kind='quit';}
  else if(blocks(lv,miss.join(','))){why='nghỉ phép';kind='leave';}
  else if(c&&c.s==='O'){why=c.sw?'đã đổi ca / nhờ người thay':'CHT đặt Nghỉ ngày này';kind='off';}
  else if(!st.skills.length){why='chưa chọn vị trí đã đào tạo';kind='skill';}
  else if(trained.length){
    if(!c&&info.days>=6){why='đã làm 6 ngày trong tuần (cần 1 ngày nghỉ)';kind='cap';}
    else if(!ftDayMode(st)&&info.load>=st.max){why='đã đủ '+st.max+' ca tối đa/tuần (sửa ở tab Thiết lập nhân viên)';kind='cap';}
    else if(c&&st.role==='FT'&&!ftMulti(st,k)){why='FT làm 1 ca/ngày (trừ khi đăng ký nhiều ca)';kind='cap';}
    else{why='còn thiếu người ở '+uniq(trained).join(', ')+': bấm Tự xếp lịch để xếp';kind='open';}
  }
  else if(full.length){why='định biên đã đủ người ở vị trí đã đào tạo ('+uniq(full).join(', ')+')';kind='full';}
  else if(other.length){why='chỗ còn thiếu là vị trí chưa đào tạo: '+uniq(other).join(', ');kind='untrained';}
  else{why='giờ này không có định biên cần người';kind='nodem';}
  return {d:d,reg:regShort(a),have:have.length?shiftLabel(c.s):'',miss:shiftLabel(miss.join(',')),why:why,kind:kind};
}
var MISS_KIND={full:'Định biên đã đủ',nodem:'Giờ đăng ký không có định biên',untrained:'Chỗ thiếu là vị trí chưa đào tạo',cap:'Đã đủ ca tối đa / ngày nghỉ',open:'Còn xếp được',off:'CHT đặt Nghỉ / đổi ca',leave:'Nghỉ phép',quit:'Đã nghỉ việc',skill:'Chưa chọn vị trí'};

  if(!rows.length)return '<section class="issues"><h3>Đăng ký nhưng chưa được xếp đủ</h3><p class="sm">Mọi giờ đã đăng ký đều đã được xếp.</p></section>';
  var noneDays=rows.filter(function(r){return !r.have;}).length;
  var h='<details class="issues gaps fold"><summary><h3>Đăng ký nhưng chưa được xếp đủ <span class="count">'+rows.length+'</span></h3></summary>'

function payroll(from,to){
  var rows=[],byId={},empty=0;
  S.staff.forEach(function(st){var r={st:st,n:{},shifts:0,hours:0,days:[],dset:{},leave:0};rows.push(r);byId[st.id]=r;});
  eachDate(from,to,function(dk){
    var k=mondayOf(parseKey(dk)),d=dow(dk),any=false;
    S.staff.forEach(function(st){
      var r=byId[st.id];if(leaveOn(st.id,k,d)==='F')r.leave++;
      var c=getCell(k,st.id,d);if(!c||c.s==='O')return;any=true;
      var h=hoursOf(c.s);r.shifts+=load(c.s);r.hours+=h;r.dset[dk]=1;
      var U=c.s==='F'?[]:units(shiftsOf(c.s));
      if(U.length)U.forEach(function(u){r.n[u.id]=(r.n[u.id]||0)+1;r.days.push({dk:dk,s:u.id,p:posOf(c,shiftsOf(u.id)[0]),h:+u.hours||0});});
      else{r.n[c.s]=(r.n[c.s]||0)+1;r.days.push({dk:dk,s:c.s,p:c.p,h:h});}
    });
    if(!any)empty++;
  });
  rows=rows.filter(function(r){return act(r.st)||r.shifts>0;});
  rows.sort(function(a,b){return String(a.st.code||'~').localeCompare(String(b.st.code||'~'))||a.st.name.localeCompare(b.st.name);});
  return {pt:rows.filter(function(r){return r.st.role!=='FT';}),ft:rows.filter(function(r){return r.st.role==='FT';}),empty:empty};
}

/* nghỉ việc: last = ngày làm cuối (YYYY-MM-DD); gỡ ca và đăng ký sau ngày đó */
function quitStaff(sid,last){
  var s=staffById(sid);if(!s)return 0;
  s.quitDate=last;var n=0;
  Object.keys(S.weeks).forEach(function(wk){if(addDays(wk,6)<=last)return;for(var d=0;d<7;d++){if(addDays(wk,d)<=last)continue;if(getCell(wk,sid,d)){setCell(wk,sid,d,null);n++;}}});
  Object.keys(S.reg).forEach(function(wk){var r=S.reg[wk]&&S.reg[wk][sid];if(!r||addDays(wk,6)<=last)return;if(wk>last){delete S.reg[wk][sid];return;}for(var d=0;d<7;d++)if(addDays(wk,d)>last)r[d]='';});
  Object.keys(S.leaves).forEach(function(id){var L=S.leaves[id];if(L.sid!==sid)return;if(L.from>last)delete S.leaves[id];else if(L.to>last)L.to=last;});LIDX=null;
  return n;
}
function openQuit(sid,def){

  if(def){if(def.reason)m.querySelector('#quit-reason').value=def.reason;if(def.note)m.querySelector('#quit-note').value=def.note;}
  function info(){var last=inp.value||todayKey(),n=0;Object.keys(S.weeks).forEach(function(wk){for(var d=0;d<7;d++){if(addDays(wk,d)>last&&getCell(wk,sid,d))n++;}});m.querySelector('#quit-info').textContent=n?'Sẽ gỡ '+n+' ca đã xếp sau ngày '+dm(last)+'.':'Không có ca nào đã xếp sau ngày '+dm(last)+'.';}

  });
}

/* ---------- MISA: mã ca và file phân ca ---------- */
function misaMissing(ids){var m=[];ids.forEach(function(id){if(id==='F')return;var sh=shift(id);if(sh&&!String(sh.misa||'').trim())m.push(sh.name);});return m;}
function misaDups(){var seen={},d=[];S.shifts.forEach(function(sh){var n=norm(sh.misa);if(!n)return;if(seen[n]&&d.indexOf(sh.misa)<0)d.push(sh.misa);seen[n]=1;});return d;}
function misaReady(){return !misaMissing(S.shifts.map(function(s){return s.id;})).length&&!misaDups().length;}
function misaStatus(){var miss=misaMissing(S.shifts.map(function(s){return s.id;}));
  var dup=misaDups();
  if(miss.length)return '<span class="ierr">Ca chưa có mã MISA: '+esc(miss.join(', '))+'. Nhập đủ mã để đăng ký ca và file MISA dùng đúng mã.</span>';
  if(dup.length)return '<span class="ierr">Mã ca bị trùng: '+esc(dup.join(', '))+'. Mỗi ca một mã riêng.</span>';
  return '<span class="ok-t">Đủ mã ca MISA.</span> Cả ngày, Nghỉ, Nghỉ phép chỉ điền nếu MISA có mã riêng; để trống thì người làm cả ngày được ghi các mã ca cách nhau bằng "; " (chấm phẩy và dấu cách), ngày nghỉ để trống.';}
function misaPanel(){
  var h='<section class="panel" id="misa-panel"><div class="panel-h"><h2>Mã ca trên MISA</h2><p>Lịch xếp xong được xuất ra file phân ca để nhập vào MISA chấm công. Nhập mã ca giống hệt mã đã thiết lập trên MISA cho từng ca của site. Mã nhân viên trên công cụ cũng phải trùng mã nhân viên trên MISA.</p></div><div class="flist">';
  h+='<div class="frow misa head"><span>Ca trên công cụ</span><span>Giờ</span><span>Mã ca MISA</span></div>';
  S.shifts.forEach(function(sh,i){h+='<div class="frow misa"><span class="shn">'+shDot(i)+esc(sh.name)+'</span><span class="mono sm">'+esc(sh.time)+'</span><input class="in mono" id="misa-'+sh.id+'" data-f="shmisa" data-id="'+sh.id+'" value="'+esc(sh.misa||'')+'" placeholder="Bắt buộc" autocomplete="off" aria-label="Mã ca MISA của ca '+esc(sh.name)+'"></div>';});
  if(S.shifts.length>1)h+='<div class="frow misa"><span class="shn">'+shDot(-1)+'Cả ngày</span><span class="sm muted">làm tất cả các ca</span><input class="in mono" id="misa-full" data-f="misafull" value="'+esc(S.misa.full||'')+'" placeholder="Bắt buộc nếu có xếp cả ngày" autocomplete="off" aria-label="Mã ca MISA khi làm cả ngày"></div>';
  h+='<div class="frow misa"><span class="shn">Nghỉ, không có ca</span><span class="sm muted">ô trống hoặc Nghỉ</span><input class="in mono" id="misa-off" data-f="misaoff" value="'+esc(S.misa.off||'')+'" placeholder="Để trống" autocomplete="off" aria-label="Mã MISA cho ngày nghỉ"></div>';
  h+='<div class="frow misa"><span class="shn">Nghỉ phép</span><span class="sm muted">ngày ghi nhận nghỉ phép</span><input class="in mono" id="misa-leave" data-f="misaleave" value="'+esc(S.misa.leave||'')+'" placeholder="Để trống" autocomplete="off" aria-label="Mã MISA cho ngày nghỉ phép"></div>';
  return h+'</div><p class="sm" id="misa-status">'+misaStatus()+'</p></section>';
}
function misaVal(c){
  if(!c||!c.s)return String(S.misa.off||'').trim();
  if(c.s==='O')return String((c.lv&&S.misa.leave)||S.misa.off||'').trim();
  if(c.s==='F')return String(S.misa.full||'').trim()||S.shifts.map(function(x){return String(x.misa||'').trim();}).join('; ');
  return units(shiftsOf(c.s)).map(function(x){return String(x.misa||'').trim();}).join('; ');
}
function misaSig(k){
  var s=stable({w:S.weeks[k]||{},m:S.shifts.map(function(x){return x.id+'='+(x.misa||'');}),o:S.misa,c:S.staff.map(function(x){return x.id+'='+(x.code||'');})}),hh=5381;
  for(var i=0;i<s.length;i++)hh=((hh<<5)+hh+s.charCodeAt(i))|0;
  return (hh>>>0).toString(36);
}
function misaWeeksIn(from,to){var out=[];eachDate(from,to,function(dk){if(dow(dk)===0&&addDays(dk,6)<=to)out.push(dk);});return out;}
function exportMisa(from,to){
  if(!(from&&to&&from<=to&&countDays(from,to)<=62)){toast('Chọn khoảng ngày hợp lệ, tối đa 62 ngày.');return;}
  var dates=[];eachDate(from,to,function(dk){dates.push(dk);});
  var used={},staff=S.staff.filter(function(st){return !st.quitDate||st.quitDate>=from;}).slice().sort(function(a,b){return String(a.code||'~').localeCompare(String(b.code||'~'))||a.name.localeCompare(b.name);});
  var grid=staff.map(function(st){return dates.map(function(dk){if(!employed(st,dk))return null;var c=getCell(mondayOf(parseKey(dk)),st.id,dow(dk));if(c&&c.s&&c.s!=='O'){if(c.s==='F')used.F=1;else shiftsOf(c.s).forEach(function(id){used[id]=1;});}return c||{};});});
  if(!Object.keys(used).length){toast('Khoảng ngày này chưa có ca nào được xếp.');return;}
  var miss=misaMissing(S.shifts.map(function(x){return x.id;}).filter(function(id){return used[id];}).concat(used.F?['F']:[]));
  if(miss.length){
    if(canEdit()){view.tab='demand';render();var el=document.getElementById('ca-panel');if(el)el.scrollIntoView({block:'start'});}
    toast('Ca chưa có mã MISA: '+miss.join(', ')+'. '+(canEdit()?'Nhập mã ở Thiết lập site → Ca làm rồi xuất lại.':'CHT của site cần nhập mã ca MISA trước.'),9000);return;
  }
  var noCode=staff.filter(function(st,i){return !String(st.code||'').trim()&&grid[i].some(function(c){return c&&c.s&&c.s!=='O';});});
  var name='Phan_ca_MISA_'+siteSlug()+'_'+from+'_'+to+'.xlsx',wks=misaWeeksIn(from,to);
  withExcel(function(EJ){
    var wb=new EJ.Workbook();wb.creator=TITLE;
    misaBangPhanCa(wb,dates,staff.map(function(st,i){return {code:st.code,name:st.name,
      vals:grid[i].map(function(c){return c===null?null:misaVal(c);}),
      fills:grid[i].map(function(c){var pq=c&&c.s&&c.s!=='O'?pos(c.p):null;return pq?posArgb(pq):null;})};}));
    var l=wb.addWorksheet('Danh sách'),ref=wb.addWorksheet('Mã ca');
    xHeader(l,[['STT',6],['Mã nhân viên',14],['Họ và tên',24],['Ngày',12],['Mã ca MISA',16],['Ca trên công cụ',16],['Giờ ca',14],['Vị trí',18],['Ghi chú',14]]);
    var r=2;
    staff.forEach(function(st,i){grid[i].forEach(function(c,j){
      if(!c||!c.s)return;var v=misaVal(c);if(c.s==='O'&&!v)return;
      var sh=(c.s==='O'||c.s==='F')?null:shift(c.s),p=c.p?{name:posList(c).map(function(x){return pos(x)?pos(x).name:'';}).join(' + ')}:null;
      [r-1,st.code||'',st.name,xDate(dates[j]),v,c.s==='O'?(c.lv?'Nghỉ phép':'Nghỉ'):shiftLabel(c.s),sh?sh.time:'',p?p.name:'',c.sw?'Đổi ca':''].forEach(function(x,q){l.getCell(r,q+1).value=x;});
      l.getCell(r,4).numFmt='dd/mm/yyyy';var pq2=(c.s&&c.s!=='O')?pos(c.p):null;if(pq2){xFill(l.getCell(r,5),posArgb(pq2));xFill(l.getCell(r,8),posArgb(pq2));}r++;});});
    xHeader(ref,[['Ca trên công cụ',22],['Giờ ca',16],['Mã ca MISA',14]]);
    var rows=S.shifts.map(function(sh){return [sh.name,sh.time,sh.misa||''];});
    if(S.shifts.length>1)rows.push(['Cả ngày','làm tất cả các ca',S.misa.full||'(các mã ca, cách nhau bằng "; ")']);
    rows.push(['Nghỉ, không có ca','',S.misa.off||'(để trống)']);rows.push(['Nghỉ phép','',S.misa.leave||S.misa.off||'(để trống)']);
    rows.forEach(function(a,i){a.forEach(function(x,q){ref.getCell(i+2,q+1).value=x;});});
    var nr=rows.length+3;ref.getCell(nr,1).value='Site: '+(S.site||'')+' · Kỳ: '+dm(from)+'/'+from.slice(0,4)+' – '+dm(to)+'/'+to.slice(0,4);
    ref.getCell(nr+1,1).value='Trang Bang_phan_ca đúng mẫu nhập khẩu bảng phân ca của MISA: chọn trang này khi nhập khẩu. Trang Danh sách: mỗi dòng 1 ca đã xếp, để đối chiếu.';
    [nr,nr+1].forEach(function(x){ref.getCell(x,1).font={name:'Arial',italic:true,color:{argb:XGREY}};});
    var lg=nr+3;ref.getCell(lg,1).value='Màu ô ở trang Bang_phan_ca = vị trí:';ref.getCell(lg,1).font={name:'Arial',bold:true};S.positions.forEach(function(pp,q){var lc0=ref.getCell(lg+1+q,1);lc0.value=pp.name;xFill(lc0,posArgb(pp));});
    return wb;
  },name,function(){
    if(canEdit()&&wks.length){var at=new Date().toISOString();wks.forEach(function(k){S.misaOut[k]={at:at,sig:misaSig(k)};});
      var ks=Object.keys(S.misaOut).sort();while(ks.length>30)delete S.misaOut[ks.shift()];markDirty();softRender();}
    if(noCode.length)toast('Đã lưu '+name+'. Lưu ý: '+noCode.length+' người chưa có mã nhân viên ('+noCode.slice(0,3).map(function(s){return s.name;}).join(', ')+(noCode.length>3?'…':'')+'), MISA sẽ không nhận các dòng này.',10000);
  });
}

    (function walk(start,pick){

function findWeekTop(rows){

    for(var j=0;j<r.length;j++){if(!/^tuan bat dau/.test(norm(r[j])))continue;
      for(var q=j+1;q<r.length;q++){var v=cellOf(r,q);if(!v)continue;var dk=parseDate(v,'dmy');if(dk)return mondayOf(parseKey(dk));}}}
  return null;
}

var REG_FIELDS=[['ts','Dấu thời gian',['dau thoi gian','timestamp','thoi gian gui']],
  ['week','Tuần đăng ký',['tuan bat dau','tuan dang ky','tuan','week']],
  ['code','Mã NV',['ma nv','ma nhan vien','msnv','manv','ma so','id','code','ma']],
  ['name','Họ tên',['ho va ten','ho ten','ten nhan vien','ten','name']]];
function dayOfHeader(hd){
  var n=norm(hd),m=n.match(/\[([^\]]+)\]/),t=(m?m[1]:n).trim().replace(/\s*\(?\d{1,2}\/\d{1,2}(\/\d{2,4})?\)?$/,'').trim(),x;
  if(/^(cn|chu nhat)$/.test(t))return 6;
  if((x=t.match(/^(?:t|thu)\s*([2-7])$/)))return +x[1]-2;
  if((x=t.match(/^thu (hai|ba|tu|nam|sau|bay)$/)))return ['hai','ba','tu','nam','sau','bay'].indexOf(x[1]);
  return -1;
}
function regDetect(header){
  var m=detect(header,REG_FIELDS);for(var d=0;d<7;d++)m['d'+d]=-1;
  header.forEach(function(hd,i){if(i===m.ts||i===m.week||i===m.code||i===m.name)return;var dd=dayOfHeader(hd);if(dd>=0&&m['d'+dd]<0)m['d'+dd]=i;});
  return m;
}
function headerFor(kind,rows){
  var fn=kind==='reg'?regDetect:function(hd){return detect(hd,STAFF_FIELDS);},best=0,bs=-1;
  for(var i=0;i<Math.min(5,rows.length);i++){var mp=fn(rows[i]),sc=Object.keys(mp).filter(function(x){return mp[x]>=0;}).length;if(sc>bs){bs=sc;best=i;}}
  return {hdr:best,map:fn(rows[best]||[])};
}
function parseRegVal(v){
  var n=norm(v);if(!n)return '';
  var exact=S.shifts.filter(function(sh){return norm(sh.name)===n||(sh.misa&&norm(sh.misa)===n);})[0];if(exact)return exact.id;
  if(S.misa.full&&n===norm(S.misa.full))return 'A';
  if((S.misa.off&&n===norm(S.misa.off))||(S.misa.leave&&n===norm(S.misa.leave)))return '';
  if(/^(nghi|khong|khong lam|khong dang ky|off|-|0)$/.test(n))return '';
  if(/ca ngay|full|^x$|^a$|^co$|^ok$|ca nao cung duoc/.test(n))return 'A';
  var exactOf=function(t){return S.shifts.filter(function(sh){var sn=norm(sh.name);return t===norm(sh.id)||t===sn||t==='ca '+sn||(sh.misa&&t===norm(sh.misa));});};
  /* tên ca có thể chứa dấu phẩy (vd 8,0-12,5): thử tách theo dấu + và ; trước */
  var t1=n.split(/\s*[+;]\s*|\s+va\s+/).filter(function(x){return x;});
  if(t1.length>1&&t1.every(function(t){return exactOf(t).length;})){var ids1=[];t1.forEach(function(t){exactOf(t).forEach(function(sh){if(ids1.indexOf(sh.id)<0)ids1.push(sh.id);});});return S.shifts.map(function(sh){return sh.id;}).filter(function(id){return ids1.indexOf(id)>=0;}).join(',');}
  var toks=n.split(/\s*[,;+\/&]\s*|\s+va\s+|\s+hoac\s+/),hit=[];
  toks.forEach(function(t){var ex=exactOf(t);(ex.length?ex:S.shifts.filter(function(sh){var sn=norm(sh.name);return sn.length>=3&&t.indexOf(sn)>=0;})).forEach(function(sh){if(hit.indexOf(sh.id)<0)hit.push(sh.id);});});
  if(!hit.length)[['sang'],['trua'],['chieu'],['toi','dem']].forEach(function(ws){if(ws.some(function(w){return n.indexOf(w)>=0;})){var m=S.shifts.filter(function(sh){return ws.some(function(w){return norm(sh.name).indexOf(w)>=0;});})[0];if(m&&hit.indexOf(m.id)<0)hit.push(m.id);}});
  if(!hit.length)return '';if(hit.length>=S.shifts.length)return 'A';
  return S.shifts.map(function(sh){return sh.id;}).filter(function(id){return hit.indexOf(id)>=0;}).join(',');
}
function regRecs(rows,hdr,m,fbWeek){
  var body=rows.slice(hdr+1),fmt=detectFmt(body.map(function(r){return cellOf(r,m.week);}));
  return body.map(function(r){
    var g=function(f){return cellOf(r,m[f]);};
    var wd=m.week>=0?parseDate(g('week'),fmt):null,wk=wd?mondayOf(parseKey(wd)):(m.week<0?fbWeek:null);

function pct(a,b){return b?Math.round(a/b*1000)/10:100;}
function fmtPct(x){return (Math.round(x*10)/10).toLocaleString('vi-VN',{maximumFractionDigits:1})+'%';}
function kpiCalc(from,to,inc){
  var R={need:0,ok:0,short:0,over:0,shifts:0,shiftsMet:0,needH:0,schedH:0,days:[],pos:{},gaps:[],skipped:0,counted:0};
  S.positions.forEach(function(p){R.pos[p.id]={p:p,need:0,ok:0,short:0,over:0};});
  var cc={};
  eachDate(from,to,function(dk){
    var k=mondayOf(parseKey(dk)),d=dow(dk),any=false,hh=0;
    S.staff.forEach(function(st){var c=getCell(k,st.id,d);if(c&&c.s!=='O'){any=true;hh+=hoursOf(c.s);}});
    if(!any&&!inc){R.skipped++;return;}
    R.counted++;
    var cov=cc[k]||(cc[k]=coverage(k)),row={dk:dk,need:0,ok:0,short:0,over:0,sm:0,sn:0,h:hh,nh:0};
    S.shifts.forEach(function(sh){
      var met=true,has=false;
      S.positions.forEach(function(p){
        var n=needF(d,sh.id,p.id),hv=cov[d][sh.id][p.id],o=Math.min(n,hv),P=R.pos[p.id];
        if(n)has=true;row.need+=n;row.ok+=o;row.nh+=n*hoursOf(sh.id);P.need+=n;P.ok+=o;
        if(hv<n){row.short+=n-hv;P.short+=n-hv;met=false;R.gaps.push([dk,sh,p,n,hv]);}
        else if(hv>n){row.over+=hv-n;P.over+=hv-n;R.gaps.push([dk,sh,p,n,hv]);}
      });
      if(has){row.sn++;if(met)row.sm++;}
    });
    R.need+=row.need;R.ok+=row.ok;R.short+=row.short;R.over+=row.over;R.shifts+=row.sn;R.shiftsMet+=row.sm;R.needH+=row.nh;R.schedH+=hh;R.days.push(row);
  });
  R.swapList=S.swaps.filter(function(w){return w.date>=from&&w.date<=to;});
  return R;
}

function applyShifts(list,full){

function parsePosRows(rows){

/* ================= WEB QUẢN LÝ NHÂN SỰ =================

function hrPeriod(){if(!HR.from||!HR.to){var m=monthOf(0);HR.from=m.from;HR.to=m.to;}return {from:HR.from,to:HR.to,ok:HR.from<=HR.to&&countDays(HR.from,HR.to)<=62};}
function monthOf(off){var n=new Date(),a=new Date(n.getFullYear(),n.getMonth()+off,1),b=new Date(n.getFullYear(),n.getMonth()+off+1,0);return {from:keyOf(a),to:keyOf(b)};}
function dmy(k){return k?dm(k)+'/'+k.slice(0,4):'';}
function eachDay(a,b,fn){var k=a,n=0;while(k<=b&&n<400){fn(k);k=addDays(k,1);n++;}}
function onRoll(st,dk){return (!st.start||st.start<=dk)&&(!st.quitDate||dk<=st.quitDate);}
function working(st){return onRoll(st,todayKey());}
function tenureM(st,ref){
  if(!st.start)return null;var a=parseKey(st.start),b=parseKey(ref||todayKey());
  var m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth()-(b.getDate()<a.getDate()?1:0);return Math.max(0,m);
}

/* ---------- số liệu ---------- */
function flowStats(staff,from,to){
  var r={head0:0,end:0,ins:[],outs:[],nostart:0,on:0,ft:0,pt:0,multi:0,ten:[],};
  staff.forEach(function(st){
    if((!st.start||st.start<from)&&(!st.quitDate||st.quitDate>=from))r.head0++;
    if((!st.start||st.start<=to)&&(!st.quitDate||st.quitDate>to))r.end++;
    if(st.start&&st.start>=from&&st.start<=to)r.ins.push(st);
    if(st.quitDate&&st.quitDate>=from&&st.quitDate<=to)r.outs.push(st);
    if(working(st)){r.on++;if(st.role==='FT')r.ft++;else r.pt++;if(st.skills.length>=2)r.multi++;if(!st.start)r.nostart++;else r.ten.push(tenureM(st));}
  });
  var avg=(r.head0+r.end)/2;r.rate=avg?r.outs.length/avg*100:0;
  r.tenAvg=r.ten.length?r.ten.reduce(function(a,b){return a+b;},0)/r.ten.length:null;
  return r;
}
function sumFlow(list){
  var t={head0:0,end:0,ins:[],outs:[],nostart:0,on:0,ft:0,pt:0,multi:0,ten:[]};
  list.forEach(function(f){['head0','end','nostart','on','ft','pt','multi'].forEach(function(k){t[k]+=f[k];});t.ins=t.ins.concat(f.ins);t.outs=t.outs.concat(f.outs);t.ten=t.ten.concat(f.ten);});
  var avg=(t.head0+t.end)/2;t.rate=avg?t.outs.length/avg*100:0;
  t.tenAvg=t.ten.length?t.ten.reduce(function(a,b){return a+b;},0)/t.ten.length:null;
  return t;
}
function dailySeries(sites,from,to){
  var out=[];if(to>todayKey())to=todayKey();
  eachDay(from,to,function(dk){var o={dk:dk,head:0,ins:0,outs:0};sites.forEach(function(x){x.s.staff.forEach(function(st){if(onRoll(st,dk))o.head++;if(st.start===dk)o.ins++;if(st.quitDate===dk)o.outs++;});});out.push(o);});
  return out;
}
function weekFill(x){var k=mondayOf(new Date());return withSite(x.s,function(){var st=stats(coverage(k));return {need:st.need,filled:st.filled,sched:hasData(k)};});}
function hrEvents(sites,from,to){
  var ev=[];
  sites.forEach(function(x){x.s.staff.forEach(function(st){
    if(st.start&&st.start>=from&&st.start<=to)ev.push({dk:st.start,t:'in',x:x,st:st});
    if(st.quitDate&&st.quitDate>=from&&st.quitDate<=to)ev.push({dk:st.quitDate,t:'out',x:x,st:st});
  });});
  return ev.sort(function(a,b){return a.dk<b.dk?-1:a.dk>b.dk?1:(a.t===b.t?0:a.t==='in'?-1:1);});
}

  var pts=series.map(function(o,i){return x(i).toFixed(1)+','+y(o.head).toFixed(1);});
  h+='<path class="ar" d="M'+x(0).toFixed(1)+','+(T+ih)+' L'+pts.join(' L')+' L'+x(n-1).toFixed(1)+','+(T+ih)+' Z"/>';

    out.push(withSite(x.s,function(){
      var pr=payroll(from,to),row=pr.pt.concat(pr.ft).filter(function(r){return r.st.id===st.id;})[0],reg=0,got=0;
      eachDay(from,to,function(dk){var k=mondayOf(parseKey(dk)),d=dow(dk),r=S.reg[k]&&S.reg[k][st.id];if(!r)return;var av=r[d];var n2=av==='A'?S.shifts.length:regList(av).length;if(!n2)return;reg+=n2;var c=getCell(k,st.id,d);if(c&&c.s!=='O')got+=Math.min(n2,load(c.s));});
      var sw=x.s.swaps.filter(function(w){return (w.a===st.id||w.b===st.id)&&w.date>=from&&w.date<=to;}).length;

    }));

function hrPatch(x,sid,patch,done){
  var st=x.s.staff.filter(function(s){return s.id===sid;})[0];if(!st)return;
  function put(t){Object.keys(patch).forEach(function(k){if(patch[k])t[k]=patch[k];else delete t[k];});}
  put(st);
  if(ROLE!=='mgr'){markDirty();render();toast('Đã lưu thông tin '+st.name+'.');if(done)done();return;}
  render();toast('Đang lưu…');
  DB.doc(sitePath(x.uid)).get().then(function(sn){
    var d=sn.exists?clone(sn.data()):null,t=d&&(d.staff||[]).filter(function(y){return y.id===sid;})[0];
    if(!t)throw {code:'gone'};
    put(t);d.updatedAt=new Date().toISOString();
    return DB.doc(sitePath(x.uid)).set(d).then(function(){if(x.x)x.x.updatedAt=d.updatedAt;toast('Đã lưu thông tin '+st.name+'. CHT thấy thay đổi sau khoảng 1 phút.',6000);if(done)done();});
  }).catch(function(e){toast(e&&e.code==='gone'?'Không tìm thấy nhân viên này trên máy chủ, bấm Làm mới số liệu.':'Chưa lưu được: '+dbErrMsg(e),8000);});
}

/* điểm cộng: [mã, điểm/lần, tối đa/tháng, tên, cách ghi] — auto: web tự lấy; link: cần link ảnh; with: chọn NV mới được kèm */

/* ---------- tiện ích ---------- */
function meName(){return (window.XC_ME&&(window.XC_ME.name||window.XC_ME.user))||(ROLE==='demo'?'Site mẫu':'');}

/* nghiệp vụ thu ngân: Thu ngân và Soát vé (giữ vé, vòng tay, tiền theo SOP 4.4C); các vị trí khác là hướng dẫn */
function posRole(s,pid){var n=norm(posName(s,pid));return n.indexOf('thu ngan')>=0||n.indexOf('cashier')>=0||n.indexOf('soat ve')>=0?'cash':'guide';}
/* nghiệp vụ nhóm IV trong tuần: theo các vị trí đã xếp trong tuần (có thể cả thu ngân và hướng dẫn); chưa có lịch thì theo vị trí ưu tiên; CHT chỉnh được (e.iv) */
function weekRoles(s,st,wk){
  var r={};withSite(s,function(){for(var d=0;d<7;d++){var c=getCell(wk,st.id,d);if(c&&c.s!=='O')posList(c).forEach(function(pid){if(posName(s,pid))r[posRole(s,pid)]=1;});}});

}

/* các mục chấm của một người trong tuần; không truyền tuần thì trả mọi mục (để chọn mục cần cải thiện) */
function scItems(s,st,wk,e){
  var roles=wk?ivRoles(s,st,wk,e):['cash','guide'],out=[];

    roles.forEach(function(k){SC_IV[k].forEach(function(it){out.push({id:it[0],p:it[1],t:it[2],src:it[3],g:'IV',role:k});});});

}
/* điểm của một mục: số nguyên 0 → tối đa */
function mval(it,v){if(v==null||v==='')return null;var n=+v;return isNaN(n)?null:Math.max(0,Math.min(it.p,n));}
function itemText(id){var r='';SC_GROUPS.concat([{items:SC_IV.cash.concat(SC_IV.guide)}]).forEach(function(G){G.items.forEach(function(it){if(it[0]===id)r=it[2];});});if(id==='att')r='Chuyên cần & kỷ luật ca';return r||id;}
function scDeadline(wk){var a=wk.split('-').map(Number);return Date.UTC(a[0],a[1]-1,a[2]+7,5,0,0);}
function scLocked(uid,wk){if(ROLE==='mgr')return false;var d=HRD[uid]&&HRD[uid].sc[wk],open=d&&d.reopen&&new Date(d.reopen).getTime()>Date.now();return Date.now()>scDeadline(wk)&&!open;}
function scEntry(uid,wk,sid){var d=HRD[uid]&&HRD[uid].sc[wk];return (d&&d.staff&&d.staff[sid])||null;}
function inWeekSt(st,wk){return (!st.start||st.start<=addDays(wk,6))&&(!st.quitDate||st.quitDate>=wk);}
function weekDays(s,st,wk){return withSite(s,function(){var n=0;for(var d=0;d<7;d++){var c=getCell(wk,st.id,d);if(c&&c.s!=='O')n++;}return n;});}
function shiftsBetween(s,st,a,b){return withSite(s,function(){var n=0;eachDay(a,b,function(dk){var c=getCell(mondayOf(parseKey(dk)),st.id,dow(dk));if(c&&c.s!=='O')n+=load(c.s);});return n;});}
/* nghỉ gấp: nghỉ phép được ghi nhận vào chính ngày nghỉ hoặc ngày liền trước (dưới 24 giờ) */

}
function scCalc(s,st,wk,e){
  var items=scItems(s,st,wk,e),r={state:'none',g:{I:0,II:0,III:0,IV:0,V:20},total:null,marked:0,need:items.length,liet:false,faults:[],warns:0,nonD:[],noshow:false,iv:{},roles:ivRoles(s,st,wk,e)};

/* ---------- tải và ghi dữ liệu ---------- */
function hrdLoad(uids,force){
  var need=uids.filter(function(u){var h=HRD[u];return force||!h||(!h.ok&&!h.busy);});
  if(!need.length)return;
  need.forEach(function(u){var h=HRD[u]||(HRD[u]={sc:{},bn:{},pip:{},ot:{},ok:false});h.busy=true;});
  if(ROLE==='demo'||!DB){need.forEach(function(u){HRD[u].ok=true;HRD[u].busy=false;});pipAutoNew();return;}
  Promise.all(need.map(function(u){
    return Promise.all(['sc','bn','pip','ot'].map(function(k){return DB.collection(sitePath(u)+'/'+k).get();})).then(function(r){
      var h={sc:{},bn:{},pip:{},ot:{},ok:true,busy:false,at:Date.now()};['sc','bn','pip','ot'].forEach(function(k,i){r[i].docs.forEach(function(d){h[k][d.id]=d.data();});});HRD[u]=h;
    },function(e){HRD[u].busy=false;HRD[u].ok=true;HRD[u].err=dbErrMsg(e);});
  })).then(function(){pipAutoNew();render();});
}

function hrdWrite(uid,kind,id,fn,okMsg){
  var c=HRD[uid]&&HRD[uid][kind];if(!c)return Promise.resolve(null);
  function done(d){c[id]=d;render();if(okMsg)toast(typeof okMsg==='function'?okMsg(d):okMsg,6000);return d;}
  if(ROLE==='demo'||!DB){var d0=c[id]?clone(c[id]):{};if(fn(d0)===false)return Promise.resolve(null);return Promise.resolve(done(d0));}
  var path=sitePath(uid)+'/'+kind+'/'+id;
  return DB.doc(path).get().then(function(sn){
    var d=sn.exists?sn.data():{};if(fn(d)===false)return null;
    return DB.doc(path).set(d).then(function(){return done(d);});
  }).catch(function(e){toast('Chưa lưu được: '+(e&&e.message&&e.code!=='unavailable'?e.message:dbErrMsg(e)),9000);return null;});
}

/* ---------- phiếu theo dõi: trạng thái ---------- */
function pipsOf(uid,sid){var h=HRD[uid];if(!h)return [];return Object.keys(h.pip).map(function(k){return h.pip[k];}).filter(function(p){return p&&p.sid===sid;}).sort(function(a,b){return a.opened<b.opened?-1:1;});}
function pipClosed(p){return !!(p.decision&&(p.decision.v==='keep'||p.decision.v==='quit'));}
function pipWeeks(p){var out=[],wk=mondayOf(parseKey(p.direct?addDays(p.opened,-28):p.opened)),end=p.end?p.end.at.slice(0,10):todayKey();while(wk<=end){out.push(wk);wk=addDays(wk,7);}return out;}
/* các tuần dùng để đánh giá: tuần trong kỳ (tới tuần chứa ngày hạn), tuần sau đó chỉ tính khi đã chấm xong; bỏ tuần chưa tới hạn chấm mà chưa chấm */
function pipCalcs(x,st,p){
  var lastWk=mondayOf(parseKey(p.due)),out=[];
  pipWeeks(p).forEach(function(wk){if(!inWeekSt(st,wk))return;var c=scCalc(x.s,st,wk,scEntry(x.uid,wk,st.id));if(c.state==='skip')return;if(wk>lastWk&&c.state!=='done')return;if(c.state!=='done'&&Date.now()<scDeadline(wk))return;c.wk=wk;out.push(c);});
  return out;
}
function pipShifts(x,st,p){return shiftsBetween(x.s,st,p.opened,todayKey());}
function pipDue(x,st,p){var sh=pipShifts(x,st,p),t=todayKey();return {shifts:sh,reached:!!p.direct||(t>=p.due&&sh>=6),short:t>=p.due&&sh<6};}
function pipStep(x,st,p){
  var t=todayKey();if(pipClosed(p))return {k:'closed',l:p.decision.v==='keep'?'Đã kết thúc · làm tiếp':'Đã kết thúc · cho nghỉ'};
  if(p.end)return {k:'review',l:'Chờ quản lý duyệt',late:t>addDays(p.end.at.slice(0,10),2)};
  if(!p.talk||!p.talk.signed)return {k:'talk',l:'② Chờ trao đổi & ký xác nhận',late:t>addDays(p.opened,2)};
  var du=pipDue(x,st,p);
  if(du.reached)return {k:'end',l:'④ Cần đánh giá lại',late:t>addDays(p.due,2)};
  if(t>=addDays(p.opened,7)&&!p.mid)return {k:'mid',l:'③ Cần kiểm tra giữa kỳ'};
  return {k:'watch',l:du.short?'Đang theo dõi · chưa đủ 6 ca, tự kéo dài':'Đang theo dõi'};
}
function goalLabel(g){return g.t?g.t:g.a==='item'?'Đạt ở mọi tuần: '+itemText(g.id):GOAL[g.a]||g.a;}
/* kết quả mục tiêu: true / false / null (chưa đủ dữ liệu); mục tiêu tự ghi do CHT đánh dấu */
function goalEval(x,st,p,g,i){
  if(g.t)return p.end&&p.end.res?p.end.res[i]:null;
  var ws=pipCalcs(x,st,p);
  if(!ws.length||ws.some(function(c){return c.state!=='done';}))return ws.some(function(c){return c.state==='done'&&!goalOk(g,c);})?false:null;
  return ws.every(function(c){return goalOk(g,c);});
}
function goalOk(g,c){if(g.a==='w75')return c.total>=75;if(g.a==='safe')return c.g.I===30;if(g.a==='att')return !c.faults.some(function(f){return f.ex==null;});if(g.a==='item')return c.nonD.indexOf(g.id)<0;return true;}
function pipDossier(x,st,p){
  var miss=[];if(!p.talk||!p.talk.signed)miss.push('nhân viên ký xác nhận (bước ②)');
  if(!p.direct&&!p.mid)miss.push('kiểm tra giữa kỳ (bước ③)');
  var ws=pipCalcs(x,st,p);
  if(!ws.some(function(c){return c.state==='done';})||ws.some(function(c){return c.state!=='done';}))miss.push('phiếu chấm đủ các tuần trong kỳ');
  return miss;
}
/* cờ cần mở phiếu: xét 8 tuần gần nhất, chỉ các tuần sau phiếu gần nhất đã đóng */
function scFlags(x,st){
  var h=HRD[x.uid];if(!h||!h.ok)return [];
  var ps=pipsOf(x.uid,st.id);if(ps.some(function(p){return !pipClosed(p);}))return [];
  var lastClose=ps.reduce(function(m,p){return p.closedAt&&p.closedAt>m?p.closedAt:m;},''),wk0=mondayOf(new Date()),out=[],prev=null,byM={};
  for(var i=8;i>=0;i--){
    var wk=addDays(wk0,-7*i);if(lastClose&&addDays(wk,6)<=lastClose)continue;if(!inWeekSt(st,wk))continue;
    var c=scCalc(x.s,st,wk,scEntry(x.uid,wk,st.id)),fd=addDays(wk,7),lb='tuần '+isoWeek(wk)+' ('+dm(wk)+')',ym=addDays(wk,3).slice(0,7);
    if(c.state==='skip')continue;
    if(c.state!=='done'){prev=null;if(!c.faults.length&&!c.liet&&!c.warns)continue;}
    if(c.state==='done'&&c.total<60)out.push({d:fd,t:'Điểm '+lb+' là '+fmtSc(c.total)+' (dưới 60)'});
    if(c.state==='done'&&prev&&prev.c.total<75&&c.total<75)out.push({d:fd,t:'2 tuần liên tiếp dưới 75 ('+fmtSc(prev.c.total)+' và '+fmtSc(c.total)+')'});
    if(c.liet)out.push({d:fd,t:'Điểm liệt an toàn '+lb});
    if(c.warns)out.push({d:fd,t:'Cảnh cáo văn bản '+lb});
    if(c.noshow)out.push({d:fd,t:'Bỏ ca không báo '+lb});

    c.nonD.forEach(function(id){M.items[id]=(M.items[id]||0)+1;if(M.items[id]===2)out.push({d:fd,t:'Tái phạm 2 tuần trong '+ymLabel(ym).toLowerCase()+': '+itemText(id)});});

/* mở phiếu thẳng sang bước duyệt: tái phạm trong 4 tuần sau theo dõi, hoặc đã 2 lần vào diện trong 6 tháng */
function pipDirect(x,st){
  var ps=pipsOf(x.uid,st.id),t=todayKey();
  var keep=ps.filter(function(p){return p.decision&&p.decision.v==='keep'&&p.closedAt&&addDays(p.closedAt,28)>=t;});
  if(keep.length)return 'Tái phạm trong 4 tuần sau khi kết thúc theo dõi ngày '+dmy(keep[keep.length-1].closedAt);
  var perf=ps.filter(function(p){return p.kind!=='new'&&p.opened>=addDays(t,-182);});
  if(perf.length>=2)return 'Đã vào diện theo dõi '+perf.length+' lần trong 6 tháng';
  return '';

function pipSave(kind){
  var x=hrSite(HR.pipSel.uid),p=HRD[x.uid].pip[HR.pipSel.id],D=HR.pipDraft,st=x.s.staff.filter(function(s){return s.id===p.sid;})[0],now=new Date().toISOString();
  if(kind==='talk'){if(!D.talk.signed){toast('Đánh dấu nhân viên đã ký xác nhận.');return;}if(D.talk.link&&!/^https?:\/\//i.test(D.talk.link)){toast('Link ảnh phải bắt đầu bằng http.');return;}
    hrdWrite(x.uid,'pip',p.id,function(d){d.talk={date:D.talk.date||todayKey(),signed:true,link:D.talk.link||'',staffNote:String(D.talk.staffNote||'').trim(),by:meName(),at:now};},'Đã lưu bước ②.').then(function(){HR.pipEdit=null;});}
  if(kind==='mid'){if(!String(D.mid||'').trim()){toast('Ghi nhận xét giữa kỳ.');return;}hrdWrite(x.uid,'pip',p.id,function(d){d.mid={note:String(D.mid).trim(),by:meName(),at:now};},'Đã lưu kiểm tra giữa kỳ.');}
  if(kind==='end'){
    if(!String(D.end.note||'').trim()){toast('Ghi nhận xét của CHT.');return;}if(!D.end.prop){toast('Chọn đề xuất.');return;}
    var res=[];(p.goals||[]).forEach(function(g,i){res[i]=g.t?(D.end.res[i]==null?null:D.end.res[i]):goalEval(x,st,p,g,i);});
    if((p.goals||[]).some(function(g,i){return g.t&&res[i]==null;})){toast('Đánh giá Đạt / Không đạt cho mục tiêu CHT tự ghi.');return;}
    if(D.end.prop==='quit'){var miss=pipDossier(x,st,p);if(miss.length){toast('Chưa đủ hồ sơ để đề xuất cho nghỉ: thiếu '+miss.join(', ')+'.',9000);return;}}
    hrdWrite(x.uid,'pip',p.id,function(d){if(d.decision)return false;d.end={note:String(D.end.note).trim(),prop:D.end.prop,res:res,by:meName(),at:now};},'Đã gửi quản lý duyệt.');
  }
}
function pipDecide(v){
  var x=hrSite(HR.pipSel.uid),p=HRD[x.uid].pip[HR.pipSel.id],D=HR.pipDraft,st=x.s.staff.filter(function(s){return s.id===p.sid;})[0],note=String(D.dec||'').trim(),now=new Date().toISOString();
  if(!note){toast('Ghi ý kiến của quản lý.');return;}
  if(v==='quit'&&pipDossier(x,st,p).length)return;
  hrdWrite(x.uid,'pip',p.id,function(d){
    var dec={v:v,note:note,by:meName(),at:now};
    if(v==='extend'){if(d.ext)return false;(d.hist||(d.hist=[])).push({end:d.end,decision:dec});d.ext=1;d.due=addDays(d.due,14);delete d.end;delete d.decision;return;}
    d.decision=dec;d.closedAt=todayKey();
  },v==='keep'?'Đã duyệt: '+st.name+' làm tiếp.':v==='extend'?'Đã gia hạn theo dõi '+st.name+' thêm 2 tuần.':'Đã duyệt cho nghỉ. CHT sẽ ghi nhận nghỉ việc.').then(function(){HR.pipDraft=null;});
}

  for(var i=7;i>=0;i--){var wk=addDays(wk0,-7*i);if(!inWeekSt(st,wk))continue;var c=scCalc(x.s,st,wk,scEntry(x.uid,wk,st.id));cells.push('<td class="n" title="Tuần '+isoWeek(wk)+'">'+scStatePill(c)+'<div class="sm muted">T'+isoWeek(wk)+'</div></td>');}
  var ps=pipsOf(x.uid,st.id),open=ps.filter(function(p){return !pipClosed(p);})[0];
  var h=(open?'<div class="banner warn"><span><b>Đang thuộc diện theo dõi</b> ('+(open.kind==='new'?'nhân viên mới':'hiệu suất')+') từ '+dmy(open.opened)+', hạn '+dmy(open.due)+'.</span><button class="btn sm" data-act="pipopen" data-id="'+esc(x.uid+'|'+open.id)+'">Xem phiếu</button></div>':'')

    +(cells.length?'<div class="tblwrap"><table class="tbl"><tbody><tr>'+cells.join('')+'</tr></tbody></table></div>':'')
    +(ps.length?'<p class="sm">Lịch sử theo dõi: '+ps.map(function(p){return dm(p.opened)+' '+(pipClosed(p)?propPill(p.decision.v):'<span class="pill wait">đang mở</span>');}).join(' · ')+'</p>':'')

  return h;

/* ================= LỊCH GỬI NHÂN VIÊN =================
   Xuất lịch tuần dễ đọc để gửi nhân viên: ảnh PNG (gửi Zalo) và file Excel (in hoặc gửi file).
   Ngày làm nhiều ca ở nhiều vị trí: tách thành từng khối, mỗi khối có giờ, vị trí, mã ca riêng. */
var PCOL=[['#FCEDC2','#6B4800'],['#DCE6FF','#1D3CA3'],['#F8DCEF','#861D67'],['#D3F0EA','#0E5E54'],['#E7E0FB','#4C33A0'],['#FDE1D0','#8A380C'],['#E3EFC8','#3D5A0A'],['#D6EDF6','#0B5270']];
function minHM(m){m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60);}
function shTimes(id){var sh=shift(id);return sh?(parseTimes(sh.time)||parseTimes(sh.name)):null;}
/* các khối trong 1 ô: gộp các ca liền nhau cùng vị trí */
function cellSegs(c){
  var ids=shiftsOf(c.s),out=[];
  /* chỉ gộp khi cùng vị trí VÀ giờ nối liền; ca gãy (nghỉ giữa 2 ca) luôn tách khối */
  ids.forEach(function(id){var p=posOf(c,id),last=out[out.length-1],prevT=last?shTimes(last.ids[last.ids.length-1]):null,curT=shTimes(id);if(last&&last.p===p&&prevT&&curT&&(prevT[1]%1440)===(curT[0]%1440))last.ids.push(id);else out.push({p:p,ids:[id]});});
  return out.map(function(sg){
    var a=shTimes(sg.ids[0]),b=shTimes(sg.ids[sg.ids.length-1]),pp=pos(sg.p);
    /* gom ca ngắn liền nhau thành ca dài (ca ghép) nếu site có cài, để hiện đúng mã ca và giờ công */
    var U=typeof units==='function'?units(sg.ids):sg.ids.map(shift).filter(Boolean);
    return {time:a&&b?minHM(a[0])+' – '+minHM(b[1]):'',pos:pp?pp.name:'Chưa chọn vị trí',c:pp?pp.c%8:-1,code:U.map(function(sh){return sh.name;}).join(' + '),hours:U.reduce(function(t,sh){return t+(+sh.hours||0);},0)};
  });
}
/* nội dung lịch tuần: mỗi người 7 ô, mỗi ô là danh sách khối hoặc chữ (Nghỉ / Nghỉ phép) */
function staffSched(k,onlyWorking){
  return weekRows(k).map(function(st){
    var days=[],any=false,hrs=0;
    for(var d=0;d<7;d++){
      var c=getCell(k,st.id,d),lv=leaveOn(st.id,k,d);
      if(c&&c.s!=='O'){var sg=cellSegs(c);sg.forEach(function(x){hrs+=x.hours;});days.push({segs:sg});any=true;}
      else if(c&&c.s==='O')days.push({txt:c.lv||lv==='F'?'Nghỉ phép':'Nghỉ'});
      else if(lv==='F')days.push({txt:'Nghỉ phép'});
      else days.push({txt:''});
    }
    return {st:st,days:days,any:any,hours:hrs};
  }).filter(function(r){return !onlyWorking||r.any;});
}

/* ---------- ảnh PNG ---------- */
function drawSched(k,rows){
  var F='"Be Vietnam Pro",system-ui,"Segoe UI",sans-serif',SC=2,M=28,NW=230,DW=176,HW=64,PADC=6,BH=58,BG=6;
  var W=M*2+NW+DW*7+HW,headH=96,thH=52;
  var rowH=rows.map(function(r){var n=1;r.days.forEach(function(x){if(x.segs)n=Math.max(n,x.segs.length);});return Math.max(58,n*BH+(n-1)*BG+PADC*2);});
  var legendH=110,H=M+headH+thH+rowH.reduce(function(a,b){return a+b;},0)+legendH+M;
  var cv=document.createElement('canvas');cv.width=W*SC;cv.height=H*SC;var g=cv.getContext('2d');g.scale(SC,SC);
  function txt(s,x,y,font,color,align,maxW){g.font=font;g.fillStyle=color;g.textAlign=align||'left';g.textBaseline='middle';if(maxW&&g.measureText(s).width>maxW){while(s.length>1&&g.measureText(s+'…').width>maxW)s=s.slice(0,-1);s+='…';}g.fillText(s,x,y);}
  function wrap(s,maxW,font){g.font=font;var words=String(s).split(' '),lines=[],cur='';words.forEach(function(w){var t=cur?cur+' '+w:w;if(g.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;});if(cur)lines.push(cur);return lines;}
  function rr(x,y,w,h,r,fill){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();g.fillStyle=fill;g.fill();}
  g.fillStyle='#FFFFFF';g.fillRect(0,0,W,H);
  var end=addDays(k,6),y=M;
  txt((S.site||'').toUpperCase(),M,y+12,'600 14px '+F,'#586375');
  txt('LỊCH LÀM VIỆC TUẦN '+isoWeek(k),M,y+44,'700 30px '+F,'#131A23');
  txt(dm(k)+' – '+dm(end)+'/'+parseKey(end).getFullYear(),M,y+78,'500 17px '+F,'#2446C7');
  y+=headH;
  rr(M,y,W-2*M,thH,8,'#131A23');
  txt('Nhân viên',M+14,y+thH/2,'600 15px '+F,'#FFFFFF');
  for(var d=0;d<7;d++){var x0=M+NW+d*DW;txt(DAY_FULL[d],x0+DW/2,y+17,'600 14px '+F,'#FFFFFF','center');txt(dm(addDays(k,d)),x0+DW/2,y+36,'500 13px '+F,'#C9D3E6','center');}
  txt('Giờ',M+NW+7*DW+HW/2,y+thH/2,'600 14px '+F,'#FFFFFF','center');
  y+=thH;
  rows.forEach(function(r,i){
    var h=rowH[i];if(i%2)rr(M,y,W-2*M,h,0,'#F4F6F9');
    var nl=wrap(r.st.name,NW-24,'600 15px '+F).slice(0,2),ny=y+h/2-(nl.length-1)*10-(r.st.code?8:0);
    nl.forEach(function(l,j){txt(l,M+14,ny+j*20,'600 15px '+F,'#131A23','left',NW-24);});
    if(r.st.code)txt(r.st.code+' · '+r.st.role,M+14,ny+nl.length*20-2,'500 12px '+F,'#586375');
    for(var d=0;d<7;d++){
      var x0=M+NW+d*DW,cell=r.days[d];
      if(cell.segs){var tot=cell.segs.length*BH+(cell.segs.length-1)*BG,sy=y+(h-tot)/2;
        cell.segs.forEach(function(sg,j){var by=sy+j*(BH+BG),col=sg.c<0?['#FCE3E5','#C42B37']:PCOL[sg.c];
          rr(x0+PADC,by,DW-PADC*2,BH,8,col[0]);
          txt(sg.time||sg.code,x0+PADC+10,by+16,'700 16px '+F,'#131A23','left',DW-PADC*2-16);
          txt(sg.pos,x0+PADC+10,by+35,'600 13.5px '+F,col[1],'left',DW-PADC*2-16);
          txt(sg.code,x0+PADC+10,by+50,'500 11px '+F,'#586375','left',DW-PADC*2-16);});}
      else if(cell.txt)txt(cell.txt,x0+DW/2,y+h/2,(cell.txt==='Nghỉ phép'?'600 ':'500 ')+'14px '+F,cell.txt==='Nghỉ phép'?'#8A5E00':'#8D97A6','center');
    }
    txt(r.hours?fmtH(r.hours):'',M+NW+7*DW+HW/2,y+h/2,'600 14px '+F,'#131A23','center');
    g.fillStyle='#E1E6EC';g.fillRect(M,y+h-1,W-2*M,1);
    y+=h;
  });
  y+=22;
  txt('Vị trí:',M,y+10,'600 13px '+F,'#586375');
  var lx=M+60;S.positions.forEach(function(p){var col=PCOL[p.c%8];g.font='600 13px '+F;var w=g.measureText(p.name).width+22;if(lx+w>W-M){lx=M+60;y+=28;}rr(lx,y,w,22,11,col[0]);txt(p.name,lx+11,y+11,'600 13px '+F,col[1]);lx+=w+8;});
  y+=36;
  txt('Ca:',M,y+10,'600 13px '+F,'#586375');
  txt(S.shifts.map(function(sh){return sh.name+' '+sh.time;}).join('   ·   '),M+60,y+10,'500 13px '+F,'#131A23','left',W-2*M-60);
  y+=30;
  txt('Xuất từ Quản lý nhân sự Miền Nam lúc '+fmtTime(new Date().toISOString())+'. Lịch có thể thay đổi, xem bản mới nhất CHT gửi.',M,y+8,'italic 400 12px '+F,'#8D97A6');
  return cv;
}

  withExcel(function(EJ){
    var wb=new EJ.Workbook(),ws=wb.addWorksheet('Lịch tuần',{pageSetup:{orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,paperSize:9,margins:{left:0.3,right:0.3,top:0.4,bottom:0.4,header:0.2,footer:0.2}},views:[{state:'frozen',xSplit:1,ySplit:4}]});
    ws.getCell('A1').value='LỊCH LÀM VIỆC TUẦN '+isoWeek(k)+' · '+dm(k)+' – '+dmy(end);ws.getCell('A1').font={name:'Arial',bold:true,size:15,color:{argb:XBLUE}};
    ws.getCell('A2').value=S.site||'';ws.getCell('A2').font={name:'Arial',bold:true,size:11,color:{argb:XGREY}};
    var head=[['Nhân viên',26]];for(var d=0;d<7;d++)head.push([DAY_FULL[d]+'\n'+dm(addDays(k,d)),22]);head.push(['Tổng giờ',9]);
    xHeader(ws,head,4);ws.getRow(4).height=34;
    var thin={style:'thin',color:{argb:'FFD5DBE3'}},border={top:thin,left:thin,bottom:thin,right:thin};
    rows.forEach(function(r,i){
      var row=5+i,nm=ws.getCell(row,1),lines=1;
      nm.value={richText:[{text:r.st.name+'\n',font:{name:'Arial',bold:true,size:11}},{text:(r.st.code?r.st.code+' · ':'')+r.st.role,font:{name:'Arial',size:9,color:{argb:'FF586375'}}}]};
      nm.alignment={vertical:'middle',wrapText:true};nm.border=border;
      r.days.forEach(function(cell,d){
        var c=ws.getCell(row,2+d);c.border=border;c.alignment={vertical:'middle',horizontal:'center',wrapText:true};
        if(cell.segs){
          var rt=[];cell.segs.forEach(function(sg,j){var ink=sg.c<0?'FFC42B37':'FF'+PCOL[sg.c][1].slice(1);
            rt.push({text:(j?'\n':'')+(sg.time||sg.code)+'\n',font:{name:'Arial',bold:true,size:11}});
            rt.push({text:sg.pos,font:{name:'Arial',bold:true,size:10,color:{argb:ink}}});
            rt.push({text:'\n'+sg.code,font:{name:'Arial',size:8,color:{argb:'FF8D97A6'}}});});
          c.value={richText:rt};lines=Math.max(lines,cell.segs.length*3+(cell.segs.length-1));
          if(cell.segs.length===1&&cell.segs[0].c>=0)xFill(c,'FF'+PCOL[cell.segs[0].c][0].slice(1));else xFill(c,'FFF4F6F9');
        }else if(cell.txt){c.value=cell.txt;c.font={name:'Arial',size:10,italic:cell.txt==='Nghỉ phép',color:{argb:cell.txt==='Nghỉ phép'?'FF8A5E00':'FF8D97A6'}};}
      });
      var tc=ws.getCell(row,9);tc.value=Math.round(r.hours*100)/100;tc.border=border;tc.alignment={vertical:'middle',horizontal:'center'};tc.font={name:'Arial',bold:true};
      ws.getRow(row).height=Math.max(32,lines*14+6);
    });
    var lr=5+rows.length+1;
    ws.getCell(lr,1).value='Ca làm';ws.getCell(lr,1).font={name:'Arial',bold:true};
    ws.getCell(lr,2).value=S.shifts.map(function(sh){return sh.name+' '+sh.time;}).join('   ·   ');ws.mergeCells(lr,2,lr,9);
    ws.getCell(lr+1,1).value='Ô nhiều màu / nhiều khối: ngày đó làm nhiều ca ở các vị trí khác nhau, đọc từ trên xuống theo giờ.';ws.getCell(lr+1,1).font={name:'Arial',italic:true,size:9,color:{argb:XGREY}};
    /* trang 2: theo ngày, ca, vị trí — để dán bảng tin */
    var wd=wb.addWorksheet('Theo ngày',{pageSetup:{orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0,paperSize:9}});
    wd.getCell('A1').value='PHÂN CÔNG THEO NGÀY · TUẦN '+isoWeek(k);wd.getCell('A1').font={name:'Arial',bold:true,size:14,color:{argb:XBLUE}};
    xHeader(wd,[['Ngày',16],['Ca',14],['Giờ',14],['Vị trí',20],['Nhân viên',60]],3);
    var rw=4;
    for(var d2=0;d2<7;d2++){var first=rw;
      S.shifts.forEach(function(sh){S.positions.forEach(function(p){
        var who=rows.filter(function(r){var c=getCell(k,r.st.id,d2);return c&&c.s!=='O'&&covers(c.s,sh.id)&&posOf(c,sh.id)===p.id;}).map(function(r){return r.st.name;});
        if(!who.length)return;
        [rw===first?DAY_FULL[d2]+' '+dm(addDays(k,d2)):'',sh.name,sh.time,p.name,who.join(', ')].forEach(function(v,j){var c=wd.getCell(rw,j+1);c.value=v;c.alignment={vertical:'top',wrapText:true};c.border=border;});
        xFill(wd.getCell(rw,4),'FF'+PCOL[p.c%8][0].slice(1));wd.getCell(rw,1).font={name:'Arial',bold:true};rw++;});});
      if(rw>first)rw++;}
    return wb;
  },name);
}

/* ================= CÔNG THÊM: làm thêm giờ, các khoản lương thêm, ảnh minh chứng, quản lý duyệt (Phúc chốt 21/10/2026) =================
   site/<mã>/ot/<YYYY-MM>: {list:[{id,sid,date,t,hours,rate,amount,note,files:[{id,name}],status,by,at,dec:{v,by,at,note}}]}
   status: 'cho' chờ duyệt · 'duyet' đã duyệt · 'tuchoi' từ chối · 'huy' CHT huỷ. Máy chủ ghi nhật ký, không cho xoá, CHT không tự duyệt. */
var OT_TYPES=[['ot','Làm thêm giờ'],['phucap','Phụ cấp'],['thuong','Thưởng'],['hotro','Hỗ trợ (đi lại, ăn uống…)'],['khac','Khoản khác']];
var OT_ST={cho:['Chờ duyệt','wait'],duyet:['Đã duyệt','ok'],tuchoi:['Từ chối','no'],huy:['Đã huỷ','']};
HR.otYm=todayKey().slice(0,7);HR.otSt='';HR.otFiles=[];HR.otImg={};HR.otRej=null;HR.otT='ot';HR.otBusy=false;HR.otDraft={};
function otv(id,def){return esc(HR.otDraft[id]!=null?HR.otDraft[id]:(def||''));}

/* khoản lương quản trị viên tự thêm (26/10/2026, Phúc): cfg/ottypes {list:[{id,name,kind,unit,rate,photo,off,by,at}],hide:[id khoản có sẵn đang ẩn]}
   kind 'qty': số lượng × đơn giá (lưu như làm thêm giờ: e.hours = số lượng, e.rate = đơn giá); 'amount': ghi số tiền.
   Không xoá khoản (khoản cũ vẫn cần tên để đọc lại), chỉ ẩn khỏi ô chọn khi ghi mới; không đổi cách tính sau khi tạo. */
var OTC={list:[],hide:[],loaded:false,busy:false};HR.otNew={kind:'amount'};
function otCfgLoad(){if(OTC.loaded||OTC.busy||!DB)return;OTC.busy=true;DB.doc('cfg/ottypes').get().then(function(sn){var d=sn.exists?sn.data():{};OTC.list=d.list||[];OTC.hide=d.hide||[];OTC.loaded=true;OTC.busy=false;render();},function(){OTC.loaded=true;OTC.busy=false;});}
function otTypes(all){
  var L=OT_TYPES.map(function(t){return {id:t[0],name:t[1],kind:t[0]==='ot'?'qty':'amount',unit:t[0]==='ot'?'giờ':'',photo:t[0]==='ot',base:true,off:OTC.hide.indexOf(t[0])>=0};}).concat(OTC.list.map(function(t){return {id:t.id,name:t.name,kind:t.kind,unit:t.unit||'',rate:+t.rate||0,photo:!!t.photo,off:!!t.off,by:t.by};}));
  return all?L:L.filter(function(t){return !t.off;});
}
function otType(t){var L=otTypes(true);for(var i=0;i<L.length;i++)if(L[i].id===t)return L[i];return {id:t,name:/^k[a-z0-9]{6,}$/.test(t)?'Khoản không còn trong danh mục':t,kind:'amount',unit:''};}
function otTypeName(t){return otType(t).name;}
function otIsQty(t){return otType(t).kind==='qty';}
function otUnit(t){return otType(t).unit||'lần';}
/* khoản có đơn giá (làm thêm giờ, khoản tính theo số lượng) tính số lượng × đơn giá, kể cả khi chưa tải xong danh mục khoản */
function otAmount(x){return x.t==='ot'||(x.amount==null&&x.rate!=null)?Math.round((+x.hours||0)*(+x.rate||0)):Math.round(+x.amount||0);}
function otDetail(e){return otIsQty(e.t)||e.rate!=null&&e.amount==null?fmtH(e.hours)+' '+otUnit(e.t)+' × '+fmtVND(e.rate):'';}
function otDocs(x){var h=HRD[x.uid];return h&&h.ot?h.ot:{};}
function otList(x,ym){var d=otDocs(x)[ym];return (d&&d.list)||[];}
function otPending(L){var n=0,sum=0;L.forEach(function(x){var D=otDocs(x);Object.keys(D).forEach(function(ym){((D[ym]||{}).list||[]).forEach(function(e){if(e.status==='cho'){n++;sum+=otAmount(e);}});});});return {n:n,sum:sum};}
function otBadge(){var L=hrSites();if(!L.length||!L.every(function(x){return HRD[x.uid]&&HRD[x.uid].ok;}))return '';var p=otPending(L);return ROLE==='mgr'&&p.n?'<span class="count hot">'+p.n+'</span>':'';}
function staffName(x,sid){var st=x.s.staff.filter(function(s){return s.id===sid;})[0];return st?st.name:'(đã xoá)';}

/* nén ảnh trước khi tải lên: cạnh dài tối đa 1600px, JPEG chất lượng 0,82 */
function otCompress(file){
  return new Promise(function(ok,no){
    if(!/^image\//.test(file.type)){no(new Error(file.name+' không phải ảnh'));return;}
    var r=new FileReader();
    r.onload=function(){var img=new Image();img.onload=function(){
      var M=1600,s=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);var u=c.toDataURL('image/jpeg',0.82);
      ok({name:file.name.replace(/\.[^.]+$/,'')+'.jpg',mime:'image/jpeg',data:u.split(',')[1],url:u});
    };img.onerror=function(){no(new Error('Không đọc được ảnh '+file.name));};img.src=r.result;};
    r.onerror=function(){no(new Error('Không đọc được ảnh '+file.name));};r.readAsDataURL(file);
  });
}
function otUpload(uid,f){
  if(ROLE==='demo'||!DB||!DB.upload){var id='local'+rid();HR.otImg[id]=f.url;return Promise.resolve({id:id,name:f.name});}
  return DB.upload({site:uid,name:f.name,mime:f.mime,data:f.data}).then(function(r){HR.otImg[r.id]=f.url;return r;});
}

  if(HR.otImg[id]){show(HR.otImg[id]);return;}
  if(!DB||!DB.file){m.querySelector('#ot-img').innerHTML='<span class="sm muted">Không có ảnh.</span>';return;}
  DB.file(id).then(function(r){HR.otImg[id]='data:'+r.mime+';base64,'+r.data;show(HR.otImg[id]);},function(e){m.querySelector('#ot-img').innerHTML='<p class="ierr">'+esc(e&&e.message||'Không tải được ảnh')+'</p>';});

function hrSummary(L,from,to){
  var ym=from.slice(0,7),sites=L.map(function(x){
    var f=flowStats(x.s.staff,from,to),k=withSite(x.s,function(){var pr=payroll(from,to),fh=0,ph=0,pm=0;pr.ft.forEach(function(y){fh+=y.hours;});pr.pt.forEach(function(y){ph+=y.hours;pm+=y.hours*(y.st.rate||0);});return {fh:fh,ph:ph,pm:pm,R:kpiCalc(from,to,false)};});
    var g={xs:0,tot:0,cc:0,yeu:0,na:0,sum:0,n:0},stars=[];
    x.s.staff.filter(function(st){return onRollRange(st,ym+'-01',keyOf(new Date(+ym.slice(0,4),+ym.slice(5),0)));}).forEach(function(st){var M=scMonth(x,st,ym);if(M.score==null){g.na++;return;}g.sum+=M.score;g.n++;if(M.score>=90)g.xs++;else if(M.score>=75)g.tot++;else if(M.score>=60)g.cc++;else g.yeu++;if(M.star)stars.push({st:st,v:M.score});});
    var ot={ok:0,okH:0,pend:0,pendN:0};
    [ym,ymAdd(ym,1)].forEach(function(m){otList(x,m).forEach(function(e){if(e.date<from||e.date>to)return;var a=otAmount(e);if(e.status==='duyet'){ot.ok+=a;if(e.t==='ot')ot.okH+=+e.hours||0;}else if(e.status==='cho'){ot.pend+=a;ot.pendN++;}});});
    return {x:x,f:f,fh:k.fh,ph:k.ph,pm:k.pm,R:k.R,fill:k.R.counted&&k.R.need?k.R.ok/k.R.need*100:null,g:g,stars:stars,ot:ot};
  });
  var T=sumFlow(sites.map(function(s){return s.f;})),need=0,ok=0,fh=0,ph=0,pm=0,G={xs:0,tot:0,cc:0,yeu:0,na:0,sum:0,n:0},OT={ok:0,okH:0,pend:0,pendN:0};
  sites.forEach(function(s){if(s.R.counted){need+=s.R.need;ok+=s.R.ok;}fh+=s.fh;ph+=s.ph;pm+=s.pm;Object.keys(G).forEach(function(k){G[k]+=s.g[k];});Object.keys(OT).forEach(function(k){OT[k]+=s.ot[k];});});

function hrInsights(Sm,from,to){

  out.push('Nhân sự đang làm '+T.on+' người (FT '+T.ft+', PT '+T.pt+'); trong kỳ vào làm '+T.ins.length+', nghỉ việc '+T.outs.length+', tỷ lệ nghỉ việc '+fmtPct(T.rate)+'.');
  var hi=Sm.sites.filter(function(s){return s.f.outs.length;}).sort(function(a,b){return b.f.rate-a.f.rate;})[0];
  if(hi&&Sm.sites.length>1)out.push('Tỷ lệ nghỉ việc cao nhất: '+hi.x.name+' ('+fmtPct(hi.f.rate)+', '+hi.f.outs.length+' người nghỉ).');
  var fl=Sm.sites.filter(function(s){return s.fill!=null;}).sort(function(a,b){return a.fill-b.fill;});
  if(Sm.fill!=null)out.push('Đáp ứng định biên cả kỳ '+fmtPct(Sm.fill)+(fl.length>1?'; thấp nhất '+fl[0].x.name+' ('+fmtPct(fl[0].fill)+').':'.'));
  if(T.nostart)out.push(T.nostart+' người đang làm chưa có ngày vào làm: số liệu biến động và thâm niên chưa đầy đủ.');
  if(Sm.G.n)out.push('Chấm điểm '+ymLabel(Sm.ym).toLowerCase()+': điểm trung bình '+fmtSc(Sm.G.sum/Sm.G.n)+'; Xuất sắc '+Sm.G.xs+', Tốt '+Sm.G.tot+', Cần cải thiện '+Sm.G.cc+', Yếu '+Sm.G.yeu+(Sm.G.na?'; '+Sm.G.na+' người chưa đủ dữ liệu.':'.'));
  else out.push('Chưa có điểm tháng: cần ít nhất 2 tuần đã chấm.');
  if(Sm.P.open.length||Sm.P.review.length||Sm.P.need.length)out.push('Diện theo dõi: '+Sm.P.open.length+' đang theo dõi, '+Sm.P.review.length+' chờ quản lý duyệt, '+Sm.P.need.length+' người cần mở phiếu.');
  out.push('Công thêm trong kỳ: đã duyệt '+fmtVND(Sm.OT.ok)+' đ ('+fmtH(Sm.OT.okH)+' giờ làm thêm)'+(Sm.OT.pendN?'; còn '+Sm.OT.pendN+' khoản chờ duyệt ('+fmtVND(Sm.OT.pend)+' đ).':'.'));
  return out;
}

function hrPolish(wb){
  wb.eachSheet(function(ws){
    if(ws.name==='Tóm tắt')return;
    var hr=0,nc=0;
    ws.eachRow(function(row,ri){if(hr)return;row.eachCell(function(c,ci){if(c.fill&&c.fill.fgColor&&c.fill.fgColor.argb===XBLUE){hr=ri;nc=Math.max(nc,ci);}});});
    if(!hr)return;
    var t=ws.getCell('A1');if(t.value){t.font={name:'Arial',bold:true,size:16,color:{argb:RP_NAVY}};ws.getRow(1).height=26;}
    var t2=ws.getCell('A2');if(t2.value&&!(t2.font&&t2.font.bold))t2.font={name:'Arial',italic:true,size:9,color:{argb:'FF586375'}};
    var thin={style:'thin',color:{argb:RP_LINE}},bd={top:thin,left:thin,bottom:thin,right:thin};
    for(var ci=1;ci<=nc;ci++){var hc=ws.getCell(hr,ci);hc.fill={type:'pattern',pattern:'solid',fgColor:{argb:RP_NAVY}};hc.font={name:'Arial',bold:true,size:10,color:{argb:'FFFFFFFF'}};hc.border=bd;hc.alignment={vertical:'middle',horizontal:'center',wrapText:true};}
    var last=ws.rowCount;
    for(var ri=hr+1;ri<=last;ri++){
      var row=ws.getRow(ri),any=false;for(var c0=1;c0<=nc;c0++)if(row.getCell(c0).value!=null&&row.getCell(c0).value!=='')any=true;if(!any)continue;
      for(var c1=1;c1<=nc;c1++){var c=row.getCell(c1),f=c.font||{};
        c.font={name:'Arial',size:10,bold:!!f.bold,italic:!!f.italic,color:f.color};c.border=bd;
        c.alignment=Object.assign({vertical:'middle'},c.alignment||{});
        if(!c.fill&&(ri-hr)%2===0)c.fill={type:'pattern',pattern:'solid',fgColor:{argb:RP_ZEBRA}};
        if(typeof c.value==='number'&&!c.numFmt&&Math.abs(c.value)>=1000)c.numFmt='#,##0';}
    }
    ws.getRow(hr).height=32;
    ws.autoFilter={from:{row:hr,column:1},to:{row:hr,column:nc}};
    ws.views=[{state:'frozen',ySplit:hr,showGridLines:false}];
    ws.pageSetup={paperSize:9,orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,printTitlesRow:hr+':'+hr,margins:{left:0.4,right:0.4,top:0.5,bottom:0.5,header:0.25,footer:0.25}};
    ws.headerFooter={oddFooter:'&L&8Quản lý nhân sự Miền Nam · '+ws.name+'&R&8Trang &P/&N'};
  });
}
