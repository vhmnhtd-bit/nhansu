/* ================= LỊCH CORE TEAM =================
   Đăng ký lịch làm theo tuần của core team Miền Nam (quản lý, CHT, văn phòng…), thay file "GUIDELINE CHT" tab tháng.
   core/cfg: { members:[{id,name,role,user,active}], shifts:[{code,hours}], wkDl:4, offMonth:6, leaveYear:12, misaOff, misaNp, misaLe }
   Không thuộc site nào: mọi tài khoản đều thấy, nằm ở nhóm riêng trên menu chính.
   core/y/<năm>/<mã NV>: { mid, m:{ 'yyyy-mm':{ d:[mã ca ngày 1..31] } } } — mỗi người một tài liệu.
   Mỗi người tự đăng ký dòng của mình (không duyệt), máy chủ khoá từng tuần sau hạn (wkDl); quản lý sửa được mọi lúc.
   Mã ca giữ đúng mã MISA. OFF = nghỉ định kỳ, NP = nghỉ phép năm, Nghỉ lễ. */
var CORE_SPECIAL=['OFF','NP','Nghỉ lễ'];
var CORE_DEF_SHIFTS=['CHT.10h-18h','CHT.14h-22h','CHT_CT.10h-20h','CHT_CT.12h-22h','CHT_CT.9H-19H','CHT:9h-17h','CHT:9h30-17h30','CHT:14h30-22h30','CHT:12h-20h','CHT18-22H','VPMN.9h-18h','VPMN.9h30-17h30'];
var CORE_ROLES=['Quản lý','CHT','Văn phòng','Khác'];
var CORE={cfg:null,ver:0,years:{},loaded:{},busy:false,err:'',ym:'',wk:'',mode:lsGet('xc_cmode')==='mo'?'mo':'wk',setup:false,edit:null,imp:null,pend:{},saving:0,saveErr:''};

/* ---------- tiện ích (ymAdd, ymLabel dùng chung với score.js) ---------- */
function coreYm(off){var n=new Date(),d=new Date(n.getFullYear(),n.getMonth()+off,1);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function ymDays(ym){var a=ym.split('-').map(Number);return new Date(a[0],a[1],0).getDate();}
function ymDow(ym,i){var a=ym.split('-').map(Number);return (new Date(a[0],a[1]-1,i+1).getDay()+6)%7;}
function coreNormUser(x){var s=String(x==null?'':x).trim().toLowerCase();if(!s)return '';var d=s.replace(/\D/g,'');if(/^[\d\s.+()\-]+$/.test(s)&&d.length>=8)return 'p'+d.replace(/^84/,'').replace(/^0+/,'');return 'u'+s;}
/* đăng ký theo tuần (24/10): tuần bắt đầu thứ Hai wk khoá sau hết ngày <wkDl> của tuần trước, giờ Việt Nam.
   wkDl: 0 = T2 … 6 = CN, mặc định 4 (hết thứ Sáu tuần trước). Máy chủ kiểm tra cùng quy tắc theo từng ngày. */
function coreWkDl(){var v=(CORE.cfg||{}).wkDl;return v==null||v===''||isNaN(+v)?4:+v;}
function coreWk(off){return addDays(mondayOf(new Date()),7*(off||0));}
function coreDlKey(wk){return addDays(wk,coreWkDl()-7);}
function coreDeadline(wk){var a=coreDlKey(wk).split('-').map(Number);return Date.UTC(a[0],a[1]-1,a[2]+1,-7,0,0);}
function coreDeadlineLabel(wk){var k=coreDlKey(wk);return DAY_FULL[dow(k)].toLowerCase()+' '+dm(k);}
/* mặc định không khoá hạn (25/10); bật "Khoá đăng ký sau hạn" trong Thiết lập thì tuần quá hạn mới bị khoá */
function coreLockOn(){return !!(CORE.cfg&&CORE.cfg.lockAfter);}
function coreLockedDay(k){return coreLockOn()&&Date.now()>coreDeadline(mondayOf(parseKey(k)));}
function coreWkKeys(wk){var o=[];for(var i=0;i<7;i++)o.push(addDays(wk,i));return o;}
function coreGet(mid,k){return coreDays(mid,k.slice(0,7))[+k.slice(8)-1]||'';}
function coreHoursOf(code){
  var c=String(code||'').trim();if(!c||CORE_SPECIAL.indexOf(c)>=0)return 0;
  var sh=(CORE.cfg&&CORE.cfg.shifts||[]).filter(function(x){return x.code===c;})[0];if(sh&&sh.hours!=null&&sh.hours!=='')return +sh.hours;
  return coreParseHours(c);
}
function coreParseHours(c){
  var m=String(c).match(/(\d{1,2})\s*[hH:]?\s*(\d{2})?\s*-\s*(\d{1,2})\s*[hH:]?\s*(\d{2})?/);if(!m)return 8;
  var a=+m[1]+(+m[2]||0)/60,b=+m[3]+(+m[4]||0)/60;if(b<=a)b+=12;return Math.round((b-a)*100)/100;
}
/* cách ghi khác nhau trong file GUIDELINE: OF / Off → OFF, Nghỉ phép → NP */
function coreNormCode(v){v=String(v==null?'':v).trim();if(/^of+$/i.test(v))return 'OFF';if(/^(np|nghỉ\s*phép)$/i.test(v))return 'NP';if(/^nghỉ\s*lễ/i.test(v))return 'Nghỉ lễ';return v;}
function coreKind(c){c=coreNormCode(c);if(!c)return 'none';if(c==='OFF')return 'off';if(c==='NP')return 'np';if(/^nghỉ lễ/i.test(c))return 'le';if(/^VP/i.test(c))return 'vp';if(/_CT/i.test(c))return 'ct';return 'cht';}
function coreShort(c){
  c=String(c||'').trim();var k=coreKind(c);if(k==='none')return '';if(k==='off')return 'OFF';if(k==='np')return 'NP';if(k==='le')return 'Lễ';
  var m=c.match(/(\d{1,2}\s*[hH:]?\s*(?:\d{2})?)\s*-\s*(\d{1,2}\s*[hH:]?\s*(?:\d{2})?)/),t=m?(m[1]+'-'+m[2]).replace(/[hH:](?=-|$)/g,'').replace(/\s/g,'').replace(/H/g,'h'):c;
  return (k==='vp'?'VP ':k==='ct'?'CT ':'')+t;
}
/* nhãn trong ô bảng tháng: loại ca (CT, VP) và giờ, giờ dài xuống 2 dòng cho cột hẹp */
function coreLabel(c){var t=coreShort(c),m=t.match(/^(CT|VP) (.*)$/),tag=m?m[1]:'',tm=m?m[2]:t;return (tag?'<em>'+tag+'</em>':'')+(tm.length>5&&tm.indexOf('-')>0?esc(tm.split('-')[0])+'<br>'+esc(tm.split('-')[1]):esc(tm));}
function coreWorks(c){var k=coreKind(c);return k==='cht'||k==='ct'||k==='vp';}
function coreMembers(all){return ((CORE.cfg&&CORE.cfg.members)||[]).filter(function(m){return all||m.active!==false;});}
/* thời gian làm của người core: start = ngày vào làm, quit = làm đến hết ngày (để trống = chưa nghỉ) */
function coreYmd(ym,i){return ym+'-'+pad(i+1);}
function coreOnDate(m,k){return (!m.start||m.start<=k)&&(!m.quit||k<=m.quit);}
function coreOnDay(m,ym,i){return coreOnDate(m,coreYmd(ym,i));}
function coreRangeMembers(a,b){return coreMembers().filter(function(m){return (!m.start||m.start<=b)&&(!m.quit||m.quit>=a);});}
function coreInMonth(m,ym){return m.active!==false&&(!m.start||m.start<=coreYmd(ym,ymDays(ym)-1))&&(!m.quit||m.quit>=ym+'-01');}
function coreMonthMembers(ym){return coreMembers().filter(function(m){return coreInMonth(m,ym);});}
function coreDmy(k){return k?k.slice(8)+'/'+k.slice(5,7)+'/'+k.slice(0,4):'';}
/* dòng của tài khoản đang đăng nhập: khớp SĐT ở cột Tài khoản; dòng chưa có SĐT thì khớp họ tên (đúng 1 người) — cùng quy tắc với máy chủ (coreMine_) */
/* lời báo khi tài khoản chưa khớp dòng nào: nói rõ đang tìm theo SĐT và họ tên nào để quản lý sửa đúng chỗ */
function coreUnlinkedMsg(){var me=window.XC_ME||{};return 'Tài khoản của bạn ('+(me.user||'')+(me.name?' · '+me.name:'')+') chưa khớp dòng nào trong danh sách core team, nên chỉ xem được. Quản lý điền SĐT này vào cột Tài khoản ở Thiết lập core team, hoặc sửa họ tên cho trùng khớp.';}
function coreNormName(x){return String(x==null?'':x).normalize('NFC').trim().toLowerCase().replace(/\s+/g,' ');}
function coreMe(){
  var me=window.XC_ME,key=me?coreNormUser(me.user):'';if(!key)return null;var L=coreMembers();
  var hit=L.filter(function(m){return m.user&&coreNormUser(m.user)===key;})[0];if(hit)return hit;
  var nm=coreNormName(me.name);if(!nm)return null;var byName=L.filter(function(m){return !m.user&&coreNormName(m.name)===nm;});
  return byName.length===1?byName[0]:null;
}
function coreAdmin(){return ROLE==='mgr'&&!OFFICE;}
/* sửa được ô ngày k của người m: quản lý mọi lúc; người đó với dòng của mình khi tuần chứa ngày k chưa quá hạn */
/* 25/10 (Phúc): chỉ chính nhân viên sửa dòng của mình; quản lý chỉ xem, trừ khi bật "Quản lý được sửa hộ" trong Thiết lập */
function coreCanEditDay(m,k){if(!m||!coreOnDate(m,k))return false;if(ROLE==='demo')return true;var me=coreMe();if(me&&me.id===m.id)return !coreLockedDay(k);return coreAdmin()&&!!(CORE.cfg&&CORE.cfg.mgrEdit);}
function coreDoc(year,mid){var y=CORE.years[year]||(CORE.years[year]={});return y[mid]||(y[mid]={mid:mid,m:{}});}
function coreDays(mid,ym){var y=CORE.years[ym.slice(0,4)],d=y&&y[mid]&&y[mid].m&&y[mid].m[ym];return (d&&d.d)||[];}

/* ---------- tải dữ liệu ---------- */
function coreLoad(force){
  if(!DB){CORE.err='Chưa kết nối máy chủ.';return;}
  if(!CORE.ym)CORE.ym=coreYm(1);if(!CORE.wk)CORE.wk=coreWk(1);
  /* năm cần tải: tháng đang xem + tháng trước (chuỗi ngày làm liền); xem tuần: từ đầu tháng trước của 2 tuần trước đến cuối tuần */
  var ms0=CORE.mode==='mo'?[CORE.ym,ymAdd(CORE.ym,-1)]:[ymAdd(addDays(CORE.wk,-14).slice(0,7),-1),addDays(CORE.wk,6).slice(0,7)];
  var ys=ms0.map(function(x){return x.slice(0,4);}).filter(function(y,i,a){return a.indexOf(y)===i;});
  var need=ys.filter(function(y){return force||!CORE.loaded[y];});
  if(!need.length&&CORE.cfg&&!force)return;
  if(CORE.busy)return;CORE.busy=true;CORE.err='';
  var jobs=[DB.doc('core/cfg').get().then(function(sn){CORE.cfg=sn.exists?sn.data():null;CORE.ver=sn.exists?1:0;})];
  need.forEach(function(y){jobs.push(DB.collection('core/y/'+y).get().then(function(snap){var o={};snap.docs.forEach(function(d){o[d.id]=d.data();});
    /* giữ các ô vừa sửa chưa kịp lưu */
    Object.keys(CORE.pend).forEach(function(k){var p=k.split('|');if(p[0]===y&&CORE.years[y]&&CORE.years[y][p[1]])o[p[1]]=CORE.years[y][p[1]];});
    CORE.years[y]=o;CORE.loaded[y]=true;}));});
  Promise.all(jobs).then(function(){
    if(!CORE.cfg)CORE.cfg={members:[],shifts:CORE_DEF_SHIFTS.map(function(c){return {code:c,hours:coreParseHours(c)};}),wkDl:4,offMonth:6,leaveYear:12};
    CORE.busy=false;if(view.mod==='core')render();
  },function(e){CORE.busy=false;CORE.err=(e&&e.message)||'Không tải được lịch core team.';if(view.mod==='core')render();});
}
function coreSetDay(mid,ym,i,code){
  var y=ym.slice(0,4),doc=coreDoc(y,mid),mo=doc.m[ym]||(doc.m[ym]={d:[]}),n=ymDays(ym);
  while(mo.d.length<n)mo.d.push('');
  mo.d[i]=code||'';
  while(mo.d.length&&!mo.d[mo.d.length-1])mo.d.pop();
  if(!mo.d.length)delete doc.m[ym];
  coreQueue(y,mid);
}
function coreQueue(y,mid){
  var k=y+'|'+mid;clearTimeout(CORE.pend[k]);
  CORE.pend[k]=setTimeout(function(){coreSave(y,mid);},700);
  coreSaveBox();
}
function coreSave(y,mid){
  var k=y+'|'+mid;delete CORE.pend[k];
  if(ROLE==='demo'){coreSaveBox();return;}
  var doc=CORE.years[y][mid];CORE.saving++;CORE.saveErr='';coreSaveBox();
  DB.doc('core/y/'+y+'/'+mid).set({mid:mid,m:doc.m}).then(function(){CORE.saving--;coreSaveBox();},function(e){
    CORE.saving--;CORE.saveErr=(e&&e.message)||'Chưa lưu được.';coreSaveBox();toast(CORE.saveErr,7000);
    CORE.loaded[y]=false;coreLoad(true);
  });
}
function coreSaveBox(){
  var el=document.getElementById('core-save');if(!el)return;
  var pend=Object.keys(CORE.pend).length;
  el.innerHTML=CORE.saveErr?'<span class="st warn"><i></i>'+esc(CORE.saveErr)+'</span>':(pend||CORE.saving)?'<span class="st warn"><i></i>Đang lưu…</span>':'<span class="st ok"><i></i>Tự lưu</span>';
}

/* ---------- số liệu từng người ---------- */
function coreStats(m,ym){
  var c=CORE.cfg||{},n=ymDays(ym),d=coreDays(m.id,ym),r={work:0,hours:0,off:0,np:0,le:0,blank:0,wkOff:[],run:0,runEnd:-1,npYear:0};
  var prev=coreDays(m.id,ymAdd(ym,-1)),pn=ymDays(ymAdd(ym,-1)),run=0;
  for(var j=pn-1;j>=0;j--){if(coreWorks(prev[j]))run++;else break;}
  var emp=0;
  for(var i=0;i<n;i++){
    if(!coreOnDay(m,ym,i)){run=0;continue;}emp++;
    var x=String(d[i]||'').trim(),k=coreKind(x);
    if(k==='none')r.blank++;else if(k==='off')r.off++;else if(k==='np')r.np++;else if(k==='le')r.le++;else{r.work++;r.hours+=coreHoursOf(x);}
    if(k==='off'&&ymDow(ym,i)>=5)r.wkOff.push(i);
    if(coreWorks(x)){run++;if(run>r.run){r.run=run;r.runEnd=i;}}else run=0;
  }
  var y=CORE.years[ym.slice(0,4)],doc=y&&y[m.id];
  if(doc&&doc.m)Object.keys(doc.m).forEach(function(k2){(doc.m[k2].d||[]).forEach(function(x){if(coreKind(x)==='np')r.npYear++;});});
  r.emp=emp;r.offTarget=Math.round((+c.offMonth||6)*emp/n);r.leaveYear=+c.leaveYear||12;
  r.warn=[];
  if(!r.blank&&r.off<r.offTarget)r.warn.push({t:'OFF '+r.off+'/'+r.offTarget+': thiếu '+(r.offTarget-r.off)+' ngày nghỉ định kỳ',bad:true});
  if(r.off>r.offTarget)r.warn.push({t:'OFF '+r.off+'/'+r.offTarget+': dư '+(r.off-r.offTarget)+' ngày nghỉ định kỳ',bad:true});
  if(r.run>6)r.warn.push({t:'làm '+r.run+' ngày liền (đến '+pad(r.runEnd+1)+'/'+ym.slice(5)+'), tối đa 6',bad:true});
  if(r.wkOff.length&&m.role==='CHT')r.warn.push({t:'nghỉ T7/CN: '+r.wkOff.map(function(i){return DAYS[ymDow(ym,i)]+' '+pad(i+1);}).join(', '),bad:false});
  if(r.npYear>r.leaveYear)r.warn.push({t:'phép năm '+r.npYear+'/'+r.leaveYear+': vượt '+(r.npYear-r.leaveYear)+' ngày',bad:true});
  if(r.blank&&r.blank<emp)r.warn.push({t:'còn '+r.blank+' ngày chưa đăng ký',bad:false});
  return r;
}
/* số liệu 1 tuần: công, giờ, OFF trong tuần; OFF so định mức theo từng tháng có ngày trong tuần; chuỗi ngày làm liền nối từ 2 tuần trước */
function coreWeekStats(m,wk){
  var ks=coreWkKeys(wk),r={work:0,hours:0,off:0,np:0,le:0,blank:0,emp:0,wkOff:[],run:0,runEnd:'',mo:[],npYear:0,leaveYear:0,warn:[]};
  ks.forEach(function(k){if(!coreOnDate(m,k))return;r.emp++;var x=String(coreGet(m.id,k)).trim(),kd=coreKind(x);
    if(kd==='none')r.blank++;else if(kd==='off')r.off++;else if(kd==='np')r.np++;else if(kd==='le')r.le++;else{r.work++;r.hours+=coreHoursOf(x);}
    if(kd==='off'&&dow(k)>=5)r.wkOff.push(k);});
  var run=0;for(var i=-14;i<7;i++){var k=addDays(wk,i);if(coreOnDate(m,k)&&coreWorks(coreGet(m.id,k))){run++;if(i>=0&&run>r.run){r.run=run;r.runEnd=k;}}else run=0;}
  if(r.run>6)r.warn.push({t:'làm '+r.run+' ngày liền (đến '+DAYS[dow(r.runEnd)]+' '+dm(r.runEnd)+'), tối đa 6',bad:true});
  if(r.wkOff.length&&m.role==='CHT')r.warn.push({t:'nghỉ T7/CN: '+r.wkOff.map(function(k){return DAYS[dow(k)]+' '+dm(k);}).join(', '),bad:false});
  ks.map(function(k){return k.slice(0,7);}).filter(function(y,i,a){return a.indexOf(y)===i;}).forEach(function(ym){
    if(!coreInMonth(m,ym))return;var s=coreStats(m,ym);r.mo.push({ym:ym,off:s.off,t:s.offTarget,blank:s.blank});r.npYear=s.npYear;r.leaveYear=s.leaveYear;
    if(s.off>s.offTarget)r.warn.push({t:'OFF tháng '+(+ym.slice(5))+': '+s.off+'/'+s.offTarget+', dư '+(s.off-s.offTarget)+' ngày',bad:true});
    else if(!s.blank&&s.off<s.offTarget)r.warn.push({t:'OFF tháng '+(+ym.slice(5))+': '+s.off+'/'+s.offTarget+', thiếu '+(s.offTarget-s.off)+' ngày',bad:true});
  });
  if(r.npYear>r.leaveYear)r.warn.push({t:'phép năm '+r.npYear+'/'+r.leaveYear+': vượt '+(r.npYear-r.leaveYear)+' ngày',bad:true});

}

function coreDateOf(v){
  if(typeof v==='number'&&v>20000&&v<80000){var d=new Date(Math.round((v-25569)*86400000));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());}
  var m=String(v||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/);if(!m)return '';
  var y=+m[3];if(y<100)y+=2000;return y+'-'+pad(+m[2])+'-'+pad(+m[1]);
}
function coreParseWb(X,wb){
  var mem={},memL=[],months={},codes={},data={};
  wb.SheetNames.forEach(function(name){
    var rows=X.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:''});
    var hr=-1;for(var r=0;r<Math.min(rows.length,6);r++)if(norm(rows[r][0])==='date'){hr=r;break;}
    if(hr<0)return;
    var cols=[];for(var ci=2;ci<rows[hr].length;ci++){var k=coreDateOf(rows[hr][ci]);if(!k||+k.slice(0,4)<2020)break;cols.push({ci:ci,k:k});}
    if(!cols.length)return;
    rows.slice(hr+1).forEach(function(row){
      var id=String(row[0]||'').trim(),nm=String(row[1]||'').trim();
      if(!id||!nm||!/^[A-Za-z0-9_\-.]{1,40}$/.test(id)||/^mã/i.test(id))return;
      if(!mem[id]){mem[id]={id:id,name:nm};memL.push(mem[id]);}
      cols.forEach(function(c){
        var v=String(row[c.ci]==null?'':row[c.ci]).trim();if(!v)return;
        v=coreNormCode(v);if(/^\d+$/.test(v))return;
        var ym=c.k.slice(0,7),di=+c.k.slice(8)-1;months[ym]=1;
        if(CORE_SPECIAL.indexOf(v)<0)codes[v]=1;
        var o=data[id]||(data[id]={}),mo=o[ym]||(o[ym]=[]);mo[di]=v;
      });
    });
  });
  return {members:memL,months:Object.keys(months).sort(),codes:Object.keys(codes).sort(),data:data};
}
function coreImportFile(f){
  var I=CORE.imp;if(!f||!I)return;I.busy=true;I.err='';render();
  var fr=new FileReader();
  fr.onload=function(){loadXLSX().then(function(X){
    try{var P=coreParseWb(X,X.read(new Uint8Array(fr.result),{type:'array'}));if(!P.members.length)throw new Error('x');I.p=P;}
    catch(e){I.err='Không thấy tab tháng nào (cần dòng DATE và các dòng mã NV, họ tên).';}
    I.busy=false;render();
  },function(){I.busy=false;I.err='Không tải được bộ đọc Excel. Kiểm tra mạng rồi thử lại.';render();});};
  fr.readAsArrayBuffer(f);
}
function coreImportGo(){
  var I=CORE.imp,P=I&&I.p;if(!P||I.busy)return;
  var C=JSON.parse(JSON.stringify(CORE.cfg)),have={};
  C.members=C.members||[];C.shifts=C.shifts||[];
  C.members.forEach(function(m){have[m.id]=1;});
  P.members.forEach(function(m){if(!have[m.id])C.members.push({id:m.id,name:m.name,role:'CHT',user:'',active:true});});
  var sc={};C.shifts.forEach(function(s){sc[s.code]=1;});
  P.codes.forEach(function(c){if(!sc[c])C.shifts.push({code:c,hours:coreParseHours(c)});});
  /* gom theo năm / người */
  var jobs=[];
  var years={};P.months.forEach(function(ym){years[ym.slice(0,4)]=1;});
  I.busy=true;I.done=0;render();
  var loadYears=Object.keys(years).filter(function(y){return !CORE.loaded[y];}).map(function(y){return DB.collection('core/y/'+y).get().then(function(snap){var o={};snap.docs.forEach(function(d){o[d.id]=d.data();});CORE.years[y]=o;CORE.loaded[y]=true;});});
  Promise.all(loadYears).then(function(){return DB.doc('core/cfg').set(C);}).then(function(){
    CORE.cfg=C;
    Object.keys(P.data).forEach(function(mid){
      var byY={};Object.keys(P.data[mid]).forEach(function(ym){(byY[ym.slice(0,4)]=byY[ym.slice(0,4)]||[]).push(ym);});
      Object.keys(byY).forEach(function(y){
        var doc=coreDoc(y,mid);byY[y].forEach(function(ym){var a=P.data[mid][ym],n=ymDays(ym),d=[];for(var i=0;i<n;i++)d.push(a[i]||'');while(d.length&&!d[d.length-1])d.pop();if(d.length)doc.m[ym]={d:d};});
        jobs.push({y:y,mid:mid});
      });
    });
    I.total=jobs.length;
    var chain=Promise.resolve();
    jobs.forEach(function(j){chain=chain.then(function(){return DB.doc('core/y/'+j.y+'/'+j.mid).set({mid:j.mid,m:CORE.years[j.y][j.mid].m});}).then(function(){I.done++;var b=document.querySelector('[data-act="coreimpgo"]');if(b)b.textContent='Đang nhập… '+I.done+'/'+I.total;});});
    return chain;
  }).then(function(){CORE.imp=null;toast('Đã nhập '+P.members.length+' người, '+P.months.length+' tháng. Vào Thiết lập để điền tài khoản và vai trò.',8000);render();},
    function(e){I.busy=false;toast((e&&e.message)||'Nhập chưa xong, thử lại.',8000);render();});
}

function coreNpYear(mid,y){var n=0,doc=CORE.years[y]&&CORE.years[y][mid];if(doc&&doc.m)Object.keys(doc.m).forEach(function(k){(doc.m[k].d||[]).forEach(function(x){if(coreKind(x)==='np')n++;});});return n;}
function coreXlsx(){
  var R=coreRange(),ks=R.keys,ms=R.members,lv=+(CORE.cfg||{}).leaveYear||12;
  withExcel(function(EJ){
    var wb=new EJ.Workbook(),ws=wb.addWorksheet(R.sheet,{views:[{state:'frozen',xSplit:2,ySplit:2}]});

    r1.push('Ngày làm','Giờ công','OFF','NP','Phép năm');r2.push('','','','','');
    ws.addRow(r1);ws.addRow(r2);
    ms.forEach(function(m){var row=[m.id,m.name],w=0,hh=0,o=0,np=0;
      ks.forEach(function(k){var x=coreOnDate(m,k)?coreGet(m.id,k):'',kd=coreKind(x);row.push(x);if(coreWorks(x)){w++;hh+=coreHoursOf(x);}else if(kd==='off')o++;else if(kd==='np')np++;});
      row.push(w,Math.round(hh*100)/100,o,np,coreNpYear(m.id,ks[ks.length-1].slice(0,4))+'/'+lv);ws.addRow(row);});
    ws.getColumn(1).width=10;ws.getColumn(2).width=24;for(var c=3;c<=ks.length+2;c++)ws.getColumn(c).width=16;
    [1,2].forEach(function(rr){ws.getRow(rr).font={name:'Arial',bold:true};ws.getRow(rr).eachCell(function(c){xFill(c,'FFE2E8FC');});});
    ks.forEach(function(k,i2){if(dow(k)>=5)for(var rr=3;rr<=ms.length+2;rr++)xFill(ws.getCell(rr,i2+3),'FFFFF4E5');});
    ms.forEach(function(m,mi){ks.forEach(function(k,i){var kd=coreKind(coreGet(m.id,k));if(kd==='off'||kd==='np'||kd==='le')ws.getCell(mi+3,i+3).font={name:'Arial',bold:true,color:{argb:kd==='off'?'FF7B1FA2':kd==='np'?'FFB26A00':'FFC62828'}};});});
    return wb;
  },'Lich-core-team_'+R.tag+'.xlsx');

/* ---------- xuất file nhập MISA (cùng mẫu file Phân ca của Xếp ca) ---------- */
function coreMisaVal(x){var c=CORE.cfg||{},k=coreKind(x);if(k==='none')return '';if(k==='off')return c.misaOff||'';if(k==='np')return c.misaNp||'';if(k==='le')return c.misaLe||'';return String(x).trim();}
function coreMisa(){

      [r-1,p.id,p.name,xDate(k),v,coreWorks(x)?coreHoursOf(x):'',kd==='off'?'OFF – nghỉ định kỳ':kd==='np'?'NP – phép năm':kd==='le'?'Nghỉ lễ':''].forEach(function(z,q){l.getCell(r,q+1).value=z;});
      l.getCell(r,4).numFmt='dd/mm/yyyy';r++;});});
    xHeader(ref,[['Mã ca MISA',22],['Giờ công',10],['Ghi chú',36]]);
    var rows=(CORE.cfg.shifts||[]).map(function(s){return [s.code,coreHoursOf(s.code),''];});
    rows.push(['OFF',0,CORE.cfg.misaOff?'ghi mã '+CORE.cfg.misaOff:'để trống trên MISA']);rows.push(['NP',0,CORE.cfg.misaNp?'ghi mã '+CORE.cfg.misaNp:'để trống trên MISA']);rows.push(['Nghỉ lễ',0,CORE.cfg.misaLe?'ghi mã '+CORE.cfg.misaLe:'để trống trên MISA']);
    rows.forEach(function(a,i){a.forEach(function(z,q){ref.getCell(i+2,q+1).value=z;});});
    ref.getCell(rows.length+3,1).value='Core team Miền Nam · '+R.label;ref.getCell(rows.length+3,1).font={name:'Arial',italic:true,color:{argb:XGREY}};
    return wb;
  },'Phan_ca_MISA_core-team_'+R.tag+'.xlsx');
}

function minH(m){m=((m%1440)+1440)%1440;var hh=Math.floor(m/60),mm=m%60;return hh+'h'+(mm?pad(mm):'');}
/* nhãn khung giờ: các ca liền nhau gộp thành 1 khối "8h–17h30", ca gãy cách nhau bằng dấu phẩy */
function spanLabel(ids){
  var T=ids.map(function(id){return shiftSpan(shift(id));}).filter(Boolean).sort(function(a,b){return a[0]-b[0];}),parts=[],cur=null;
  T.forEach(function(t){if(cur&&t[0]<=cur[1])cur[1]=Math.max(cur[1],t[1]);else{cur=[t[0],t[1]];parts.push(cur);}});
  return parts.map(function(t){return minH(t[0])+'–'+minH(t[1]);}).join(', ');
}

/* ---------- chọn người cho chỗ trống ---------- */
/* wide: thêm cả người chưa đăng ký ca này (CHT gọi thêm, ghi x.out) và người có ô Nghỉ ngày đó (x.off) — chỉ dùng ở ô "+ Thêm người" */
function slotCands(k,d,shId,pid,wide){
  var dk=addDays(k,d),out=[];
  S.staff.forEach(function(st){
    if(!inWeek(st,k)||!employed(st,dk)||st.skills.indexOf(pid)<0)return;
    var c=getCell(k,st.id,d),lv=leaveOn(st.id,k,d),a=avail(st,k,d),off=!!(c&&c.s==='O');
    if(off&&(!wide||c.lv||c.sw||lv==='F'))return;if(blocks(lv,shId))return;if(off)c=null;
    if(c&&c.s&&(covers(c.s,shId)||overlapIds(shiftsOf(c.s),shId)))return;
    if(c&&c.s&&!holdAfterOk(c,shId,pid))return; /* vị trí xếp trước: không tách khối ca */
    var reg=availOk(a,shId);if(!reg&&!wide)return;
    var ids=(c&&c.s?shiftsOf(c.s):[]).concat([shId]);if(reg&&!(c&&c.call)?!splitOk(st,k,d,ids):isSplit(units(ids)))return;
    var inf=staffInfo(k,st),full=ftDayMode(st)?(!c&&inf.days>=Math.min(6,+st.max||6)):(inf.load+1>st.max);
    out.push({st:st,c:c,rank:skillRank(st,pid),full:full,h:weekHoursOf(k,st.id),r:fairR(st,k),out:!reg,off:off,reg:a?(a==='A'?'cả ngày':regShort(a)):''});
  });
  return out.sort(function(a,b){return (a.full-b.full)||a.rank-b.rank||ordIdx(a.st,pid)-ordIdx(b.st,pid)||a.r-b.r;});
}
function assignAtom(k,sid,d,shId,pid,call){
  if(call){var c0=getCell(k,sid,d);if(c0&&c0.s==='O')setCell(k,sid,d,null);}
  var st=staffById(sid),c=getCell(k,sid,d),dv=regDev(st,k,d,shId);
  if(!c||!c.s||c.s==='O')setCell(k,sid,d,{s:shId,p:pid,dv:dv||undefined});
  else{var ps=JSON.parse(JSON.stringify(c.ps||{}));if(pid!==c.p)ps[shId]=pid;setCell(k,sid,d,{s:comboOf(shiftsOf(c.s).concat([shId])),p:c.p,ps:Object.keys(ps).length?ps:undefined,sw:c.sw,call:c.call,dv:Math.max(c.dv||0,dv)||undefined});}
  if(call){var c1=getCell(k,sid,d);c1.call=1;delete c1.dv;}
}
/* ô ca gãy mà nhân viên không đăng ký ca gãy (do bản trước 22/10, dữ liệu cũ): sửa từ gốc — xoá ngày đó của người đó
   rồi để Tự xếp xếp lại từ đầu như mọi chỗ trống (chỉ xếp khối liền trong khung đăng ký, đặt vào chỗ đang cần nhất).
   Gọi trước khi chụp danh sách ô có sẵn nên ô đã xoá được xếp lại tự do. Bỏ qua ô đổi ca. */
function repairSplits(k){
  var n=0;
  S.staff.forEach(function(st){for(var d=0;d<7;d++){
    var c=getCell(k,st.id,d);if(!c||!c.s||c.s==='O'||c.sw||c.call)continue;
    if(splitOk(st,k,d,shiftsOf(c.s)))continue;
    setCell(k,st.id,d,null);n++;
  }});
  return n;
}
/* ca có giờ làm nhưng trống vị trí (vị trí đã bị xoá ở Thiết lập site, hoặc ô cũ chưa chọn vị trí): giữ nguyên giờ,
   gán lại từng ca vào vị trí người đó đã đào tạo đang thiếu nhất, không thiếu thì vị trí ưu tiên đầu tiên.
   Gọi khi xoá vị trí và đầu Tự xếp. Người chưa đào tạo vị trí nào thì để nguyên (hiện ở mục Lưu ý). */
function fixLostPos(k){
  var n=0,cov=coverage(k);
  S.staff.forEach(function(st){for(var d=0;d<7;d++){
    var c=getCell(k,st.id,d);if(!c||!c.s||c.s==='O')continue;
    var ids=shiftsOf(c.s),m={},bad=0;
    ids.forEach(function(id){var p=posOf(c,id);if(p&&pos(p))m[id]=p;else bad++;});
    if(!bad&&pos(c.p))continue;
    var sk=st.skills.filter(function(pid){return pos(pid);});if(!sk.length)continue;
    ids.forEach(function(id){
      if(m[id])return;
      var best=null,bg=0;sk.forEach(function(pid){var g=needF(d,id,pid)-((cov[d][id]||{})[pid]||0);if(g>bg){bg=g;best=pid;}});
      m[id]=best||(pos(c.p)?c.p:sk[0]);if(cov[d][id]&&cov[d][id][m[id]]!=null)cov[d][id][m[id]]++;n++;
    });
    var p0=pos(c.p)&&ids.some(function(id){return m[id]===c.p;})?c.p:m[ids[0]],ps={};
    ids.forEach(function(id){if(m[id]!==p0)ps[id]=m[id];});
    var o=JSON.parse(JSON.stringify(c));o.p=p0;if(Object.keys(ps).length)o.ps=ps;else delete o.ps;setCell(k,st.id,d,o);
  }});
  return n;
}
/* chỗ thiếu còn lại mà không người rảnh nào làm được: đẩy dây chuyền (tối đa 3 bước trong cùng ca).
   Vd thiếu Nhà bóng: X (FnB → Nhà bóng), Y (Thu ngân → FnB), Z rảnh vào Thu ngân. Người được đẩy giữ nguyên giờ;
   chỉ người rảnh cuối dây nhận thêm ca (trong khung đăng ký, không ca gãy, không quá 6 ngày — slotCands đã kiểm).
   Kiểu 2: PT làm 1 ca khác cùng ngày có đăng ký ca thiếu → chuyển sang, chỗ cũ lấp bằng dây chuyền như trên.
   Đẩy thử không lấp được thì trả lại như cũ. Phương án C: không trộn vị trí trong 1 ngày. */
function chainFree(k,d,shId,pid,used){
  return slotCands(k,d,shId,pid).filter(function(z){
    if(used[z.st.id]||z.full)return false;
    if(z.c&&z.st.role==='FT'&&!ftMulti(z.st,k))return false;
    if(!z.c&&staffInfo(k,z.st).days>=6)return false;
    return AF.cross||!z.c||z.c.p===pid;
  }).sort(function(a,b){return a.r-b.r;})[0]||null;
}
/* thêm 1 người cho vị trí q ở ca shId ngày d; true nếu lấp được (dữ liệu đã đổi), false thì không đổi gì */
function chainPos(k,d,shId,q,depth,used){
  var Z=chainFree(k,d,shId,q,used);
  if(Z){assignAtom(k,Z.st.id,d,shId,q);return true;}
  if(depth<=0)return false;
  var L=S.staff.filter(function(X){
    if(used[X.id]||X.skills.indexOf(q)<0)return false;
    var c=getCell(k,X.id,d);if(!c||!c.s||c.s==='O'||c.sw||!covers(c.s,shId)||blocks(leaveOn(X.id,k,d),shId))return false;
    var r=posOf(c,shId);if(!r||r===q||!pos(r))return false;
    if(!holdAfterOk(c,shId,q))return false;
    return AF.cross||shiftsOf(c.s).length===1;
  });
  for(var i=0;i<L.length;i++){
    var X=L[i],c=getCell(k,X.id,d),keep=JSON.parse(JSON.stringify(c)),r=posOf(c,shId);
    used[X.id]=1;setAtomPos(k,X,d,shId,q);
    if(coverage(k)[d][shId][r]>=needF(d,shId,r)||chainPos(k,d,shId,r,depth-1,used))return true;
    setCell(k,X.id,d,keep);delete used[X.id];
  }
  return false;
}
function chainFill(k){
  var n=0;
  for(var guard=0;guard<60;guard++){
    var cov=coverage(k),hit=false;
    for(var d=0;d<7&&!hit;d++)atomShifts().forEach(function(sh){if(hit)return;
      S.positions.forEach(function(q){if(hit||needF(d,sh.id,q.id)<=cov[d][sh.id][q.id])return;
        if(chainPos(k,d,sh.id,q.id,3,{})){n++;hit=true;return;}
        /* kiểu 2: PT đang làm 1 ca khác cùng ngày (m2, vị trí r2), đăng ký ca thiếu, đã đào tạo q → chuyển sang ca thiếu */
        S.staff.forEach(function(X){if(hit)return;
          var c=getCell(k,X.id,d);if(X.role!=='PT'||!c||!c.s||c.s==='O'||c.sw||X.skills.indexOf(q.id)<0)return;
          var ids=shiftsOf(c.s);if(ids.length!==1||ids[0]===sh.id||overlapIds(ids,sh.id))return;
          if(!availOk(avail(X,k,d),sh.id)||blocks(leaveOn(X.id,k,d),sh.id))return;
          var m2=ids[0],r2=posOf(c,m2);if(!r2||!pos(r2))return;

/* bỏ 1 ca khỏi ô của 1 người (giữ các ca khác và vị trí của chúng) */

/* ---------- vị trí "xếp trước, không tách ca" (26/10, Phúc: FnB bàn giao rắc rối — két, kho, nguyên liệu) ----------
   p.hold = true. Chưa đặt (p.hold == null) thì tự bật cho vị trí tên FnB / F&B / FNB / FB. Áp dụng cho mọi phương án.
   1) Xếp TRƯỚC mọi vị trí khác (holdPrefill, gọi đầu mỗi lượt Tự xếp): mỗi ngày lấp chỗ trống của vị trí này bằng khối ca liền
      dài nhất mà một người làm được trong khung đăng ký → ít người đứng nhất, ít lần bàn giao nhất.
   2) Không tách ca ở vị trí này (holdAfterOk): các ca một người đứng ở đây trong ngày phải liền một khối, không bị chen vị trí khác
      vào giữa, không thành 2 khúc cách giờ. Ngoài khối đó người ấy vẫn đứng vị trí khác được (vd FnB 8h–17h rồi Thu ngân tối). */
function posHold(pid){var p=pos(pid);if(!p)return false;if(p.hold!=null)return !!p.hold;return /^\s*f\s*(&|n|and)?\s*b\b/i.test(p.name||'')||/^\s*f\s*(&|n)?\s*b\s*$/i.test(p.short||'');}
function holdIds(){return S.positions.filter(function(p){return posHold(p.id);}).map(function(p){return p.id;});}
/* seq: [{t:[giờ đầu, giờ cuối], p: vị trí}] theo giờ. Hợp lệ khi ca ở mỗi vị trí xếp trước liền một khối, không chen, không hở giờ */
function holdSeqOk(seq){
  var H=holdIds();if(!H.length)return true;
  seq=seq.slice().sort(function(x,y){return (x.t?x.t[0]:0)-(y.t?y.t[0]:0);});
  return H.every(function(hp){
    var ix=[];seq.forEach(function(x,i){if(x.p===hp)ix.push(i);});if(ix.length<2)return true;
    for(var i=ix[0];i<=ix[ix.length-1];i++)if(seq[i].p!==hp)return false;
    for(var j=1;j<ix.length;j++){var u=seq[ix[j-1]].t,v=seq[ix[j]].t;if(u&&v&&v[0]>u[1])return false;}
    return true;
  });
}
/* đổi (hoặc thêm) ca shId sang vị trí pid trong ô c thì có tách khối ca ở vị trí xếp trước không */
function holdAfterOk(c,shId,pid){
  if(!c||!c.s||c.s==='O')return true;
  var ids=shiftsOf(c.s).slice();if(ids.indexOf(shId)<0)ids.push(shId);
  return holdSeqOk(ids.map(function(id){return {t:shiftSpan(shift(id)),p:id===shId?pid:posOf(c,id)};}));
}
/* xếp trước: mỗi ngày, mỗi vị trí xếp trước, còn chỗ trống thì chọn người rảnh (PT, đã đào tạo, chưa có ca ngày đó) đứng được
   chuỗi ca liền dài nhất (theo giờ) trong các ca đang thiếu; hoà thì vị trí này là ưu tiên cao hơn → tỷ lệ giờ thấp hơn → thứ tự.
   Tôn trọng: đăng ký, nghỉ phép, số ca tối đa/tuần, ≤ 6 ngày/tuần. FT xếp theo luật FT (preassignFT, luồng chính). */
function holdPrefill(k){
  var H=holdIds();if(!H.length)return 0;
  var AT=atomsByTime(),T=AT.map(function(sh){return shiftSpan(sh);}),cov=coverage(k),n=0;
  for(var d=0;d<7;d++)H.forEach(function(pid){
    for(var guard=0;guard<30;guard++){
      var gap=AT.map(function(sh){return needF(d,sh.id,pid)-cov[d][sh.id][pid];});if(!gap.some(function(g){return g>0;}))break;
      var best=null;
      S.staff.forEach(function(st){
        if(st.role!=='PT'||!inWeek(st,k)||!employed(st,addDays(k,d))||st.skills.indexOf(pid)<0||getCell(k,st.id,d))return;
        var a=avail(st,k,d),lv=leaveOn(st.id,k,d);if(!a||lv==='F')return;
        var inf=staffInfo(k,st),capL=(+st.max||0)-inf.load;if(inf.days>=6||capL<=0)return;
        var ok=AT.map(function(sh,i){return gap[i]>0&&T[i]&&availOk(a,sh.id)&&!blocks(lv,sh.id);});
        /* chuỗi dài nhất: ca sau bắt đầu đúng lúc ca trước kết thúc (ca trùng giờ không cùng chuỗi) */
        var memo={};function run(i){if(memo[i])return memo[i];var hi=+AT[i].hours||0,r={ids:[AT[i].id],h:hi};
          if(capL>1)for(var j=0;j<AT.length;j++)if(ok[j]&&T[j][0]===T[i][1]){var x=run(j);if(x.ids.length+1<=capL&&x.h+hi>r.h)r={ids:[AT[i].id].concat(x.ids),h:x.h+hi};}
          return memo[i]=r;}
        for(var i=0;i<AT.length;i++){if(!ok[i])continue;var r=run(i);
          var sc=[r.h,-skillRank(st,pid),-fairR(st,k),-ordIdx(st,pid)];
          if(!best||sc[0]>best.sc[0]+1e-9||(Math.abs(sc[0]-best.sc[0])<1e-9&&(sc[1]>best.sc[1]||(sc[1]===best.sc[1]&&(sc[2]>best.sc[2]+1e-9||(Math.abs(sc[2]-best.sc[2])<1e-9&&sc[3]>best.sc[3]))))))best={st:st,ids:r.ids,sc:sc};}
      });
      if(!best)break;
      var ids=best.ids,dv=0;ids.forEach(function(id){dv=Math.max(dv,regDev(best.st,k,d,id)||0);});
      setCell(k,best.st.id,d,{s:comboOf(ids),p:pid,dv:dv||undefined});ids.forEach(function(id){cov[d][id][pid]++;});n+=ids.length;
    }
  });
  return n;
}
/* số lần bàn giao ở các vị trí xếp trước trong tuần: giữa 2 ca liền nhau, số người rời đi được thay bằng người mới */
function holdHandovers(k){
  var H=holdIds(),AT=atomsByTime(),n=0;if(!H.length)return 0;
  for(var d=0;d<7;d++)H.forEach(function(pid){AT.forEach(function(A){AT.forEach(function(B){var a=shiftSpan(A),b=shiftSpan(B);if(!a||!b||a[1]!==b[0])return;
    var X=slotPeople(k,d,A.id,pid).map(function(x){return x.st.id;}),Y=slotPeople(k,d,B.id,pid).map(function(x){return x.st.id;});
    var out=X.filter(function(id){return Y.indexOf(id)<0;}).length,inn=Y.filter(function(id){return X.indexOf(id)<0;}).length;n+=Math.min(out,inn); /* người rời được thay bằng người mới; người vào thêm khi cần đông hơn không tính */});});});
  return n;
}

/* ---------- gỡ lượt dư: mỗi ô có > cần, gỡ ca ở đầu hoặc cuối khối của người ít ưu tiên nhất (không tạo ca gãy) ---------- */
function trimOver(k){
  var n=0;
  for(var d=0;d<7;d++)atomShifts().forEach(function(sh){S.positions.forEach(function(p){
    var need=needF(d,sh.id,p.id);
    for(var guard=0;guard<20;guard++){
      var L=slotPeople(k,d,sh.id,p.id);if(L.length<=need)break;
      var cand=L.filter(function(x){if(x.c.sw||leaveOn(x.st.id,k,d))return false;var ids=shiftsOf(x.c.s),rest=ids.filter(function(z){return z!==sh.id;});return !rest.length||!isSplit(units(rest))||isSplit(units(ids));});
      if(!cand.length)break;
      cand.sort(function(a,b){return skillRank(b.st,p.id)-skillRank(a.st,p.id)||ordIdx(b.st,p.id)-ordIdx(a.st,p.id)||fairR(b.st,k)-fairR(a.st,k);});
      removeAtom(k,cand[0].st.id,d,sh.id);
      n++;
    }
  });});
  return n;
}

/* ================= TỰ XẾP RA 4 PHƯƠNG ÁN =================
   Chạy autofill 4 lần trên bản sao lịch tuần (mỗi lần một bộ trọng số AF_MODES), tính số liệu so sánh, trả lịch về như cũ.
   CHT so sánh (bảng số liệu, số ô khác nhau, giờ từng người), xem trước theo vị trí hoặc theo nhân viên với ô khác được tô màu,
   rồi bấm Dùng: lúc đó mới ghi vào lịch và lưu. */
var PLANS=null,PLAN_IDS=['A','B','C','D'];
function planStats(k){
  var cov=coverage(k),st=stats(cov),pd=0,ppl={},alt=0,ptH=0,ptCost=0,whole=0,regLong=0,longD=0,rat=[];
  S.staff.forEach(function(s){
    if(!inWeek(s,k))return;
    for(var d=0;d<7;d++){var c=getCell(k,s.id,d),a=avail(s,k,d),R=a&&a!=='A'?regList(a):[],ids=(c&&c.s&&c.s!=='O')?shiftsOf(c.s):[];
      if(R.length>1){regLong++;if(R.every(function(x){return ids.indexOf(x)>=0;}))whole++;}
      if(!ids.length)continue;pd++;ppl[s.id]=1;
      ids.forEach(function(id){var q=posOf(c,id);if(q&&q!==s.skills[0])alt++;});
      if(ids.length>1)longD++;}
    if(s.role==='PT'){var h=weekHoursOf(k,s.id),cap=capHours(s,k);ptH+=h;ptCost+=h*(+s.rate||0);if(cap>0)rat.push(h/cap*100);}
  });
  return {need:st.need,filled:st.filled,short:st.short,over:st.over,pct:st.need?st.filled/st.need*100:100,pd:pd,people:Object.keys(ppl).length,alt:alt,ptH:ptH,ptCost:ptCost,whole:whole,regLong:regLong,longD:longD,
    hand:holdHandovers(k),rlo:rat.length?Math.min.apply(null,rat):0,rhi:rat.length?Math.max.apply(null,rat):0};
}
/* giờ từng người trong 1 phương án */
function planHours(k){var o={};S.staff.forEach(function(s){if(inWeek(s,k))o[s.id]=weekHoursOf(k,s.id);});return o;}
/* ô giữ lại khi Xếp lại cả tuần: đổi ca, nghỉ phép, ngày nghỉ CHT đã đặt */
/* xếp lại cả tuần vẫn giữ: ô đổi ca, nghỉ phép, ngày nghỉ, ô CHT gọi thêm người chưa đăng ký */

function planFreshBase(w){var o={};Object.keys(w||{}).forEach(function(sid){Object.keys(w[sid]).forEach(function(d){if(planKeepCell(w[sid][d]))(o[sid]||(o[sid]={}))[d]=clone(w[sid][d]);});});return Object.keys(o).length?o:null;}
function planFixedCount(w){var n=0;Object.keys(w||{}).forEach(function(sid){Object.keys(w[sid]).forEach(function(d){if(!planKeepCell(w[sid][d]))n++;});});return n;}
function buildPlans(k,fresh){
  var keep=S.weeks[k]?clone(S.weeks[k]):null,base=fresh?planFreshBase(keep):keep,out=[];
  PLAN_IDS.forEach(function(id){
    if(base)S.weeks[k]=clone(base);else delete S.weeks[k];
    AF=AF_MODES[id];var r;try{r=autofill(k);}finally{AF=AF_MODES.A;}
    out.push({id:id,m:AF_MODES[id],r:r,cells:S.weeks[k]?clone(S.weeks[k]):null,s:planStats(k),hrs:planHours(k)});
  });
  if(keep)S.weeks[k]=keep;else delete S.weeks[k];
  out.forEach(function(p,i){p.sig=stable(p.cells||{});for(var j=0;j<i;j++)if(out[j].sig===p.sig){p.same=out[j].id;break;}});
  out.forEach(function(p){p.diffA=planDiff(p.cells,out[0].cells).length;});

}
/* các ô (người, ngày) khác nhau giữa 2 lịch tuần */
function planCell(cells,sid,d){var c=cells&&cells[sid]&&cells[sid][d];return c||null;}
function planDiff(a,b){
  var ids={},out=[];[a||{},b||{}].forEach(function(w){Object.keys(w).forEach(function(sid){ids[sid]=1;});});
  Object.keys(ids).forEach(function(sid){for(var d=0;d<7;d++)if(stable(planCell(a,sid,d))!==stable(planCell(b,sid,d)))out.push(sid+':'+d);});
  return out;
}

/* lịch xem trước theo nhân viên (chỉ xem): ô khác phương án so sánh được tô màu và ghi lịch của phương án đó */
function planStaffGrid(k,P,C){

    return (ia<0?99:ia)-(ib<0?99:ib)||ordIdx(a,a.skills[0])-ordIdx(b,b.skills[0])||a.name.localeCompare(b.name);});
  var h='<div class="gridwrap"><table class="plgrid"><thead><tr><th class="name">Nhân viên</th>';

function ltFindPos(t){var n=norm(t);if(!n)return null;return S.positions.filter(function(p){return norm(p.name)===n||norm(p.short)===n;})[0]||null;}
function ltParse(rows){
  var hdr=-1,m={code:-1,name:-1,ca:[],ps:[]};
  for(var i=0;i<Math.min(10,rows.length)&&hdr<0;i++){var r=rows[i]||[],ca=[],ps=[],code=-1,name=-1;
    r.forEach(function(v,j){var t=String(v||''),n=norm(t),pr=t.split(/\s*·\s*/),dd=dayOfHeader(pr[0]);
      if(/^(ma nv|ma nhan vien|msnv)$/.test(n))code=j;else if(/^(ho ten|ho va ten|ten nhan vien)$/.test(n))name=j;
      else if(dd>=0&&pr.length>1){var nn=norm(pr[1]);if(/^ca$/.test(nn))ca[dd]=j;else if(/^vi tri$/.test(nn))ps[dd]=j;}});
    var nd=ca.filter(function(x){return x!=null;}).length;if(nd>=5&&(code>=0||name>=0)){hdr=i;m={code:code,name:name,ca:ca,ps:ps};}}
  if(hdr<0)return null;
  var wk=findWeekTop(rows)||view.week,out={week:wk,recs:[],miss:[],errs:0,warns:0,cells:0};
  for(var r=hdr+1;r<rows.length;r++){
    var row=rows[r]||[],code=String(cellOf(row,m.code)||'').trim(),name=String(cellOf(row,m.name)||'').trim();
    if(!code&&!name)continue;if(/^(doi soat|ca |thu ngan|tong)/.test(norm(code+' '+name))&&!staffByCode(code)&&!staffByName(name))break; /* hết bảng lịch */
    var st=staffByCode(code)||staffByName(name);
    if(!st){if(code||name)out.miss.push(name||code);continue;}
    var rec={st:st,days:[]};
    for(var d=0;d<7;d++)rec.days.push(ltCell(st,wk,d,String(cellOf(row,m.ca[d])||'').trim(),String(cellOf(row,m.ps[d])||'').trim()));
    rec.days.forEach(function(x){if(x.err)out.errs++;if(x.warn.length)out.warns++;if(x.c&&x.c.s&&x.c.s!=='O')out.cells++;});
    out.recs.push(rec);
  }
  return out;
}
/* 1 ô: trả về {c: ô lịch sẽ ghi (null = trống), keep: giữ ô web (nghỉ phép / đổi ca), err, warn:[], txt} */
function ltCell(st,k,d,ca,pt){
  var o={c:null,keep:false,err:'',warn:[],txt:ca,pt:pt},n=norm(ca),cur=getCell(k,st.id,d),lv=leaveOn(st.id,k,d);
  if(cur&&(cur.lv||cur.sw)){o.keep=true;if(n&&ltCaText(st,k,d)!==ca&&!/^nghi phep$/.test(n))o.warn.push(cur.sw?'ô đổi ca trên web, giữ nguyên':'nghỉ phép trên web, giữ nguyên');return o;}
  if(!n)return o;
  if(/^nghi phep$/.test(n)){if(lv==='F'){o.keep=true;return o;}o.c={s:'O'};o.warn.push('chưa có đơn nghỉ phép trên web: ghi là Nghỉ, tạo đơn ở tab Nghỉ phép');return o;}
  if(/^(nghi|off|o)$/.test(n)){o.c={s:'O'};return o;}
  var v=parseRegVal(ca);if(!v){o.err='không đọc được ca "'+ca+'"';return o;}
  var ids=v==='A'?atomIds():expandIds(v.split(',')),s=comboOf(ids);
  for(var i=0;i<ids.length;i++)for(var j=i+1;j<ids.length;j++)if(overlapIds([ids[i]],ids[j])){o.err='các ca trùng giờ nhau';return o;}
  if(lv==='F'){o.err='trùng ngày nghỉ phép đã duyệt';return o;}
  if(blocks(lv,s))o.warn.push('trùng ca nghỉ phép');
  /* vị trí: 1 vị trí cho cả ngày, hoặc theo thứ tự ca nối bằng + */
  var U=units(ids),parts=pt?pt.split(/\s*\+\s*/).filter(Boolean):[],P=[];
  if(!parts.length){var mp=st.skills.filter(function(x){return pos(x);})[0];if(!mp){o.err='chưa ghi vị trí và người này chưa đào tạo vị trí nào';return o;}P=[mp];o.warn.push('chưa ghi vị trí: dùng vị trí chính '+pos(mp).name);}
  else for(var q=0;q<parts.length;q++){var p=ltFindPos(parts[q]);if(!p){o.err='không có vị trí "'+parts[q]+'"';return o;}P.push(p.id);}
  if(P.length>1&&P.length!==U.length){o.err='ghi '+P.length+' vị trí cho '+U.length+' ca';return o;}
  var ps={},p0=P[0];if(P.length>1)U.forEach(function(u,ui){(isComp(u.id)?compParts(u.id):[u.id]).forEach(function(id){if(P[ui]!==p0)ps[id]=P[ui];});});
  if(!holdSeqOk(U.map(function(u,ui){return {t:shiftSpan(u),p:P.length>1?P[ui]:P[0]};})))o.warn.push(holdIds().filter(function(x){return P.indexOf(x)>=0;}).map(function(x){return pos(x).name;}).join(', ')+' bị tách thành nhiều khúc trong ngày (bàn giao nhiều lần)');
  P.forEach(function(x){if(st.skills.indexOf(x)<0)o.warn.push('chưa đào tạo vị trí '+pos(x).name);});
  o.c={s:s,p:p0};if(Object.keys(ps).length)o.c.ps=ps;
  if(!availOk(avail(st,k,d),s)){o.c.call=1;o.warn.push('ngoài đăng ký ('+(regShort(avail(st,k,d))||'không đăng ký')+')');}
  else if(!splitOk(st,k,d,ids))o.warn.push('ca gãy không có trong đăng ký');
  return o;
}
function readLtFile(file){
  if(!file)return;toast('Đang đọc file…');
  var fr=new FileReader();
  fr.onload=function(){
    loadXLSX().then(function(X){
      var wb;try{wb=X.read(new Uint8Array(fr.result),{type:'array',cellDates:false});}catch(e){toast('Không đọc được file này. Kiểm tra file đúng định dạng .xlsx và không đặt mật khẩu.',8000);return;}
      var res=null;wb.SheetNames.forEach(function(nm){if(res||/^_/.test(nm))return;res=ltParse(X.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:true,defval:''}));});
      if(!res){toast('Không thấy bảng lịch trong file. Dùng file tải từ nút "Tải file lịch mẫu" (mỗi ngày 2 cột Ca · Vị trí).',9000);return;}
      LT.res=res;LT.name=file.name;LT.step='prev';
      if(res.week!==view.week){view.week=res.week;render();}
      renderLt();
    },function(){toast('Không tải được bộ đọc Excel. Kiểm tra kết nối mạng rồi thử lại.',8000);});
  };
  fr.readAsArrayBuffer(file);
}
function applyLt(){
  var R=LT.res,k=R.week,n=0;
  R.recs.forEach(function(rec){for(var d=0;d<7;d++){var x=rec.days[d];if(x.keep||x.err)continue;var cur=getCell(k,rec.st.id,d);if(cur&&(cur.lv||cur.sw))continue;setCell(k,rec.st.id,d,x.c?clone(x.c):null);if(x.c&&x.c.s!=='O')n++;}});
  markDirty();LT.step='done';LT.applied=n;render();renderLt();
}

   Dòng 1 "Xem ví dụ mẫu nhập khẩu bảng phân ca", dòng 2 tiêu đề gộp ô, dòng 3 trống, dòng 4 tiêu đề cột:
   "Mã nhân viên (*)" | "Họ và tên" | mỗi ngày 1 cột ghi DD/MM/YYYY (chữ); dữ liệu từ dòng 5. Nhiều ca: "CA1; CA2". Không có cột STT.
   rows: [{code, name, vals:[chuỗi hoặc null = ngoài thời gian làm], fills:[màu ô hoặc null], grey:[true = ô nghỉ]}] */
var MISA_HEAD='FFD0CECE';
function misaBangPhanCa(wb,dates,rows){
  var m=wb.addWorksheet('Bang_phan_ca'),nc=2+dates.length,F={name:'Times New Roman',size:12};
  m.getCell('A1').value='Xem ví dụ mẫu nhập khẩu bảng phân ca';m.getCell('A1').font={name:'Times New Roman',size:12,italic:true,color:{argb:'FF0563C1'},underline:true};
  m.mergeCells(2,1,2,Math.max(nc,6));m.getCell('A2').value='BẢNG PHÂN CA CHO NHÂN VIÊN';m.getCell('A2').font={name:'Times New Roman',size:14,bold:true};m.getCell('A2').alignment={horizontal:'center',vertical:'middle'};m.getRow(2).height=20;
  var head=['Mã nhân viên (*)','Họ và tên'].concat(dates.map(function(dk){return dm(dk)+'/'+dk.slice(0,4);}));
  head.forEach(function(t,i){var c=m.getCell(4,i+1);c.value=t;c.font={name:'Times New Roman',size:12,bold:true};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:MISA_HEAD}};c.alignment={horizontal:'center',vertical:'middle',wrapText:true};
    c.border={top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}};
    if(i===0)c.value={richText:[{text:'Mã nhân viên ',font:{name:'Times New Roman',size:12,bold:true}},{text:'(*)',font:{name:'Times New Roman',size:12,bold:true,color:{argb:'FFFF0000'}}}]};});
  m.getColumn(1).width=20;m.getColumn(2).width=26;var colW=dates.map(function(){return 13;});
  rows.forEach(function(r,i){var n=5+i;
    var a=m.getCell(n,1),b=m.getCell(n,2);a.value=r.code||'';b.value=r.name||'';a.font=F;b.font=F;if(!String(r.code||'').trim())xFill(a,'FFFFD7D5');
    r.vals.forEach(function(v,j){if(v===null)return;var c=m.getCell(n,3+j);c.value=v||'';c.font=r.grey&&r.grey[j]?{name:'Times New Roman',size:12,color:{argb:XGREY}}:F;c.alignment={horizontal:'center'};colW[j]=Math.max(colW[j],String(v||'').length+2);
      if(r.fills&&r.fills[j])xFill(c,r.fills[j]);});
  });
  colW.forEach(function(w,j){m.getColumn(3+j).width=Math.min(40,w);});
  m.views=[{state:'frozen',xSplit:2,ySplit:4}];
  return m;
}

/* ================= BỘ LỌC (26/10/2026, Phúc) =================
   Một bộ lọc dùng chung cho các bảng của Xếp ca: tên / mã NV, vị trí, ca (giờ), FT / PT, chỉ chỗ thiếu, chỉ ô cần xem lại.
   Lọc chỉ đổi phần hiển thị, không đổi số liệu (có/cần, thiếu, tổng giờ vẫn tính cả site). Giữ khi chuyển tuần, chuyển tab;
   bỏ khi đổi site. Có dòng "Đang lọc … · Bỏ lọc" để không quên đang lọc. */
var FLT={q:'',pos:'',sh:'',role:'',only:'',site:null};
function fltReset(){FLT.q='';FLT.pos='';FLT.sh='';FLT.role='';FLT.only='';}
function fltOn(){if(FLT.site!==(S&&S.siteKey||S&&S.site)){FLT.site=S&&S.siteKey||S&&S.site;fltReset();}if(FLT.pos&&!pos(FLT.pos))FLT.pos='';if(FLT.sh&&!shift(FLT.sh))FLT.sh='';return !!(FLT.q||FLT.pos||FLT.sh||FLT.role||FLT.only);}
/* người có qua bộ lọc tên, loại, vị trí (đã đào tạo) không */
function fltStaff(s){
  if(FLT.role&&s.role!==FLT.role)return false;
  if(FLT.q){var q=norm(FLT.q);if(norm(s.name).indexOf(q)<0&&norm(s.code||'').indexOf(q)<0)return false;}
  if(FLT.pos&&s.skills.indexOf(FLT.pos)<0)return false;
  return true;
}
function fltPeopleOn(){return !!(FLT.q||FLT.role);}
/* chỉ xét tên và loại (dùng trong ô của bảng Theo vị trí, nơi vị trí đã đúng sẵn) */
function fltWho(s){if(FLT.role&&s.role!==FLT.role)return false;if(FLT.q){var q=norm(FLT.q);if(norm(s.name).indexOf(q)<0&&norm(s.code||'').indexOf(q)<0)return false;}return true;}
/* ô lịch có ca / vị trí đang lọc không */
function fltCellHit(c){if(!c||!c.s||c.s==='O')return false;return shiftsOf(c.s).some(function(id){return (!FLT.sh||id===FLT.sh)&&(!FLT.pos||posOf(c,id)===FLT.pos);});}
/* bảng Theo nhân viên: người có làm (hoặc đăng ký) ca / vị trí đang lọc trong tuần */
function fltRowOk(k,s,info){
  if(FLT.only==='issue'&&!(info&&info.issues.length))return false;
  if(!FLT.sh&&!FLT.pos)return true;
  for(var d=0;d<7;d++){var c=getCell(k,s.id,d);if(fltCellHit(c))return true;if(FLT.sh&&!FLT.pos&&(!c||!c.s)&&availOk(avail(s,k,d),FLT.sh))return true;}
  return !FLT.sh&&!!FLT.pos; /* lọc vị trí: vẫn hiện người đã đào tạo vị trí đó dù tuần này chưa đứng */
}
function fltDesc(){
  var t=[];if(FLT.q)t.push('tên "'+FLT.q+'"');if(FLT.pos&&pos(FLT.pos))t.push(pos(FLT.pos).name);if(FLT.sh&&shift(FLT.sh))t.push('ca '+shift(FLT.sh).name);if(FLT.role)t.push(FLT.role);
  if(FLT.only==='short')t.push('chỉ chỗ còn thiếu');if(FLT.only==='issue')t.push('chỉ người cần xem lại');return t.join(' · ');
}
/* thanh lọc. kind: 'week-pos' | 'week-staff' | 'reg' | 'staff' */
function fltBar(kind){
  var on=fltOn(),sel=function(f,opts,lbl){return '<label class="fsel"><span>'+lbl+'</span><select class="in" data-flt="'+f+'">'+opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(FLT[f]===o[0]?' selected':'')+'>'+esc(o[1])+'</option>';}).join('')+'</select></label>';};
  var h='<div class="fbar'+(on?' on':'')+'" role="search" aria-label="Lọc"><label class="fsearch"><span class="sr">Tìm nhân viên</span><input class="in" id="flt-q" data-flt="q" value="'+esc(FLT.q)+'" placeholder="Tìm tên hoặc mã NV" autocomplete="off"></label>';
  h+=sel('pos',[['','Mọi vị trí']].concat(S.positions.map(function(p){return [p.id,p.name];})),'Vị trí');
  if(kind!=='staff')h+=sel('sh',[['','Mọi ca']].concat(atomsByTime().map(function(sh){var t=shiftSpan(sh);return [sh.id,sh.name+(t&&sh.name!==minH(t[0])+'-'+minH(t[1])?' · '+minH(t[0])+'–'+minH(t[1]):'')];})),'Ca / giờ');
  h+=sel('role',[['','FT và PT'],['FT','FT'],['PT','PT']],'Loại');
  if(kind==='week-pos')h+=sel('only',[['','Tất cả ô'],['short','Chỉ chỗ còn thiếu']],'Hiện');
  if(kind==='week-staff')h+=sel('only',[['','Tất cả người'],['issue','Chỉ người cần xem lại']],'Hiện');
  if(on)h+='<button class="btn sm ghost" data-act="fltclear">Bỏ lọc</button>';
  return h+'</div>'+(on?'<p class="fnote">Đang lọc: <b>'+esc(fltDesc())+'</b>. Số có/cần và tổng vẫn tính cả site.</p>':'');
}

function perfMine(){
  if(!PERF.cfg)return [];var me=perfMe(),pp=PERF.cfg.people||{};
  return Object.keys(pp).filter(function(id){return pp[id]&&pp[id].kit&&perfMember(id)&&(perfAdmin()||(me&&pp[id].mgr===me.id));})
    .sort(function(a,b){return PERF_KIT_ORDER.indexOf(pp[a].kit)-PERF_KIT_ORDER.indexOf(pp[b].kit)||perfName(a).localeCompare(perfName(b));});
}

function perfGrade(s){for(var i=0;i<PERF_GRADES.length;i++)if(s>=PERF_GRADES[i][0])return PERF_GRADES[i];return PERF_GRADES[4];}

function perfTg(it,ym,m,site){
  if(m&&m.tg&&m.tg[it.id]!=null&&m.tg[it.id]!=='')return perfNum(m.tg[it.id]);
  if(it.site==='rev')return PERF_REV[site]&&PERF_REV[site][ym]!=null?PERF_REV[site][ym]:null;
  if(it.site==='lab')return PERF_LAB[site]!=null?PERF_LAB[site]:null;
  return it.tg&&it.tg[ym]!=null?it.tg[ym]:null;
}
function perfPhieu(m){var ph=(m&&m.ph)||{},n=0,s=0;PERF_PHIEU.forEach(function(x,i){var v=ph[i+1]&&perfNum(ph[i+1].s);if(v){n++;s+=v;}});return n?Math.round(s/(n*5)*1000)/10:null;}
function perfItem(it,ym,m,site){
  var k=(it.km&&it.km[ym])||it.k,tg=perfTg(it,ym,m,site),raw=m&&m.v?m.v[it.id]:null,v=k==='phieu'?perfPhieu(m):k==='pass'?(raw===1||raw==='1'?1:raw===0||raw==='0'?0:null):perfNum(raw),r=null;
  if(v!=null){
    if(k==='s5')r=v/5;else if(k==='pass')r=v?1:0;else if(k==='base')r=1;else if(k==='phieu')r=v/100;
    else if(k==='max'){if(tg!=null)r=v<=tg?1:tg/v;}
    else if(tg)r=v/tg;
  }
  if(r!=null)r=Math.max(0,Math.min(1,r));
  return {it:it,k:k,tg:tg,v:v,r:r,pts:r==null?null:Math.round(it.pts*r*100)/100};
}
function perfDedList(d,ym){var L=[];Object.keys((d&&d.w)||{}).forEach(function(wk){if(perfWkMonth(wk)!==ym)return;(d.w[wk].ded||[]).forEach(function(x){L.push({wk:wk,t:x.t,p:+x.p||0});});});((d&&d.m&&d.m[ym]&&d.m[ym].ded)||[]).forEach(function(x){L.push({wk:'',t:x.t,p:+x.p||0});});return L;}
function perfMonth(mid,ym,d){
  d=d||PERF.p[mid]||{};var P=perfProfile(mid)||{},kit=perfKit(P.kit);if(!kit)return null;
  var m=(d.m||{})[ym]||{},rows=kit.items.map(function(it){return perfItem(it,ym,m,P.site);});
  var got=0,done=0;rows.forEach(function(x){if(x.pts!=null){got+=x.pts;done++;}});
  var dl=perfDedList(d,ym),ded=Math.min(20,dl.reduce(function(s,x){return s+x.p;},0)),total=Math.round((got-ded)*10)/10,g=perfGrade(total);
  return {rows:rows,got:got,done:done,n:rows.length,ded:ded,dl:dl,total:total,g:g,bonus:m.nobonus?0:g[3],m:m,lock:!!m.lock};
}

function perfLoad(force){
  if(!DB||PERF.busy||(PERF.loaded&&!force))return;PERF.busy=true;PERF.err='';
  var jobs=[DB.doc('perf/cfg').get().then(function(sn){PERF.cfg=sn.exists?sn.data():{people:{}};if(!PERF.cfg.people)PERF.cfg.people={};})];
  if(!CORE.cfg)jobs.push(DB.doc('core/cfg').get().then(function(sn){if(!CORE.cfg&&sn.exists)CORE.cfg=sn.data();}));
  [['perfp','p'],['perfa','a'],['perfk','k']].forEach(function(x){jobs.push(DB.collection(x[0]).get().then(function(s){var o={};s.docs.forEach(function(d){o[d.id]=d.data();});PERF[x[1]]=o;}));});
  Promise.all(jobs).then(function(){PERF.busy=false;PERF.loaded=true;render();},function(e){PERF.busy=false;PERF.loaded=true;PERF.err=(e&&e.message)||'Không tải được dữ liệu đánh giá.';render();});
}

/* ---------- phần chuyên môn nhân sự: thang tuần, cảm nhận, loại ghi nhận ---------- */
var PERF_RATE=['','Chưa đạt','Cần cố gắng','Đạt yêu cầu','Tốt','Xuất sắc'];

function perfKudoName(k){for(var i=0;i<PERF_KUDO.length;i++)if(PERF_KUDO[i][0]===k)return PERF_KUDO[i][1];return 'Ghi nhận';}
/* nhận xét tuần: bản mới (wins/grows) hoặc bản cũ (good/improve) */
function perfWinsOf(w){if(w.wins)return w.wins.filter(function(x){return x.t;});return w.good?[{t:w.good,impact:'',tags:[]}]:[];}
function perfGrowsOf(w){if(w.grows)return w.grows.filter(function(x){return x.t;});return w.improve?[{t:w.improve,impact:'',next:''}]:[];}
function perfPlanRate(mid,wk){var w=((PERF.p[mid]||{}).w||{})[wk],done=((PERF.a[mid]||{}).done)||{};if(!w||!w.pub)return null;var L=(w.plan||[]).filter(function(x){return x.t;});if(!L.length)return null;return {n:L.length,ok:L.filter(function(x){return done[x.id];}).length};}
function perfKudosOf(mid,from,to){return (((PERF.k[mid]||{}).list)||[]).filter(function(x){var d=(x.at||'').slice(0,10);return (!from||d>=from)&&(!to||d<=to);});}
/* thành tích web tự nhận ra: để khen đúng lúc, không để ai làm tốt mà không được biết */
function perfWins(mid){
  var out=[],lw=perfLastWk(),ym=todayKey().slice(0,7),d=PERF.p[mid]||{};
  var pr=perfPlanRate(mid,addDays(lw,-7));if(pr&&pr.ok===pr.n)out.push({t:'Hoàn thành đủ '+pr.n+'/'+pr.n+' việc đã cam kết tuần trước',k:'ok'});
  var streak=0;for(var i=1;i<=8;i++){var r=perfPlanRate(mid,addDays(lw,-7*i));if(r&&r.ok===r.n)streak++;else break;}if(streak>=2)out.push({t:streak+' tuần liền giữ đúng cam kết',k:'ok'});
  var R=perfMonth(mid,ym,d);if(R){var full=R.rows.filter(function(x){return x.r===1;}).length;if(full)out.push({t:full+'/'+R.n+' chỉ tiêu tháng đã đạt 100%',k:'ok'});
    var pm=ymAdd(ym,-1),RP=(d.m||{})[pm]?perfMonth(mid,pm,d):null;if(RP&&RP.done){var dt=Math.round((R.total-RP.total)*10)/10;if(dt>0&&R.done>=R.n-1)out.push({t:'Tăng '+perfFmt(dt)+' điểm so với '+ymLabel(pm).toLowerCase(),k:'up'});
      R.rows.forEach(function(x){var y=RP.rows.filter(function(z){return z.it.id===x.it.id;})[0];if(x.r!=null&&y&&y.r!=null&&x.r-y.r>=0.1)out.push({t:x.it.id+' tiến bộ: '+Math.round(y.r*100)+'% → '+Math.round(x.r*100)+'%',k:'up'});});}}
  var kd=perfKudosOf(mid,ym+'-01');if(kd.length)out.push({t:kd.length+' lời ghi nhận từ đồng nghiệp tháng này',k:'kudo'});

/* lời động viên theo tình hình thật: còn bao nhiêu điểm thì lên loại, tập trung vào đâu */
function perfCheer(R,weak){
  if(!R||!R.done)return 'Tháng mới bắt đầu. Đặt nhịp ngay từ tuần đầu: hoàn thành đủ việc đã cam kết mỗi tuần.';
  var i=PERF_GRADES.indexOf(R.g),up=i>0?PERF_GRADES[i-1]:null,gap=up?Math.round((up[0]-R.total)*10)/10:0;
  if(!up)return 'Bạn đang ở mức Xuất sắc. Giữ phong độ này và chia sẻ cách làm cho đồng đội.';
  var f=weak&&weak[0]?' Tập trung vào '+weak[0].it.id+' ('+weak[0].it.t.toLowerCase()+') là cách nhanh nhất.':'';
  if(gap<=5)return 'Chỉ còn '+perfFmt(gap)+' điểm nữa là lên loại '+up[1]+' · '+up[2]+'.'+f;
  if(R.g[1]==='D'||R.g[1]==='E')return 'Tháng này còn thời gian để lấy lại điểm. Quản lý sẵn sàng hỗ trợ; hãy bắt đầu từ 1 chỉ tiêu.'+f;
  return 'Bạn đang đi đúng hướng, còn '+perfFmt(gap)+' điểm để lên loại '+up[1]+'.'+f;

/* trợ lý viết nhận xét: chặn lỗi phổ biến của người chấm */
function perfCoach(w){
  var wins=(w.wins||[]).filter(function(x){return x.t&&x.t.trim();}),grows=(w.grows||[]).filter(function(x){return x.t&&x.t.trim();}),plan=(w.plan||[]).filter(function(x){return x.t&&x.t.trim();}),err=[],tip=[];
  if(!wins.length)err.push('Ghi ít nhất 1 điểm sáng. Người được ghi nhận việc tốt sẽ lặp lại việc đó; chỉ nghe góp ý thì dễ nản.');
  if(grows.length&&!plan.length)err.push('Có góp ý thì thêm ít nhất 1 việc vào Kế hoạch tuần này, để nhân viên biết bắt đầu từ đâu.');
  if(!w.rate)err.push('Chọn Đánh giá chung tuần.');
  wins.forEach(function(x,i){if(x.t.trim().length<25&&!x.impact)tip.push('Điểm sáng '+(i+1)+': nêu cụ thể việc gì và kết quả ra sao, ví dụ "Đối soát xong 6 cơ sở trước hạn 1 ngày, phát hiện lệch 2 triệu ở Site 57".');});
  grows.forEach(function(x,i){var s=(x.t+' '+(x.impact||'')).toLowerCase(),v=PERF_VAGUE.filter(function(z){return s.indexOf(z)>=0;});if(v.length)tip.push('Góp ý '+(i+1)+': "'+v[0]+'" còn chung chung. Ghi hành vi cụ thể (việc gì, ngày nào) để người nghe biết phải sửa gì.');if(!x.next)tip.push('Góp ý '+(i+1)+': thêm "Lần sau nên" để góp ý hướng về phía trước.');});
  if(grows.length>wins.length*2&&wins.length)tip.push('Góp ý đang nhiều gấp đôi lời khen. Xem lại tuần qua còn việc tốt nào chưa ghi nhận.');
  if(!w.msg)tip.push('Thêm 1 câu lời nhắn: nhân viên đọc kỹ nhất phần này.');
  return {err:err,tip:tip,wins:wins.length,grows:grows.length};
}

/* ai cần quan tâm tuần này: đang quá tải, xin hỗ trợ, quá hạn việc, đánh giá thấp 2 tuần, lâu chưa được ghi nhận */
function perfPulse(L){

  L.forEach(function(id){
    var a=PERF.a[id]||{},s=(a.self||{})[lw],d=PERF.p[id]||{},n=perfName(id);

    if(s&&s.help&&s.help.trim())out.push({id:id,t:n+' cần hỗ trợ: '+s.help.trim().slice(0,90),k:'warn'});
    var pr=perfPlanRate(id,addDays(lw,-7));if(pr&&pr.ok<pr.n/2)out.push({id:id,t:n+' mới xong '+pr.ok+'/'+pr.n+' việc tuần trước',k:'warn'});
    var r1=((d.w||{})[lw]||{}).rate,r2=((d.w||{})[addDays(lw,-7)]||{}).rate;if(r1&&r2&&+r1<=2&&+r2<=2)out.push({id:id,t:n+' 2 tuần liền ở mức Cần cố gắng trở xuống',k:'hot'});
    var praised=[0,1,2].some(function(i){var w=(d.w||{})[addDays(lw,-7*i)];return w&&w.pub&&perfWinsOf(w).length;})||perfKudosOf(id,addDays(lw,-14)).length;if(!praised)out.push({id:id,t:n+' 3 tuần chưa được ghi nhận điểm sáng nào',k:'info'});

  return {out:out,mood:moods.length?Math.round(moods.reduce(function(s,x){return s+x;},0)/moods.length*10)/10:null,nm:moods.length};

function detect(header,fields){

  fields.forEach(function(f){
    var best=-1;
    for(var i=0;i<header.length&&best<0;i++){
      if(used[i])continue;var hn=norm(header[i]);if(!hn)continue;var words=hn.split(/[^a-z0-9\/]+/);
      for(var j=0;j<f[2].length;j++){var kw=f[2][j];if(kw.indexOf(' ')<0&&kw.length<=5?(hn===kw||words.indexOf(kw)>=0):hn.indexOf(kw)>=0){best=i;break;}}
    }
    if(best>=0)used[best]=1;map[f[0]]=best;
  });
  return map;
}

function parseOff(v){

    var n=norm(t).replace(/\s+/g,' ');if(!n)return;var d=-1,m;

    else if((m=n.match(/^thu (hai|ba|tu|nam|sau|bay)$/)))d=['hai','ba','tu','nam','sau','bay'].indexOf(m[1]);

function parseDate(v,fmt){

      if(i>0){s.skills.splice(i,1);s.skills.splice(i-1,0,b.dataset.v);markDirty();render();}break;
    case 'skill':
      s=staffById(b.dataset.id);if(!s)break;i=s.skills.indexOf(b.dataset.v);
      if(i>=0){s.skills.splice(i,1);if(s.skillAt)delete s.skillAt[b.dataset.v];}else{s.skills.push(b.dataset.v);(s.skillAt||(s.skillAt={}))[b.dataset.v]=todayKey();}markDirty();render();break;
    case 'offday':
      s=staffById(b.dataset.id);if(!s)break;var dd=+b.dataset.d;i=s.off.indexOf(dd);
      if(i>=0)s.off.splice(i,1);else{s.off.push(dd);s.off.sort();}markDirty();render();break;
    case 'delstaff':
      if(view.confirm!==key){view.confirm=key;render();break;}
      view.confirm=null;S.staff=S.staff.filter(function(x){return x.id!==b.dataset.id;});
      var did=b.dataset.id;Object.keys(S.weeks).forEach(function(wk){delete S.weeks[wk][did];if(!Object.keys(S.weeks[wk]).length)delete S.weeks[wk];});Object.keys(S.reg).forEach(function(wk){delete S.reg[wk][did];});markDirty();render();toast('Đã xoá nhân viên và lịch sử ca của người này.');break;
    case 'delpos':
      if(view.confirm!==key){view.confirm=key;render();break;}
      view.confirm=null;var pid=b.dataset.id;
      S.positions=S.positions.filter(function(p){return p.id!==pid;});
      S.staff.forEach(function(x){x.skills=x.skills.filter(function(y){return y!==pid;});});
      S.demand.forEach(function(dd2){Object.keys(dd2).forEach(function(sh){delete dd2[sh][pid];});});
      var lpn=0;Object.keys(S.weeks).forEach(function(wk){lpn+=fixLostPos(wk);});
      markDirty();render();if(lpn)toast('Đã chuyển '+lpn+' ca đang xếp ở vị trí vừa xoá sang vị trí khác mà nhân viên đã đào tạo.',7000);break;
    case 'addpos':
      var np={id:'p'+rid().slice(0,6),name:'Vị trí mới',short:'VT',c:freeColor()};S.positions.push(np);markDirty();render();
      var pi=document.getElementById('pname-'+np.id);if(pi){pi.focus();pi.select();}break;
    case 'copywd':for(i=1;i<5;i++)S.demand[i]=clone(S.demand[0]);markDirty();render();toast('Đã chép định biên T2 sang T3–T6.');break;
    case 'copysat':S.demand[6]=clone(S.demand[5]);markDirty();render();toast('Đã chép định biên T7 sang CN.');break;
    case 'undo':
      if(view.confirm!==key){view.confirm=key;render();break;}
      view.confirm=null;L=S.leaves[b.dataset.id];if(!L)break;
      if(L.status==='approved')unapplyLeave(L);delete S.leaves[b.dataset.id];markDirty();render();toast('Đã huỷ ghi nhận nghỉ của '+L.name+'. Các ca bị gỡ trước đó không tự thêm lại; bấm Tự xếp nếu cần.',7000);break;
    case 'lvkind':view.lv.kind=b.dataset.v;render();break;
    case 'lvadd':addLeave();break;
    case 'mgrback':mgrBack();break;
    case 'mgrrefresh':loadMgr();break;
    case 'mgrview':view.tab='week';openSite(b.dataset.id,false);break;
    case 'demo':enterDemo();break;
    case 'mgrxlsx':exportMgr();break;
    case 'mkmonth':var nm=new Date(),fm=new Date(nm.getFullYear(),nm.getMonth()+(+b.dataset.v),1),lm=new Date(fm.getFullYear(),fm.getMonth()+1,0);view.mkp={from:keyOf(fm),to:keyOf(lm)};render();break;
    case 'msedit':MGR.edit=clone(SITES);if(!MGR.edit.length)MGR.edit=[{key:'s'+rid().slice(0,6),name:''}];render();break;
    case 'mscancel':MGR.edit=null;render();break;
    case 'msadd':MGR.edit.push({key:'s'+rid().slice(0,6),name:''});render();var lastIn=document.getElementById('ms-'+(MGR.edit.length-1));if(lastIn)lastIn.focus();break;
    case 'msdel':MGR.edit.splice(+b.dataset.v,1);render();break;
    case 'mssave':
      var cleaned=MGR.edit.filter(function(x){return String(x.name).trim();}).map(function(x){return {key:x.key,name:String(x.name).trim()};});
      DB.doc('cfg/sites').set({sites:cleaned}).then(function(){SITES=cleaned;MGR.edit=null;render();toast('Đã lưu danh sách '+cleaned.length+' site.');},function(e){toast(dbErrMsg(e),7000);});break;
    case 'obstart':
      var so=document.getElementById('ob-site'),no=document.getElementById('ob-name');
      if(so){if(!so.value){toast('Chọn site của bạn.');break;}var pick=SITES.filter(function(x){return x.key===so.value;})[0];createSite(pick?pick.name:'',so.value);}
      else{var nmv=no&&no.value.trim();if(!nmv){toast('Nhập tên site.');break;}createSite(nmv,'');}
      break;
    case 'payweek':view.pay.from=view.week;view.pay.to=addDays(view.week,6);render();break;
    case 'paymonth':
      var now=new Date(),first=new Date(now.getFullYear(),now.getMonth()+(+b.dataset.v),1),last=new Date(first.getFullYear(),first.getMonth()+1,0);
      view.pay.from=keyOf(first);view.pay.to=keyOf(last);render();break;
    case 'paycopy':openModal('Bảng giờ công PT','Sao chép rồi dán vào Excel hoặc Google Sheets.',toTsv(payAoa(payroll(view.pay.from,view.pay.to).pt)),'Đã sao chép bảng PT.');break;
    case 'payft':openModal('Bảng ngày công FT','Sao chép rồi dán vào Excel hoặc Google Sheets.',toTsv(ftAoa(payroll(view.pay.from,view.pay.to).ft)),'Đã sao chép bảng FT.');break;
    case 'paydetail':openModal('Chi tiết giờ công PT theo ngày','Mỗi dòng là một ca đã xếp. Sao chép rồi dán vào Excel hoặc Google Sheets.',toTsv(detailAoa(payroll(view.pay.from,view.pay.to).pt)),'Đã sao chép chi tiết theo ngày.');break;
    case 'payxlsx':exportPay();break;
    case 'legacyload':loadLegacy();break;
    case 'misaweek':exportMisa(view.week,addDays(view.week,6));break;
    case 'misaxlsx':exportMisa(view.pay.from,view.pay.to);break;
  }
});
$app.addEventListener('input',function(e){
  var t=e.target,ds=t.dataset||{},f=ds.f,s,v;
  if(ds.lv){view.lv[ds.lv]=t.value;return;}
  if(ds.mkp){view.mkp[ds.mkp]=t.value;return;}
  if(ds.ms!=null&&MGR.edit){MGR.edit[+ds.ms].name=t.value;return;}
  if(ds.pay){view.pay[ds.pay]=t.value;return;}
  if(ds.kp){view.kp[ds.kp]=t.value;return;}
  if(ds.sw){view.sw[ds.sw]=t.value;return;}
  if(!f)return;
  if(f==='site'){S.site=t.value;}
  else if(f==='kpitarget'){v=parseFloat(t.value);if(!(v>0&&v<=100))return;S.kpiTarget=v;}
  else if(f==='sname'){s=staffById(ds.id);if(s)s.name=t.value;}
  else if(f==='scode'){s=staffById(ds.id);if(s)s.code=t.value.trim();}
  else if(f==='smax'){if(t.value==='')return;s=staffById(ds.id);v=Math.max(0,parseInt(t.value,10)||0);if(s)s.max=v;}
  else if(f==='srate'){
    s=staffById(ds.id);if(!s)return;s.rate=parseInt(String(t.value).replace(/[^\d]/g,''),10)||0;
    var tr=t.closest('tr[data-row]');
    if(tr){var mc=$app.querySelector('[data-money="'+ds.id+'"]');if(mc)mc.textContent=fmtVND(+tr.dataset.hours*s.rate);
      var tot=0,trs=$app.querySelectorAll('tr[data-row]');for(var i=0;i<trs.length;i++){var st2=staffById(trs[i].dataset.row);tot+=(+trs[i].dataset.hours)*((st2&&st2.rate)||0);}
      var tt=$app.querySelectorAll('[data-moneytotal]');for(var j=0;j<tt.length;j++)tt[j].textContent=fmtVND(tot);}
  }
  else if(f==='dem'){
    v=Math.max(0,Math.min(30,parseInt(t.value,10)||0));var d=+ds.d;
    var row=S.demand[d]||(S.demand[d]={}),cell=row[ds.sh]||(row[ds.sh]={});cell[ds.p]=v;
    var tots=$app.querySelectorAll('[data-tot]');for(var x=0;x<tots.length;x++){var a=tots[x].dataset.tot.split(':');tots[x].textContent=demTotal(+a[0],a[1]);}
  }
  else if(f==='shcode'){s=shift(ds.id);if(!s)return;v=t.value.trim();s.misa=v;if(v)s.name=v;var ms2=document.getElementById('misa-status');if(ms2)ms2.innerHTML=misaStatus();}
  else if(f==='shname'){s=shift(ds.id);if(s)s.name=t.value;}
  else if(f==='shtime'){s=shift(ds.id);if(s){var old=parseHours(s.time);s.time=t.value;var nh=parseHours(t.value);if(nh&&(s.hours===old||!s.hours||old==null)){s.hours=nh;var hi=document.getElementById('shhours-'+s.id);if(hi)hi.value=fmtH(nh);}}}
  else if(f==='shhours'){s=shift(ds.id);v=parseFloat(String(t.value).replace(',','.'));if(s&&!isNaN(v))s.hours=v;}
  else if(f==='fullhours'){v=parseFloat(String(t.value).replace(',','.'));if(!isNaN(v))S.fullHours=v;}
  else if(f==='shmisa'||f==='misafull'||f==='misaoff'||f==='misaleave'){if(f==='shmisa'){s=shift(ds.id);if(!s)return;s.misa=t.value;}else S.misa[f.slice(4)]=t.value;var mst=document.getElementById('misa-status');if(mst)mst.innerHTML=misaStatus();}
  else if(f==='pname'||f==='pshort'){var p=pos(ds.id);if(p){if(f==='pname')p.name=t.value;else p.short=t.value;}}
  else return;
  markDirty();
});
$app.addEventListener('change',function(e){
  var t=e.target,ds=t.dataset||{};
  if(t.id==='reg-file'){readRegFile(t.files&&t.files[0]);t.value='';return;}
  if(ds.f==='srole'){var s=staffById(ds.id);if(s){s.role=t.value;markDirty();render();}}
  else if(ds.f==='phold'){var ph=pos(ds.id);if(ph){ph.hold=!!t.checked;markDirty();render();toast(ph.name+(ph.hold?': Tự xếp lấp vị trí này trước, không tách ca.':': Tự xếp chia ca như các vị trí khác.'),6000);}}
  else if(ds.f==='shp'){var s3=staffById(ds.id);if(s3){if(t.value)s3.hp=t.value;else delete s3.hp;markDirty();render();}}
  else if(ds.f==='smain'){var s2=staffById(ds.id);if(s2&&s2.skills.indexOf(t.value)>=0){s2.skills=[t.value].concat(s2.skills.filter(function(x){return x!==t.value;}));markDirty();render();}}
  else if(ds.lv&&ds.lv!=='reason'){view.lv[ds.lv]=t.value;render();}
  else if(ds.mkp){view.mkp[ds.mkp]=t.value;render();}
  else if(ds.pay){view.pay[ds.pay]=t.value;render();}
  else if(ds.kp){view.kp[ds.kp]=t.value;render();}
  else if(ds.kpinc){view.kp.inc=t.checked;render();}
  else if(ds.f==='kpitarget'){render();}
  else if(ds.sw&&ds.sw!=='reason'){view.sw[ds.sw]=t.value;if(ds.sw==='date'){view.sw.a='';view.sw.b='';view.sw.date2=t.value;}else if(ds.sw==='a'){view.sw.b='';}render();}
  else if(ds.f==='scode'){render();}
});
$app.addEventListener('submit',function(e){
  var form=e.target;e.preventDefault();
  if(form.dataset.form!=='addstaff')return;
  var inp=document.getElementById('newstaff'),ci=document.getElementById('newcode'),name=(inp.value||'').trim(),code=(ci.value||'').trim();
  if(!name){toast('Nhập họ tên nhân viên trước khi thêm.');inp.focus();return;}
  if(code&&staffByCode(code)){toast('Mã '+code+' đã có trong danh sách.');ci.focus();return;}
  var nr=(document.getElementById('newrole')||{}).value==='FT'?'FT':'PT';
  var sd=(document.getElementById('newstart')||{}).value||todayKey();
  S.staff.push({id:'n'+rid(),code:code,name:name,role:nr,skills:[],max:nr==='FT'?6:5,off:[],rate:0,start:sd});
  markDirty();render();toast('Đã thêm '+name+'. Chọn vị trí đã đào tạo để tự xếp dùng được người này.');
  var n2=document.getElementById('newcode');if(n2)n2.focus();
});

/* ---------- khởi động ---------- */
boot();
})();
</script>
