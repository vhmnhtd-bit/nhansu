<html lang="vi">
<head>
<meta charset="utf-8">

<title>Quản lý nhân sự Miền Nam</title>

<style id="app-css">
/* Layout: bảng ca — cột tên cố định, 7 cột ngày, chân bảng đối chiếu định biên theo đúng cột ngày */
:root{
  --ground:#EDF0F4;--sheet:#FFFFFF;--ink:#131A23;--muted:#586375;--faint:#8D97A6;--line:#D5DBE3;--line-2:#E8ECF1;
  --accent:#2446C7;--accent-ink:#FFFFFF;--accent-soft:#E2E8FC;
  --short:#C42B37;--short-soft:#FCE3E5;--ok:#1C7548;--ok-soft:#DDF1E5;--over:#8A5E00;--over-soft:#FAEFCF;
  --hatch:#E2E6EC;--scrim:rgba(19,26,35,.38);--shadow:0 12px 32px rgba(19,26,35,.16);
  --p0-bg:#FCEDC2;--p0-ink:#6B4800;--p1-bg:#DCE6FF;--p1-ink:#1D3CA3;--p2-bg:#F8DCEF;--p2-ink:#861D67;
  --p3-bg:#D3F0EA;--p3-ink:#0E5E54;--p4-bg:#E7E0FB;--p4-ink:#4C33A0;--p5-bg:#FDE1D0;--p5-ink:#8A380C;--p6-bg:#E3EFC8;--p6-ink:#3D5A0A;--p7-bg:#D6EDF6;--p7-ink:#0B5270;--k0:#E09A00;--k1:#3B5BDB;--k2:#9C36B5;--k3:#0C8599;--k4:#E8590C;--k5:#2F9E44;--k6:#C2255C;--k7:#5C7080;
  --f-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --ground:#0E131A;--sheet:#161D26;--ink:#E6EBF1;--muted:#9AA5B5;--faint:#6B7686;--line:#2B3441;--line-2:#212934;
  --accent:#7D95FF;--accent-ink:#0E131A;--accent-soft:#1E2950;
  --short:#FF7B85;--short-soft:#3A1B21;--ok:#5ED39A;--ok-soft:#14301F;--over:#E9BA4E;--over-soft:#33290E;
  --hatch:#1E252F;--scrim:rgba(0,0,0,.55);--shadow:0 12px 32px rgba(0,0,0,.5);
  --p0-bg:#3A2D0C;--p0-ink:#F4C85A;--p1-bg:#1B2851;--p1-ink:#AABFFF;--p2-bg:#3E1834;--p2-ink:#F2A7DB;
  --p3-bg:#0F322D;--p3-ink:#80DBCB;--p4-bg:#2A2150;--p4-ink:#C6B6FF;--p5-bg:#3D2011;--p5-ink:#FFB58D;--p6-bg:#25330D;--p6-ink:#BFE07A;--p7-bg:#0E2B38;--p7-ink:#86D3F0;--k0:#FFC53D;--k1:#8EA2FF;--k2:#D69CF0;--k3:#4FD1E0;--k4:#FF9A5C;--k5:#69DB7C;--k6:#F783AC;--k7:#A5B4C3;}}
:root[data-theme="dark"]{color-scheme:dark;
  --ground:#0E131A;--sheet:#161D26;--ink:#E6EBF1;--muted:#9AA5B5;--faint:#6B7686;--line:#2B3441;--line-2:#212934;
  --accent:#7D95FF;--accent-ink:#0E131A;--accent-soft:#1E2950;
  --short:#FF7B85;--short-soft:#3A1B21;--ok:#5ED39A;--ok-soft:#14301F;--over:#E9BA4E;--over-soft:#33290E;
  --hatch:#1E252F;--scrim:rgba(0,0,0,.55);--shadow:0 12px 32px rgba(0,0,0,.5);
  --p0-bg:#3A2D0C;--p0-ink:#F4C85A;--p1-bg:#1B2851;--p1-ink:#AABFFF;--p2-bg:#3E1834;--p2-ink:#F2A7DB;
  --p3-bg:#0F322D;--p3-ink:#80DBCB;--p4-bg:#2A2150;--p4-ink:#C6B6FF;--p5-bg:#3D2011;--p5-ink:#FFB58D;--p6-bg:#25330D;--p6-ink:#BFE07A;--p7-bg:#0E2B38;--p7-ink:#86D3F0;--k0:#FFC53D;--k1:#8EA2FF;--k2:#D69CF0;--k3:#4FD1E0;--k4:#FF9A5C;--k5:#69DB7C;--k6:#F783AC;--k7:#A5B4C3;}

body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:22px 90px;display:flex;flex-direction:column;gap:18px}
.wrap.wide{max-width:1880px;padding-inline:24px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.sm{font-size:12.5px}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--accent)}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:30px;font-weight:700;letter-spacing:-.015em;line-height:1.1}
.weeknav{display:flex;align-items:center;gap:8px}
.wk{display:flex;flex-direction:column;align-items:center;min-width:132px}
.wk b{font-family:var(--f-display);font-size:18px}
.wk span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.savebox{display:flex;align-items:center;gap:10px;min-height:38px}
.st{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.st i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.st.ok i{background:var(--ok)}.st.warn{color:var(--over)}.st.warn i{background:var(--over)}

.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:500;font-size:13.5px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--short)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.icon{width:36px;height:36px;padding:0;font-size:20px;line-height:1}
.btn[disabled]{opacity:.6;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:inherit}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.count{font-family:var(--f-mono);font-size:11px;background:var(--line-2);border-radius:999px;padding:1px 6px;margin-left:4px;color:var(--muted);font-weight:500}
.count.hot{background:var(--short);color:var(--sheet)}

.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;background:var(--accent-soft);border-radius:10px;padding:11px 14px;font-size:13.5px}
.banner.warn{background:var(--over-soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.summary{display:flex;flex-wrap:wrap;align-items:flex-end;gap:18px 28px}
.fill{min-width:220px;display:flex;flex-direction:column;gap:6px}
.big{font-family:var(--f-display);font-variant-numeric:tabular-nums;line-height:1}
.big b{font-size:40px;font-weight:700}.big span{font-size:22px;color:var(--muted);font-weight:600}
.lbl{font-size:12.5px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.full i{background:var(--ok)}
.kpis{display:flex;flex-wrap:wrap;gap:22px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.is-short b{color:var(--short)}.kpi.is-ok b{color:var(--ok)}.kpi.is-over b{color:var(--over)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}

.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend .lg{display:inline-flex;align-items:center;gap:5px}
.sw{display:inline-block;width:18px;height:12px;border-radius:3px;border:1px solid var(--line)}
.sw.na{background:repeating-linear-gradient(135deg,var(--hatch) 0 4px,var(--sheet) 4px 8px)}
.sw.bad{box-shadow:inset 0 0 0 2px var(--short);border:0}

.gridwrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--line);border-radius:12px}
table.roster{border-collapse:separate;border-spacing:0;width:100%;min-width:980px}
.roster th,.roster td{border-top:1px solid var(--line-2);vertical-align:top}
.roster thead th{border-top:0}
.roster td{padding:4px;border-left:1px solid var(--line-2)}
.roster th.name{position:sticky;left:0;z-index:2;background:var(--sheet);text-align:left;width:196px;padding:9px 12px;font-weight:500;border-right:1px solid var(--line)}
.roster thead th.name{font-size:12px;color:var(--muted);font-weight:600;vertical-align:bottom}
.roster thead th.name small{display:block;font-weight:400}
.dh{padding:9px 8px;text-align:left;border-left:1px solid var(--line-2);font-weight:400}
.dh b{font-family:var(--f-display);font-size:17px;display:block;line-height:1.1}
.dh span{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.dh em{display:block;font-style:normal;font-size:11px;font-weight:600;margin-top:3px}
.dh .dshort{color:var(--short)}.dh .dok{color:var(--ok)}
.dh.today b{color:var(--accent)}
.dh.today{box-shadow:inset 0 3px 0 var(--accent)}
.nm{font-weight:600;font-size:14px;line-height:1.25}
.meta{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);margin-top:3px}
.role{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
.code{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:500}
.ld{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ld.over{color:var(--short);font-weight:600}
.meter{flex:1;height:4px;background:var(--line-2);border-radius:9px;overflow:hidden;min-width:24px}
.meter i{display:block;height:100%;background:var(--faint)}
.meter.over i{background:var(--short)}

.cell{width:100%;min-height:56px;border:1px solid transparent;border-radius:8px;background:transparent;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;padding:6px 7px;text-align:left;cursor:pointer}
.cell:hover{border-color:var(--line);background:var(--ground)}
.cell.sel{border-color:var(--accent);background:var(--accent-soft)}
.cell.empty{align-items:center}
.cell .plus{color:var(--faint);font-size:18px;line-height:1}
.cell.na{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px)}
.cell.bad{box-shadow:inset 0 0 0 2px var(--short)}
.cell.off .sh{color:var(--muted)}
.sh{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:500}
.cell.empty .sh{font-size:10px;text-align:center}
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.35;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.none{background:var(--short-soft);color:var(--short)}
.pc0{background:var(--p0-bg);color:var(--p0-ink)}.pc1{background:var(--p1-bg);color:var(--p1-ink)}.pc2{background:var(--p2-bg);color:var(--p2-ink)}
.pc3{background:var(--p3-bg);color:var(--p3-ink)}.pc6{background:var(--p6-bg);color:var(--p6-ink)}.pc7{background:var(--p7-bg);color:var(--p7-ink)}.pc4{background:var(--p4-bg);color:var(--p4-ink)}.pc5{background:var(--p5-bg);color:var(--p5-ink)}
.emptyrow{padding:28px 16px!important;text-align:center;color:var(--muted)}

.roster tfoot th,.roster tfoot td{background:var(--ground)}
.roster tfoot tr:first-child th,.roster tfoot tr:first-child td{border-top:2px solid var(--line)}
.roster tfoot th.name{background:var(--ground)}
.roster tfoot td{padding:7px 6px}
.cvs{display:flex;flex-wrap:wrap;gap:3px}
.cv{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:11px;padding:1px 5px;border-radius:4px;white-space:nowrap}
.cv.short{background:var(--short-soft);color:var(--short);font-weight:600}
.cv.ok{background:var(--ok-soft);color:var(--ok)}
.cv.over{background:var(--over-soft);color:var(--over)}
.cv.none{color:var(--faint)}
.hint{font-size:12.5px;color:var(--muted)}

.issues.gaps ul{columns:1}
.issues{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.issues h3{font-size:15px;margin-bottom:6px}
.issues ul{margin:0;padding-left:18px;columns:2 300px;column-gap:28px;font-size:13px}
.issues li{break-inside:avoid;margin-bottom:3px}

.panel{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-h{display:flex;flex-direction:column;gap:4px}
.panel-h.split{flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 16px}
.panel-h h2{font-size:19px}
.panel-h p{color:var(--muted);font-size:13px;max-width:68ch}
.tblwrap{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:middle}
.tbl thead th{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.tbl .n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tbl tfoot td,.tbl tfoot th{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.tbl.staff{min-width:1120px}
.tbl.staff .stk-l{position:sticky;left:0;z-index:1;background:var(--sheet);min-width:200px;box-shadow:inset -1px 0 0 var(--line-2)}
.tbl.staff .stk-r{position:sticky;right:0;z-index:1;background:var(--sheet);box-shadow:inset 1px 0 0 var(--line-2)}
.who{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.who .in{width:100%}
.acts{display:flex;flex-direction:column;gap:4px}
.tbl.staff select.role-sel{width:70px}
.tbl.dem{min-width:640px}
.tbl.pay{min-width:860px}
.tbl.dem td{text-align:center}
.tbl.dem tr.grp th{background:var(--ground);font-family:var(--f-display);font-size:14px;padding-top:10px}
.tbl.dem tr.grp th span{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-weight:400;margin-left:6px}
.tbl.dem tr.tot th,.tbl.dem tr.tot td{font-weight:600;font-family:var(--f-mono);font-size:12.5px}
.tbl.dem tr.tot th{font-family:var(--f-body);color:var(--muted);font-weight:500}
.in{font:inherit;font-size:13.5px;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%;min-width:0}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.in.num{width:64px;text-align:center}
.in.short{width:72px}
.in.codein{width:128px;font-family:var(--f-mono);font-size:12.5px}
.in.rate{width:96px;text-align:right;font-family:var(--f-mono)}
.in.dup{border-color:var(--short)}
.tags,.days{display:flex;flex-wrap:wrap;gap:4px}
.skill{border:1px dashed var(--line);background:transparent;color:var(--faint);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;cursor:pointer}
.skill.on{border:1px solid transparent}
.dtog{width:32px;height:28px;border:1px solid var(--line);background:transparent;border-radius:6px;font-size:11.5px;font-family:var(--f-mono);cursor:pointer;color:var(--muted)}
.dtog.on{background:repeating-linear-gradient(135deg,var(--hatch) 0 4px,var(--sheet) 4px 8px);color:var(--short);border-color:var(--short);font-weight:600}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow .in{max-width:300px}
.addrow .in.codein{max-width:110px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;align-items:start}
.frow{display:grid;grid-template-columns:1fr 1.2fr 84px 96px;gap:8px;align-items:center}
.frow.pos{grid-template-columns:auto 1fr 80px auto}
.fixbox{display:flex;flex-direction:column;gap:3px;margin-top:6px}.skill.fixon{background:var(--accent-soft);color:var(--accent);border:1px solid transparent}
.mcode{display:flex;align-items:center;min-width:0}.mcode .in{flex:1;min-width:0}
@media (max-width:520px){#ca-panel .frow{grid-template-columns:1fr 1.1fr 58px}#ca-panel .frow .in.num{width:100%}#ca-panel .frow.head span{white-space:nowrap}}
.ok-t{color:var(--ok);font-weight:600}
@media (max-width:520px){.frow.misa{grid-template-columns:1fr 130px}.frow.misa>span:nth-child(2){display:none}}
.frow.head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.flist{display:flex;flex-direction:column;gap:8px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.fl small{font-weight:400}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.formgrid .wide{grid-column:1/-1}

.srcline{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px}
.srcline b{color:var(--ink);font-weight:600}
.reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.req{border:1px solid var(--line);border-radius:10px;padding:12px 13px;display:flex;flex-direction:column;gap:7px;background:var(--sheet)}
.req-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.req-h b{font-size:14.5px}
.req-d{font-size:13px}
.req-r{font-size:13px;color:var(--muted)}
.req-w{font-size:12.5px;color:var(--short);background:var(--short-soft);border-radius:7px;padding:6px 8px;display:flex;flex-direction:column;gap:5px}
.req-w.soft{color:var(--over);background:var(--over-soft)}
.req-by{font-size:12px;color:var(--muted)}
.src{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:2px 6px;white-space:nowrap;background:var(--line-2);color:var(--muted)}
.src.form{background:var(--p3-bg);color:var(--p3-ink)}
.src.link{background:var(--p4-bg);color:var(--p4-ink)}
.pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap;background:var(--line-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.no{background:var(--short-soft);color:var(--short)}.pill.wait{background:var(--over-soft);color:var(--over)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.way{display:flex;flex-direction:column;gap:9px;padding-top:12px;border-top:1px solid var(--line-2)}
.way:first-of-type{border-top:0;padding-top:0}
.way h3{font-size:15px}
.mine{display:flex;flex-direction:column;gap:6px}
.mrow,.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13px;padding:7px 0;border-top:1px solid var(--line-2)}
.mrow .grow,.hrow .grow{flex:1;min-width:160px}
.guide{font-size:13px;border:1px solid var(--line-2);border-radius:8px;padding:9px 12px}
.guide summary{cursor:pointer;font-weight:600}
.guide ol{margin:8px 0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.payctl{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px}
.payctl .fl{width:160px}

.swp{font-size:10px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.rcell{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);cursor:pointer;font-size:12.5px;font-weight:600}
.rcell.r-A{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.rcell.r-S,.rcell.r-C{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.rcell.r-N{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px);color:var(--faint)}
.rcell.implied{opacity:.55;border-style:dashed;border-color:var(--line)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kcard{border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.kcard b{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.kcard span{font-size:12px;color:var(--muted)}
.kcard.good b{color:var(--ok)}.kcard.bad b{color:var(--short)}.kcard.warn b{color:var(--over)}
.filebox{display:flex;align-items:center;justify-content:center;border:2px dashed var(--line);border-radius:10px;padding:26px 16px;cursor:pointer;color:var(--muted);font-weight:600;text-align:center;position:relative}
.filebox:hover{border-color:var(--accent);color:var(--accent)}
.filebox input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.xsec{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line-2);border-radius:10px}
.xsec input[type=checkbox]{margin-top:4px}
.xsec .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.xsec.off{opacity:.55}
.chk-inline{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
h3.sub{font-size:15px;margin-bottom:8px}
.t-short{color:var(--short);font-weight:600}
.kd{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;flex:none;vertical-align:baseline}
.kd.k0{background:var(--k0)}.kd.k1{background:var(--k1)}.kd.k2{background:var(--k2)}.kd.k3{background:var(--k3)}.kd.k4{background:var(--k4)}.kd.k5{background:var(--k5)}.kd.k6{background:var(--k6)}.kd.k7{background:var(--k7)}
.kd.kall{background:linear-gradient(135deg,var(--k0) 0 50%,var(--k1) 50% 100%)}
.shn{display:inline-flex;align-items:center;font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.2}
.sht{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);line-height:1.15}
.cell .cl1{display:flex;flex-direction:column;gap:1px}
.cell .chip{font-size:12.5px;padding:3px 9px}
.cell.kc0{border-left:4px solid var(--k0)}.cell.kc1{border-left:4px solid var(--k1)}.cell.kc2{border-left:4px solid var(--k2)}.cell.kc3{border-left:4px solid var(--k3)}
.cell.kc4{border-left:4px solid var(--k4)}.cell.kc5{border-left:4px solid var(--k5)}.cell.kc6{border-left:4px solid var(--k6)}.cell.kc7{border-left:4px solid var(--k7)}
.cell.kcall{border-left:4px solid var(--ink)}
.cell.pf0{background:var(--p0-bg)}.cell.pf0:hover{background:var(--p0-bg);filter:brightness(.97)}
.cell.pf1{background:var(--p1-bg)}.cell.pf1:hover{background:var(--p1-bg);filter:brightness(.97)}
.cell.pf2{background:var(--p2-bg)}.cell.pf2:hover{background:var(--p2-bg);filter:brightness(.97)}
.cell.pf3{background:var(--p3-bg)}.cell.pf3:hover{background:var(--p3-bg);filter:brightness(.97)}
.cell.pf4{background:var(--p4-bg)}.cell.pf4:hover{background:var(--p4-bg);filter:brightness(.97)}
.cell.pf5{background:var(--p5-bg)}.cell.pf5:hover{background:var(--p5-bg);filter:brightness(.97)}
.cell.pf6{background:var(--p6-bg)}.cell.pf6:hover{background:var(--p6-bg);filter:brightness(.97)}
.cell.pf7{background:var(--p7-bg)}.cell.pf7:hover{background:var(--p7-bg);filter:brightness(.97)}
.cell[class*=" pf"] .chip{box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.lg-sep{width:1px;height:16px;background:var(--line)}
.steps{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.steps-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.step{display:flex;gap:9px;align-items:flex-start;text-align:left;border:1px solid var(--line-2);background:var(--ground);border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink)}
.step:hover{border-color:var(--faint)}
.step .sn{flex:none;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;background:var(--line);color:var(--muted)}
.step .st2{display:flex;flex-direction:column;gap:1px;min-width:0}
.step .st2 b{font-size:13px}.step .st2 small{font-size:11.5px;color:var(--muted)}
.step.done .sn{background:var(--ok);color:var(--sheet)}
.step.cur{border-color:var(--accent);background:var(--accent-soft)}.step.cur .sn{background:var(--accent);color:var(--accent-ink)}
.steps.compact{padding:8px 10px}
.steps.compact .steps-row,.steps.compact .step{display:flex}
.steps.compact .steps-row{flex-wrap:wrap;gap:6px}
.steps.compact .step{padding:4px 10px 4px 5px;border-radius:999px;align-items:center}
.steps.compact .step .sn{width:18px;height:18px;font-size:11px}
.steps.compact .step small{display:none}
.steps.compact .step .st2 b{font-size:12.5px;font-weight:600}
@media (max-width:640px){.steps .steps-row{display:flex;flex-wrap:wrap;gap:6px}.steps .step{padding:4px 10px 4px 5px;border-radius:999px;align-items:center}.steps .step .sn{width:18px;height:18px;font-size:11px}.steps .step small{display:none}.steps .step.cur small{display:block}.steps .step .st2 b{font-size:12.5px}}
.onboard{max-width:600px;margin:40px auto 0;width:100%}
.onboard h1{font-size:26px}
.tbl.mgr{min-width:1000px}
[hidden]{display:none!important}
#pop{position:fixed;z-index:40;width:340px;max-width:calc(100vw - 24px);background:var(--sheet);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:9px}
.pop-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pop-h b{display:block;font-size:15px}
.pop-h span{font-size:12.5px;color:var(--muted)}
.x{background:none;border:0;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:0 4px}
.pop-lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pop-warn{font-size:12.5px;color:var(--short);background:var(--short-soft);padding:6px 9px;border-radius:7px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.opt small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);font-weight:400}
.opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.posopts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.popt{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:7px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left}
.popt small{font-size:11px;color:var(--muted)}
.popt small.need{color:var(--short);font-weight:600}
.popt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.popt.untrained{opacity:.6}

.modal{position:fixed;inset:0;background:var(--scrim);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{background:var(--sheet);border-radius:14px;padding:18px;width:min(580px,100%);max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.modal-card.wide{width:min(900px,100%)}
.modal-card p{color:var(--muted);font-size:13px}
.modal-card textarea{width:100%;height:300px;font-family:var(--f-mono);font-size:12px;line-height:1.5;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--ground);color:var(--ink);resize:vertical}
.modal-card .isec textarea{height:140px}
.modal-card .mnote{color:var(--over)}
.isec{display:flex;flex-direction:column;gap:9px;padding:12px;border:1px solid var(--line-2);border-radius:10px}
.igrid{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
p.ierr{color:var(--short);font-size:13px}
.ipv .tbl{min-width:760px;font-size:12.5px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.chk input{margin-top:3px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--sheet);padding:10px 15px;border-radius:10px;font-size:13.5px;max-width:min(560px,calc(100% - 32px));box-shadow:var(--shadow)}
@media (max-width:600px){
  #pop{left:0!important;right:0;top:auto!important;bottom:0;width:auto;max-width:none;border-radius:16px 16px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  h1{font-size:25px}
  .wrap{padding-inline:16px}
  .actions{margin-left:0}
  .weeknav{width:100%;justify-content:space-between}
  .igrid{grid-template-columns:1fr}
  .payctl .fl{width:100%}
  .roster th.name{width:118px;padding:8px}
  .roster .meter,.roster .role{display:none}
  .roster .meta{flex-wrap:wrap;gap:2px 6px}
  .nm{font-size:13px}
  table.roster{min-width:860px}
}
@media (prefers-reduced-motion:no-preference){.cell,.btn,.opt,.popt{transition:background-color .12s,border-color .12s}}
/* ---------- web nhân sự: menu chính, biểu đồ, hồ sơ ---------- */
.mnav{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;border-bottom:1px solid var(--line);padding-bottom:10px}
.mnav .brand{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.mnav .brand b{font-family:var(--f-display);font-size:17px}
.mnav .brand span{font-size:12px;color:var(--muted)}
.mlinks{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;max-width:100%;padding-bottom:2px}
.mlink{background:none;border:1px solid transparent;border-radius:8px;padding:7px 11px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;font-size:13.5px}
.mlink:hover{background:var(--sheet);border-color:var(--line)}
.mlink.on{background:var(--accent-soft);color:var(--accent)}
.soon{font-size:10.5px;font-weight:600;background:var(--over-soft);color:var(--over);border-radius:999px;padding:1px 6px;margin-left:3px}
.hrtop{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.hrtop h1{font-size:26px}
.hrctl{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px}
.hrctl .fl{width:150px}
.hrctl .fl.wide{width:230px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
.brows{display:flex;flex-direction:column;gap:7px}
.brow{display:grid;grid-template-columns:minmax(110px,190px) 1fr 70px;gap:10px;align-items:center;font-size:13px}
.brow .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btrk{height:12px;background:var(--line-2);border-radius:6px;overflow:hidden}
.bfill{height:100%;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.bval{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;font-size:12.5px}
.stk{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;background:var(--line-2)}
.stk i{display:block;height:100%}
.sw-ft{background:var(--k1)}.sw-pt{background:var(--k0)}.sw-in{background:var(--ok)}.sw-out{background:var(--short)}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--line-2);stroke-width:1}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-mono)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.chart .ar{fill:var(--accent-soft)}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:var(--line-2);opacity:.55}
.chart .bin{fill:var(--ok)}.chart .bout{fill:var(--short)}
.chart text.vl{fill:var(--ink);font-weight:500}
.kv{display:grid;grid-template-columns:160px 1fr;gap:7px 14px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.fgrid .fl.span2{grid-column:span 2}
.tbl.hr{min-width:820px}
.tbl.cal{min-width:620px}
.tbl.cal td,.tbl.cal th{text-align:center;font-size:12px}
.tbl.cal td.off{color:var(--faint)}
.soonbox{border:1px dashed var(--line);border-radius:10px;padding:16px;background:var(--ground);display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.soonbox ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.ptitle{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.ptitle h1{font-size:26px}
.t-ok{color:var(--ok)}
@media (max-width:600px){.brow{grid-template-columns:96px 1fr 52px}.kv{grid-template-columns:1fr}.kv dt{margin-top:4px}.hrctl .fl,.hrctl .fl.wide{width:100%}.fgrid .fl.span2{grid-column:auto}.g2{grid-template-columns:1fr}}
/* ---------- chấm điểm, diện theo dõi ---------- */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--sheet);padding:6px 11px;font-size:12.5px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.d.on{background:var(--ok-soft);color:var(--ok)}
.seg button.n.on{background:var(--over-soft);color:var(--over)}
.seg button.x.on{background:var(--short-soft);color:var(--short)}
.seg button[disabled]{cursor:default}
.scg{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:10px}
.scgh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-bottom:4px}
.scgh h3{margin:0;flex:1}
.scitem{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.scitem .in{grid-column:1/-1}
.in.need{border-color:var(--short);background:var(--short-soft)}
.liet{border:1px solid var(--short);background:var(--short-soft);border-radius:10px;padding:10px 12px;margin-top:8px;display:flex;flex-direction:column;gap:8px}
.liet .in{background:var(--sheet)}
.scbig{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.scbig span:first-child{font-size:12px;color:var(--muted)}
.scbig b{font-family:var(--f-display);font-size:32px;line-height:1}
.stepc{border-left:4px solid var(--line)}
.stepc.done{border-left-color:var(--ok)}
.stepc.cur{border-left-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.stepc.lock{opacity:.7}
tr.void td{color:var(--faint);text-decoration:line-through}
tr.void td .pill{text-decoration:none}
tr.sumrow td{border-bottom:2px solid var(--line)}
.count.hot{background:var(--short);color:var(--sheet)}
@media (max-width:600px){.scitem{grid-template-columns:1fr}.scbig{align-items:flex-start}.seg button{padding:7px 9px}}
.sm-only{display:none}
@media (max-width:600px){.tbl.scw{min-width:0}.tbl .hm{display:none}.sm-only{display:block}}
.seg.pts{flex-wrap:wrap}
.seg.pts button{min-width:30px;padding:6px 0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
@media (max-width:600px){.seg.pts button{min-width:28px}}
.sx-prev{max-height:58vh;overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff;min-height:80px;display:flex;align-items:flex-start;justify-content:center}
.sx-prev img{width:100%;display:block}
/* thứ tự ưu tiên vị trí, ưu tiên nhận ca */
.skr{display:inline-flex;align-items:center;gap:2px}
.skup{border:1px solid var(--line);background:var(--sheet);border-radius:999px;width:22px;height:22px;padding:0;font-size:12px;line-height:1;cursor:pointer;color:var(--muted)}
.skup:hover{color:var(--accent);border-color:var(--accent)}
.hpsel{display:flex;flex-direction:column;gap:2px;margin-top:6px;font-size:11.5px;color:var(--muted);font-weight:600}
/* chip vị trí đã đào tạo: hiện đúng màu vị trí */
.skill.on.pc0{background:var(--p0-bg);color:var(--p0-ink)}
.skill.on.pc1{background:var(--p1-bg);color:var(--p1-ink)}
.skill.on.pc2{background:var(--p2-bg);color:var(--p2-ink)}
.skill.on.pc3{background:var(--p3-bg);color:var(--p3-ink)}
.skill.on.pc4{background:var(--p4-bg);color:var(--p4-ink)}
.skill.on.pc5{background:var(--p5-bg);color:var(--p5-ink)}
.skill.on.pc6{background:var(--p6-bg);color:var(--p6-ink)}
.skill.on.pc7{background:var(--p7-bg);color:var(--p7-ink)}
/* công thêm */
.otthumb{position:relative;display:inline-block}
.otthumb img{width:88px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.otthumb .skup{position:absolute;top:-6px;right:-6px;background:var(--sheet)}
/* menu phụ của nhóm, phần thu gọn */
.mnav{border-bottom:0;padding-bottom:0}
.subnav{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;margin-top:-6px}
.sublink{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;color:var(--muted);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.sublink:hover{color:var(--ink)}
.sublink.on{color:var(--ink);border-bottom-color:var(--accent)}
details.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-weight:600;color:var(--muted);font-size:13.5px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:'›';display:inline-block;width:14px;font-size:18px;line-height:1;transition:transform .15s;color:var(--muted)}
details.fold[open]>summary::before{transform:rotate(90deg)}
details.fold>summary h2,details.fold>summary h3{margin:0;color:var(--ink)}
details.issues.fold>summary h3{font-size:15px}
details.fold:not(.issues):not(.panel){padding:2px 0}
details.panel.fold:not([open]),details.issues.fold:not([open]){padding-top:12px;padding-bottom:12px}
details.panel.fold[open]>summary{margin-bottom:6px}
@media (max-width:600px){.sublink{padding:9px 10px;font-size:13px}.mnav .mlinks{width:100%}}
.note{font-size:13px;color:var(--muted);margin:0;padding:8px 12px;border-left:3px solid var(--over, #c98a00);background:var(--sheet);border-radius:6px}
@media (max-width:600px){.mnav .mlinks{display:flex;justify-content:flex-start;overflow-x:auto;gap:2px}.mlink{padding:6px 7px;font-size:12.5px}.mnav{gap:6px 12px}}
/* ô lịch: chữ dài (tên vị trí, ca ghép, nhãn lệch giờ) xuống dòng thay vì đẩy bảng rộng ra */
.roster .cell .chip{display:inline-block;white-space:normal;text-align:left;overflow:visible;border-radius:8px}
.roster .nw{white-space:nowrap}
.roster .cell .swp{white-space:normal}
body:has(.wrap.wide) .xc-bar{max-width:1880px;padding-inline:24px}
/* lịch core team: ca làm nền trắng chữ đậm, chỉ tô màu ngày nghỉ */
.subnav:empty{min-height:0;padding:0}
.corestat{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);border-left:4px solid var(--accent)}
.corestat.todo{border-left-color:var(--over)}
.corestat.done{border-left-color:var(--ok)}
.corestat span{color:var(--muted);font-size:13px}
.coretool{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px}
.coretool .ct-l,.coretool .ct-r{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.coretool select.in{width:auto;min-width:150px;padding-block:5px}
.coreg{border-radius:12px}
.coregrid{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
.coregrid th,.coregrid td{padding:0;border-bottom:1px solid var(--line-2);text-align:center}
.coregrid thead th{position:sticky;top:0;background:var(--sheet);z-index:1;border-bottom:1px solid var(--line)}
.coregrid thead th.cd{padding:7px 0 6px;min-width:42px;font-weight:600}
.coregrid thead th.cd span{display:block;font-size:10px;color:var(--faint);letter-spacing:.04em}
.coregrid thead th.cd b{display:block;font-size:13px;color:var(--ink)}
.coregrid thead th.we span,.coregrid thead th.we b{color:var(--accent)}
.coregrid th.cname{position:sticky;left:0;z-index:2;background:var(--sheet);text-align:left;padding:8px 12px;min-width:170px;border-right:1px solid var(--line)}
.coregrid thead th.cname{z-index:3;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;vertical-align:bottom}
.coregrid tbody th.cname b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap}
.coregrid tbody th.cname small{display:block;color:var(--faint);font-size:11px;font-weight:400}
.coregrid td.we{background:color-mix(in srgb,var(--accent-soft) 35%,var(--sheet))}
.coregrid td.cc{position:relative;height:42px;min-width:42px;border-left:1px solid var(--line-2)}
.coregrid .clab{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;font-family:var(--f-mono);font-size:11px;line-height:1.15;color:var(--ink);font-weight:600;letter-spacing:-.02em}
.coregrid .clab em{font-family:var(--f-body,inherit);font-style:normal;font-size:8.5px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.coregrid td.k-vp .clab{color:var(--muted)}
.coregrid td.k-vp .clab em{color:var(--muted)}
.coregrid td.k-off{background:var(--ground)}
.coregrid td.k-off .clab{color:var(--muted);font-family:inherit;font-size:10.5px;letter-spacing:.04em}
.coregrid td.k-np{background:var(--over-soft)}
.coregrid td.k-np .clab{color:var(--over);font-family:inherit}
.coregrid td.k-le{background:var(--short-soft)}
.coregrid td.k-le .clab{color:var(--short);font-family:inherit}
.coregrid td.k-none .clab{color:var(--line);font-weight:400}
.coregrid .csel{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.coregrid tr.ced td.cc:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.coregrid tr.ced td.k-none .clab{color:var(--accent);font-size:14px}
.coregrid tr.cmine th.cname{box-shadow:inset 4px 0 0 var(--accent);background:var(--accent-soft)}
.coregrid tr.cmine td{border-bottom-color:var(--line)}
.coregrid td.cc:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.coregrid th.cs,.coregrid td.cs{padding:0 10px;font-family:var(--f-mono);font-size:12px;white-space:nowrap;border-left:1px solid var(--line-2)}
.coregrid thead th.cs{font-family:inherit;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.coregrid thead th.cs:first-of-type,.coregrid td.cs:first-of-type{border-left:1px solid var(--line)}
.coregrid td.cs small{color:var(--faint)}
.coregrid td.cs.bad{color:var(--short);font-weight:700}
.coregrid tfoot th,.coregrid tfoot td{background:var(--ground);border-bottom:0;font-size:12px;color:var(--muted);padding:6px 0}
.coregrid tfoot th.cname{padding:6px 12px;font-weight:600}
.coregrid tfoot td.cd{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.core-lg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--muted);align-items:center}
.core-lg i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px;border:1px solid var(--line)}
.core-lg em{font-style:normal;font-weight:700;font-size:10px;color:var(--accent);margin-right:3px}
.core-lg i.k-cht,.core-lg i.k-ct,.core-lg i.k-vp{background:var(--sheet)}
.core-lg i.k-off{background:var(--ground)}.core-lg i.k-np{background:var(--over-soft)}.core-lg i.k-le{background:var(--short-soft)}
span.clab[class*=" k-"]{display:inline-block;padding:2px 8px;border-radius:6px;font-family:var(--f-mono);font-size:12px;background:var(--ground)}
@media (max-width:600px){.coretool .ct-l,.coretool .ct-r{width:100%}.coregrid th.cname{min-width:120px;padding:6px 8px}.coregrid tbody th.cname b{font-size:12.5px;white-space:normal}}
.coregrid tbody th.cname small .bad{color:var(--short);font-weight:700}
.coregrid td.cc,.coregrid thead th.cd{min-width:38px}
/* đối soát vị trí × ca dưới lịch tuần */
.roster tfoot tr.cvt th,.roster tfoot tr.cvt td{background:var(--sheet);border-top:2px solid var(--line);padding:8px 6px}
.roster tfoot tr.cvt td{text-align:center}
.roster tfoot tr.cvh th,.roster tfoot tr.cvh td{background:var(--ground);padding:6px 8px;border-top:1px solid var(--line)}
.roster tfoot tr.cvr th,.roster tfoot tr.cvr td{background:var(--sheet);padding:3px 4px}
.roster tfoot tr.cvr th.name{padding:3px 12px 3px 20px}
.roster tfoot tr.cvr th .nm{font-size:12px;font-weight:500}
.roster tfoot tr.cvr td{text-align:center}
.cvn{display:inline-block;min-width:44px;padding:3px 0;border-radius:6px;font-family:var(--f-mono);font-size:12px;font-weight:700;text-align:center}
.cvn.ok{background:var(--ok-soft);color:var(--ok)}
.cvn.short{background:var(--short-soft);color:var(--short)}
.cvn.over{background:var(--over-soft);color:var(--over)}
.cvn.none{color:var(--line);font-weight:400}
.cvsum{font-size:12px;font-weight:600}
.cvsum.ok{color:var(--ok)}
.cvsum.short{color:var(--short)}
/* Thiết lập nhân viên: nhóm theo vị trí ưu tiên 1, số thứ tự trong nhóm */
.tbl.staff tr.sgrp td{background:var(--ground);padding:8px 10px;border-top:2px solid var(--line)}
.ordrow{display:inline-flex;align-items:center;gap:3px;margin-right:2px}
.ordn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:700;font-family:var(--f-mono)}
/* Lịch tuần: chọn cách xem */
.wvbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.seg.wview button{padding:7px 14px;font-size:13px}
.seg.wview button.on{background:var(--ink);color:var(--sheet)}
/* bảng theo vị trí (23/10 bản 2): nền trắng, chỉ tô màu chỗ cần chú ý — thiếu (đỏ), dư (vàng), lệch đăng ký (cam) */
.bwrap{border-radius:12px}
.board{border-collapse:separate;border-spacing:0;width:100%;min-width:1040px;table-layout:fixed}
.board th,.board td{border-bottom:1px solid var(--line-2);vertical-align:top}
.board thead th{background:var(--sheet);border-bottom:1px solid var(--line);padding:10px 8px 9px;text-align:left;position:sticky;top:0;z-index:1}
.board thead th .dhl{display:flex;align-items:baseline;gap:6px}
.board thead th b{font-size:15px}
.board thead th span{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.board thead th .bpill{margin-top:5px}
.board thead th.today{box-shadow:inset 0 3px 0 var(--accent)}
.board thead th.today b{color:var(--accent)}
.board th.bname{position:sticky;left:0;z-index:2;background:var(--sheet);width:150px;text-align:left;padding:8px 12px;border-right:1px solid var(--line)}
.board thead th.bname{z-index:3;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;vertical-align:bottom}
.board tr.bgrp th,.board tr.bgrp td{background:var(--ground);padding:9px 12px;border-top:2px solid var(--line);border-bottom:1px solid var(--line)}
.board tr.bgrp .chip{font-size:13.5px;padding:4px 12px;font-weight:700}
.board tr.bgrp .bpill{margin-right:8px}
.bpill{display:inline-block;font-style:normal;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;line-height:1.5}
.bpill.ok{background:var(--ok-soft);color:var(--ok)}
.bpill.short{background:var(--short);color:#fff}
.bpill.over{background:var(--over-soft);color:var(--over)}
.board th.bsh{padding:10px 12px 10px 16px;font-weight:600}
.board .bshn{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.board th.bsh small{display:block;margin:2px 0 0 16px;font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:400}
.board td.bc{padding:7px 6px 8px;border-left:1px solid var(--line-2)}
.board td.bc.today{background:color-mix(in srgb,var(--accent-soft) 25%,var(--sheet))}
.board td.b-short{background:color-mix(in srgb,var(--short-soft) 55%,var(--sheet));box-shadow:inset 3px 0 0 var(--short)}
.board td.b-over{background:color-mix(in srgb,var(--over-soft) 55%,var(--sheet));box-shadow:inset 3px 0 0 var(--over)}
.bch{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.bcnt{font-family:var(--f-mono);font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;float:none;margin:0}
.b-ok .bcnt{color:var(--ok);background:var(--ok-soft)}
.b-short .bcnt{color:#fff;background:var(--short)}
.b-over .bcnt{color:var(--over);background:var(--over-soft)}
.bnote{font-size:11.5px;font-weight:700}
.b-short .bnote{color:var(--short)}
.b-over .bnote{color:var(--over)}
.bp{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:5px 8px 6px;margin-top:5px;font:inherit;color:var(--ink);cursor:pointer;line-height:1.25;box-shadow:0 1px 0 rgba(19,26,35,.04)}
.bch+.bp{margin-top:0}
.bp:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.bpn{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;overflow-wrap:anywhere}
.btag{font-style:normal;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border:1px dashed var(--faint);border-radius:4px;padding:0 4px}
.bpr{font-size:11px;color:var(--muted)}
.bpr b{font-family:var(--f-mono);font-weight:600;color:var(--ink)}
.bpr b.warn{font-family:inherit;color:var(--short)}
.bpw{font-size:11px;font-family:var(--f-mono);color:var(--muted)}
.bpw.diff{color:var(--over);font-weight:700}
.bp.alt{border-style:dashed}
.bp.dv{box-shadow:inset 3px 0 0 var(--over)}
.bp.out{box-shadow:inset 3px 0 0 var(--short);border-color:var(--short)}
.bslot{display:block;width:100%;margin-top:5px;border:1.5px dashed var(--short);border-radius:8px;background:var(--sheet);color:var(--short);font:inherit;font-size:12.5px;font-weight:700;padding:7px 8px;cursor:pointer;text-align:left}
.bch+.bslot{margin-top:0}
.bslot:hover{background:var(--short-soft)}
.bslot.ro{cursor:default;font-weight:500}
.blg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--muted);align-items:center}
.blg i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px;border:1px solid var(--line)}
.blg i.lg-ok{background:var(--ok-soft)}.blg i.lg-short{background:var(--short-soft);border-color:var(--short)}.blg i.lg-over{background:var(--over-soft)}
.blg i.lg-alt{background:var(--sheet);border:1px dashed var(--faint)}.blg i.lg-dv{background:var(--sheet);box-shadow:inset 3px 0 0 var(--over)}
/* chọn người cho chỗ trống */
.slotpop{position:fixed;z-index:45;width:330px;max-width:calc(100vw - 24px);max-height:70vh;overflow:auto;background:var(--sheet);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:8px;left:12px;bottom:12px}
.splist{display:flex;flex-direction:column;gap:4px}
.spi{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:7px 10px;font:inherit;cursor:pointer}
.spi:hover,.spi:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 1px var(--accent)}
.spi b{font-size:13.5px}.spi small{font-size:11.5px;color:var(--muted)}
.spi.full{opacity:.6}
/* bảng theo nhân viên: nhóm theo vị trí chính. Ô nào cũng hiện vị trí (24/10: bỏ ẩn chip ở ô vị trí chính vì đã bỏ dòng tiêu đề nhóm) */
.roster tr.rgrp th,.roster tr.rgrp td{background:var(--ground);padding:7px 12px;border-top:2px solid var(--line)}
.roster .meta .chip.main{font-size:10.5px;padding:1px 6px;flex:none;white-space:nowrap}
@media (max-width:600px){.board th.bname{width:110px;padding:6px 8px}.wvbar{flex-wrap:wrap}}
/* hộp chọn phương án Tự xếp */
.modal-card.plans{width:min(1240px,100%)}
.modal-card.plans h3#plh{margin:0;font-size:17px}
.modal-card.plans .pop-h span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;max-width:720px}
.plcmp th,.plcmp td{vertical-align:top}
.plcmp thead th{text-transform:none;letter-spacing:0;white-space:normal;color:var(--ink);font-size:13px;width:28%}
.plcmp thead th:first-child{width:16%}
.plcmp thead th b{display:block;font-size:14.5px}
.plcmp thead th small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin:3px 0}
.plcmp tbody th{font-weight:500;color:var(--muted);font-size:12.5px;white-space:normal}
.plcmp td{font-family:var(--f-mono);font-size:12.5px}
.plcmp td small{color:var(--muted)}
.plcmp td.best{background:var(--ok-soft);color:var(--ok);font-weight:700}
.plcmp th.on,.plcmp td.on{box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent)}
.plcmp tr.plact td{font-family:inherit}
.plcmp tr.plact .btn{margin:0 6px 6px 0}
.plprev{border-top:1px solid var(--line);padding-top:12px}
.plprev .bp,.plprev .bslot{pointer-events:none}
.popt.addsh{border-style:dashed;border-color:var(--short)}
.popt.addsh .shn{font-weight:700;color:var(--short)}
.board thead th .bpill,.board thead th em.bpill{display:inline-block;width:auto}
.blg b.lgc{color:var(--over);font-family:var(--f-mono);font-size:11px;margin-right:4px}
.blg i.lg-out{background:var(--sheet);border-color:var(--short);box-shadow:inset 3px 0 0 var(--short)}
.rpls{display:flex;flex-direction:column;gap:5px}
.rpl{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.rpl b{display:block;font-size:13px}
.rpl small{display:block;font-size:11px;color:var(--muted);line-height:1.4}
.rpl small .chip{font-size:10.5px;padding:0 6px}
.btag.gay{color:#fff;background:var(--short);border:0}
.corechg{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);font-size:13px}
.corechg .cin{color:var(--ok);font-weight:600}
.corechg .cout{color:var(--short);font-weight:600}
.coregrid td.k-na{background:repeating-linear-gradient(135deg,var(--ground) 0 4px,var(--sheet) 4px 8px)}
.opt.nosplit{opacity:.45;text-decoration:line-through}
/* phương án Tự xếp: 4 cột, chỗ khác nhau, xem trước 2 chế độ */
.plcmp.n4 thead th{width:21%}
.plcmp tr.same td{color:var(--muted);font-weight:400}
.plcmp tr.pldiff td b{color:var(--over);font-size:14px}
.plh{margin:10px 0 4px}
.plh summary small{font-weight:400;color:var(--muted);margin-left:6px}
.plhrs{margin-top:8px}
.plhrs td.num{font-family:var(--f-mono);text-align:right}
.plhrs tr:not(.df) td{color:var(--muted)}
.plhrs td.hi{background:var(--ok-soft);color:var(--ok);font-weight:700}
.plhrs td.lo{background:var(--over-soft);color:var(--over);font-weight:700}
.plbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:8px}
.plbar h3.sub{margin:0 auto 0 0}
.plprev .seg button.on{background:var(--ink);color:var(--sheet)}
.plcmpsel span{font-size:12px;color:var(--muted);padding:0 8px;align-self:center;background:var(--ground)}
.plnote{margin:0 0 8px}
.plsw{display:inline-block;width:12px;height:12px;border:2px solid var(--over);border-radius:3px;vertical-align:-2px}
.plprev .bp.chg{box-shadow:0 0 0 2px var(--over)}
table.plgrid{border-collapse:separate;border-spacing:0;width:100%;min-width:900px;font-size:12px}
.plgrid th,.plgrid td{border-top:1px solid var(--line-2);vertical-align:top;padding:5px 6px;text-align:left}
.plgrid td{border-left:1px solid var(--line-2)}
.plgrid thead th{font-weight:600;color:var(--muted);white-space:nowrap}
.plgrid th.name{position:sticky;left:0;z-index:1;background:var(--sheet);width:170px;border-right:1px solid var(--line)}
.plgrid th.name .nm{font-weight:600;color:var(--ink)}
.plgrid th.name .meta{display:flex;gap:6px;align-items:center;margin-top:2px;font-size:11px;color:var(--muted)}
.plgrid td.na{background:var(--hatch)}
.plgrid .pgt{font-family:var(--f-mono);color:var(--ink)}
.plgrid .pge{color:var(--faint);font-size:11px}
.plgrid td.chg{box-shadow:inset 0 0 0 2px var(--over)}
.plgrid .pgw{display:block;margin-top:2px;font-size:11px;color:var(--over);font-family:var(--f-mono)}
.plgrid td.pgh{font-family:var(--f-mono);text-align:right;white-space:nowrap}
.plgrid td.pf0{background:var(--p0-bg)}.plgrid td.pf1{background:var(--p1-bg)}.plgrid td.pf2{background:var(--p2-bg)}.plgrid td.pf3{background:var(--p3-bg)}
.plgrid td.pf4{background:var(--p4-bg)}.plgrid td.pf5{background:var(--p5-bg)}.plgrid td.pf6{background:var(--p6-bg)}.plgrid td.pf7{background:var(--p7-bg)}
.plcmpsel button.self{background:var(--accent-soft);color:var(--accent-ink);cursor:default;font-weight:700}
/* ===== lịch core team theo tuần (24/10): thẻ ca màu theo loại, dải tóm tắt ===== */
.corehd{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;justify-content:flex-end}
.cwsum{display:grid;grid-template-columns:minmax(220px,2fr) repeat(3,minmax(110px,1fr));gap:10px}
.cwsum>div{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:2px;justify-content:center}
.cwst{border-left:4px solid var(--ok)!important}
.cwst.lk{border-left-color:var(--faint)!important;background:var(--ground)!important}
.cwst b{font-family:var(--f-display);font-size:16px;color:var(--ok)}
.cwst.lk b{color:var(--muted)}
.cwst span{font-size:12.5px;color:var(--muted)}
.cwk b{font-family:var(--f-display);font-size:24px;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.cwk b small{font-size:14px;color:var(--faint);font-weight:500}
.cwk span{font-size:12px;color:var(--muted)}
.cwk.warn b{color:var(--over)}.cwk.bad b{color:var(--short)}
@media (max-width:760px){.cwsum{grid-template-columns:1fr 1fr 1fr}.cwst{grid-column:1/-1}}
.cwkwrap{border-radius:14px}
table.cwkg{border-collapse:separate;border-spacing:0;width:100%;min-width:980px;table-layout:fixed}
.cwkg th,.cwkg td{border-bottom:1px solid var(--line-2);vertical-align:middle}
.cwkg th.cn{position:sticky;left:0;z-index:2;background:var(--sheet);width:228px;text-align:left;padding:10px 14px;border-right:1px solid var(--line)}

.pfmsg cite{display:block;margin-top:6px;font-style:normal;font-size:12px;color:var(--muted)}
.pfmsg cite::before{content:'— ';}
.pfgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:760px){.pfgrid2{grid-template-columns:1fr}}
.pfbox.support{background:var(--p4-bg)}.pfbox.support h3{color:var(--p4-ink)}
.pfwins,.pfgrows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.pfwins li p,.pfgrows li p{margin:0;font-size:14px;line-height:1.5}
.pfwins li small,.pfgrows li small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.pfgrows li small.nx{color:var(--ink);font-weight:600}
.pftags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pftags em{font-style:normal;font-size:11px;font-weight:600;color:var(--ok);background:var(--sheet);border-radius:999px;padding:1px 8px}
.pfself{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.pfself b{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pfself p{margin:2px 0 0;font-size:13.5px}
.pfmood{font-weight:700}.pfmood.m1,.pfmood.m2{color:var(--short)}.pfmood.m4,.pfmood.m5{color:var(--ok)}
.pfselfed{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.pfselfed .fl.wide{grid-column:1/-1}.pfselfed>.fl:first-child{grid-column:1/-1}
@media (max-width:760px){.pfselfed{grid-template-columns:1fr}}
.pfselfed .row{grid-column:1/-1;align-items:center;gap:12px}
.pfmoods{flex-wrap:wrap}
.pfmoods button.on{background:var(--ink);color:var(--sheet)}
.pfkudos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pfkudos li{padding:10px 12px;border-radius:10px;background:var(--p2-bg)}
.pfkudos li p{margin:2px 0;font-size:13.5px;color:var(--ink)}
.pfkudos li small{font-size:11.5px;color:var(--muted)}
.pfkt{font-size:11px;font-weight:700;color:var(--p2-ink);text-transform:uppercase;letter-spacing:.04em}
.pfkform{display:grid;grid-template-columns:260px 1fr;gap:10px 14px;padding:12px;border:1px dashed var(--line);border-radius:12px}
.pfkform .fl.wide{grid-column:1/-1}.pfkform .row{grid-column:1/-1;align-items:center;gap:10px}
@media (max-width:760px){.pfkform{grid-template-columns:1fr}}
.pfkt-pick,.pftagpick{display:flex;flex-wrap:wrap;gap:6px}
.pfkt-pick button,.pftagpick button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--sheet);color:var(--muted);border-radius:999px;padding:4px 10px;cursor:pointer}
.pfkt-pick button.on{background:var(--p2-bg);color:var(--p2-ink);border-color:var(--p2-ink);font-weight:700}
.pftagpick button.on{background:var(--ok-soft);color:var(--ok);border-color:var(--ok);font-weight:700}
.pfrates{flex-wrap:wrap}
.pfrates button.on.r5,.pfrates button.on.r4{background:var(--ok);color:var(--sheet)}.pfrates button.on.r3{background:var(--accent);color:var(--accent-ink)}
.pfrates button.on.r2{background:var(--over);color:var(--sheet)}.pfrates button.on.r1{background:var(--short);color:var(--sheet)}
.pfpulse ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pfpulse li{padding:7px 12px;border-radius:8px;font-size:13.5px;background:var(--ground)}
.pfpulse li.hot{background:var(--short-soft)}.pfpulse li.warn{background:var(--over-soft)}.pfpulse li.info{background:var(--accent-soft)}
.pfpulse li .linkbtn{text-align:left;color:var(--ink)}
.pfctx{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:860px){.pfctx{grid-template-columns:1fr}}
.pfctx h3{margin:0;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.pfctx p{margin:0}.pfctx .ok{color:var(--ok)}.pfctx .no{color:var(--short)}
.pfitems{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pfitem{display:grid;grid-template-columns:1fr auto;gap:6px 8px;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line)}
.pfitem.good{background:color-mix(in srgb,var(--ok-soft) 60%,var(--sheet))}
.pfitem.grow{background:color-mix(in srgb,var(--over-soft) 60%,var(--sheet))}
.pfitem textarea,.pfitem input,.pfitem .pftagpick{grid-column:1}
.pfitem>button{grid-column:2;grid-row:1;align-self:start}
.pfcoach{border-radius:12px;padding:12px 14px;background:var(--ground);font-size:13px;display:flex;flex-direction:column;gap:6px}
.pfcoach .ok{color:var(--ok);font-weight:600}
.pfcoach ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.pfcoach ul.err li{color:var(--short);font-weight:600}
.pfcoach ul.tip li{color:var(--muted)}
.pfp-w{display:flex;flex-wrap:wrap;gap:6px}

/* ================= GIAO DIỆN 26/10/2026 (Phúc: thiết kế lại bố cục, phân cấp thị giác) =================
   Lớp thiết kế chung, nạp sau hr.css nên đè lên kiểu cũ. Thứ bậc: thanh ứng dụng (tên + tài khoản) → menu nhóm (nút có biểu tượng)
   → tab con (gạch chân) → tiêu đề trang → thanh công cụ (cách xem + bộ lọc) → nội dung (thẻ trắng, bóng nhẹ).
   Màu chủ đạo giữ xanh HTD #2446C7; nền xám xanh rất nhạt để thẻ trắng nổi; khoảng cách theo bước 4/8 px. */
:root{--ground:#F3F5F9;--line:#DCE1E8;--line-2:#E8ECF2;--r-lg:14px;--r-md:10px;--sh-1:0 1px 2px rgba(16,24,40,.05),0 1px 1px rgba(16,24,40,.03);--sh-2:0 6px 20px rgba(16,24,40,.08);--accent-hover:#1D3BAE}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#0E131A;--line:#2B3441;--line-2:#212934;--sh-1:none;--sh-2:0 8px 24px rgba(0,0,0,.45);--accent-hover:#97A9FF}}
:root[data-theme="dark"]{--ground:#0E131A;--line:#2B3441;--line-2:#212934;--sh-1:none;--sh-2:0 8px 24px rgba(0,0,0,.45);--accent-hover:#97A9FF}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.wrap{gap:20px;padding-block:16px 96px}
body:has(.wrap.wide) .xc-bar{max-width:none;padding-inline:0}
body:has(.wrap.wide) .ab-in{max-width:1880px;padding-inline:24px}

/* ---------- menu nhóm: thanh phân đoạn có biểu tượng; bối cảnh (site / phạm vi) là thẻ nhỏ bên trái ---------- */
.mnav{gap:10px 14px;padding:0;border:0;align-items:center}
.mnav .brand{flex-direction:row;align-items:center;gap:8px;order:2;margin-left:auto}
.mnav .brand b{display:none}
.mnav .brand span{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--sheet);border:1px solid var(--line-2);border-radius:999px;padding:5px 12px 5px 10px;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:var(--sh-1)}
.mnav .brand span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px var(--ok-soft)}
.mlinks{order:1;background:var(--sheet);border:1px solid var(--line-2);border-radius:12px;padding:4px;gap:2px;box-shadow:var(--sh-1)}
.mlink{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:9px;padding:7px 13px;color:var(--muted);font-size:13.5px;transition:background .12s,color .12s}
.mlink svg{flex:none;opacity:.85}
.mlink:hover{background:var(--ground);color:var(--ink);border:0}
.mlink.on{background:var(--accent);color:#fff;box-shadow:0 1px 3px rgba(36,70,199,.35)}
.mlink.on svg{opacity:1}
.mlink.on .count{background:rgba(255,255,255,.22);color:#fff}
.mlink .count.hot{background:var(--short);color:#fff}

/* ---------- tab con: gạch chân, chữ xanh khi đang chọn ---------- */
.subnav{margin-top:-6px;gap:2px;border-bottom:1px solid var(--line)}
.sublink{padding:10px 12px 11px;font-size:13.5px;color:var(--muted);border-bottom-width:2px;transition:color .12s}
.sublink:hover{color:var(--ink)}
.sublink.on{color:var(--accent);border-bottom-color:var(--accent)}

/* ---------- tiêu đề trang ---------- */
h1{font-size:26px;letter-spacing:-.02em}
.hrtop h1,header.top h1{font-size:26px}
.eyebrow{font-size:11.5px;letter-spacing:.07em;color:var(--muted);margin-bottom:3px}
header.top{padding:2px 0}
.weeknav{background:var(--sheet);border:1px solid var(--line-2);border-radius:12px;padding:4px;box-shadow:var(--sh-1);gap:4px}
.weeknav .btn.icon{border:0;width:34px;height:34px;border-radius:8px}
.weeknav .btn.icon:hover{background:var(--ground)}
.weeknav .wk{padding:0 8px;text-align:center}

/* ---------- thẻ, khối nội dung ---------- */
.panel{border-color:var(--line-2);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:20px 22px;gap:16px}
.panel-h h2{font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.panel-h p{font-size:13px;line-height:1.5}
.kgrid{gap:14px}
.kcard{background:var(--sheet);border-color:var(--line-2);border-radius:12px;padding:14px 16px;box-shadow:var(--sh-1);gap:6px}
.kcard>span:first-child{font-size:12px;font-weight:600;color:var(--muted)}
.kcard b{font-size:28px;letter-spacing:-.01em}
.note{border-radius:10px;border-left-width:4px;box-shadow:var(--sh-1);padding:10px 14px}
details.fold>summary{cursor:pointer}

/* ---------- nút, ô nhập ---------- */
.btn{border-radius:9px;padding:8px 14px;font-weight:600;border-color:var(--line);transition:background .12s,border-color .12s,box-shadow .12s,color .12s}
.btn:hover{background:var(--ground);border-color:var(--faint)}
.btn.primary{box-shadow:0 1px 2px rgba(36,70,199,.3)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);filter:none}
.btn.ghost{border-color:transparent}
.btn.ghost:hover{background:var(--line-2);border-color:transparent}
.btn.sm{padding:6px 11px;border-radius:8px}
.btn:focus-visible,.mlink:focus-visible,.sublink:focus-visible,.ab-chip:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.in{border-radius:8px;padding:7px 10px;transition:border-color .12s,box-shadow .12s}
.in:hover{border-color:var(--faint)}
.fl{font-size:12px}
.hrctl{background:var(--sheet);border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;box-shadow:var(--sh-1)}
.pill{padding:2px 9px}
.tbl thead th{background:color-mix(in srgb,var(--ground) 60%,var(--sheet));font-size:11px;letter-spacing:.06em;padding-top:9px;padding-bottom:9px}
.tbl tbody tr:hover>td,.tbl tbody tr:hover>th{background:color-mix(in srgb,var(--accent-soft) 22%,transparent)}

/* ---------- Lịch tuần: bước, tóm tắt, thanh công cụ ---------- */
.steps{border-color:var(--line-2);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.steps.compact{background:transparent;border:0;box-shadow:none;padding:0}
.steps.compact .step{background:var(--sheet);border-color:var(--line-2)}
.steps.compact .step.done{color:var(--muted)}
.summary{background:var(--sheet);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:16px 20px;align-items:center}
.summary .actions{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.summary .actions .btn.primary{order:-1;padding:9px 18px}
.summary .actions [data-act="clear"]{margin-left:6px}
.legend{background:transparent;padding:0 2px;gap:6px 16px}
.wvbar{flex-wrap:wrap;justify-content:flex-start;gap:10px;background:var(--sheet);border:1px solid var(--line-2);border-radius:12px;padding:8px;box-shadow:var(--sh-1);position:sticky;top:57px;z-index:5}
.wvbar .fbar{flex:1 1 600px;border:0;padding:0;background:none;box-shadow:none}
.wvbar .fnote{flex-basis:100%;margin:0 4px 2px}
.seg.wview{border-radius:9px;background:var(--ground);border:0;padding:3px;gap:2px}
.seg.wview button{border:0;border-radius:7px;background:transparent;padding:7px 14px}
.seg.wview button+button{border:0}
.seg.wview button.on{background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.blg{background:var(--sheet);border:1px solid var(--line-2);border-radius:10px;padding:10px 14px;gap:8px 20px}
.blg span{white-space:nowrap}
.blg span>i:not([class]){display:inline;width:auto;height:auto;border:0;margin:0;background:none;vertical-align:baseline}
.gridwrap{border-radius:var(--r-lg);box-shadow:var(--sh-1)}

/* ---------- bộ lọc dùng chung ---------- */
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--sheet);border:1px solid var(--line-2);border-radius:12px;padding:8px;box-shadow:var(--sh-1)}
.fbar .fsearch{position:relative;flex:1 1 200px;max-width:280px}
.fbar .fsearch .in{padding-left:32px;height:34px}
.fbar .fsearch::before{content:"";position:absolute;left:11px;top:50%;width:13px;height:13px;margin-top:-8px;border:2px solid var(--faint);border-radius:50%;box-sizing:border-box}
.fbar .fsearch::after{content:"";position:absolute;left:21px;top:50%;width:6px;height:2px;margin-top:4px;background:var(--faint);transform:rotate(45deg);border-radius:2px}
.fbar .fsel{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:8px;background:var(--sheet);height:34px;padding-left:10px;font-size:12px;color:var(--muted);font-weight:600}
.fbar .fsel .in{border:0;box-shadow:none;height:32px;padding:0 26px 0 6px;width:auto;max-width:200px;font-weight:600;color:var(--ink);background-color:transparent}
.fbar .fsel:has(select:focus){border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fbar.on .fsel:has(option:checked:not([value=""])){border-color:var(--accent);background:var(--accent-soft)}
.fbar .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fnote{font-size:12.5px;color:var(--muted);margin:-8px 2px 0}
.fnote b{color:var(--accent)}
.board .bp.dim,.roster .cell.dim,.rcell.dim{opacity:.32}
.board .bp.dim:hover,.roster .cell.dim:hover,.rcell.dim:hover{opacity:.8}

/* ---------- mục mới 26/10: giữ trọn ca, gọi thêm, nhập lịch tự xếp, khoản lương ---------- */
.board .bhold{display:inline-block;margin-left:8px;font-style:normal;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 8px;vertical-align:middle}
.board .btag.call,.roster .swp.call{background:var(--over-soft);color:var(--over);border-color:transparent}
.frow.pos label.hold{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;cursor:pointer}
.frow.pos:has(label.hold){grid-template-columns:auto 1fr 70px auto auto}
.slotpop .sph{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:10px 2px 4px}
.slotpop .sph:first-of-type{margin-top:2px}
.slotpop .sph small{display:block;text-transform:none;letter-spacing:0;font-weight:400;font-size:11.5px;margin-top:2px}
.slotpop .spi.call{border-style:dashed}
.slotpop .spi.call b::after{content:"ngoài ĐK";margin-left:6px;font-size:10.5px;font-weight:700;color:var(--over);background:var(--over-soft);border-radius:999px;padding:1px 6px}
.plhold{margin:0;font-size:12.5px;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:8px 12px}
.plhold b{color:var(--accent)}
.ltcard{width:min(1100px,100%)}
.ltsteps{list-style:none;counter-reset:lt;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.ltsteps li{counter-increment:lt;position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 16px;border:1px solid var(--line-2);border-radius:12px;padding:14px 16px 14px 56px;background:var(--sheet)}
.ltsteps li::before{content:counter(lt);position:absolute;left:16px;top:50%;margin-top:-14px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700}
.ltsteps li b{grid-column:1}
.ltsteps li span{grid-column:1;font-size:12.5px;color:var(--muted)}
.ltsteps li .btn{grid-column:2;grid-row:1/3}
.filebtn{display:inline-flex;align-items:center;cursor:pointer}
.ltsum{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ltprev{max-height:56vh;overflow:auto;border:1px solid var(--line-2);border-radius:12px}
.ltprev .tbl th small,.ltprev .tbl td small{display:block;font-size:11px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0;white-space:normal;margin-top:2px}
.ltprev .tbl tbody th{white-space:nowrap;position:sticky;left:0;background:var(--sheet)}
.ltprev .tbl td{min-width:118px;vertical-align:top;font-size:12.5px}
.ltprev .tbl td .chip{display:inline-block;margin-top:3px;font-size:11px}
.ltprev .tbl td.err{background:var(--short-soft)}
.ltprev .tbl td.err small.e{color:var(--short);font-weight:600}
.ltprev .tbl td.warn{background:var(--over-soft)}
.ltdone{display:flex;flex-direction:column;gap:4px;background:var(--ok-soft);border-radius:12px;padding:14px 16px}
.ltdone b{color:var(--ok)}
.ltdone span{font-size:13px;color:var(--ink)}
.row.end{justify-content:flex-end}
details.fold.ottypes>summary{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-family:var(--f-display);font-size:17px;font-weight:700}
.ottypes>summary small{flex-basis:100%;font-family:var(--f-body);font-size:12.5px;font-weight:400;color:var(--muted)}
.ottypes .fl.chk{flex-direction:row;align-items:center;gap:6px;align-self:end;padding-bottom:8px}
.ottypes .otnew{border-top:1px dashed var(--line);padding-top:14px}
.ottypes tr.muted td{color:var(--faint)}

/* ---------- màn hình hẹp ---------- */
@media (max-width:760px){
  .mnav .brand{order:0;margin-left:0;width:100%}
  .mnav .brand span{max-width:100%}
  .mlinks{width:100%}
  .mlink{padding:7px 10px}
  .summary .actions{margin-left:0;justify-content:flex-start}
  .wvbar{position:static}
  .blg span{white-space:normal}
  .fbar .fsearch{max-width:none;flex-basis:100%}
  .panel{padding:16px}
  .ltsteps li{grid-template-columns:1fr;padding-left:52px}
  .ltsteps li .btn{grid-column:1;grid-row:auto;justify-self:start}
}
@media (max-width:600px){.mlink span{display:none}.mlink{padding:8px 11px}.mlink.on span{display:inline}}
</style>

function migrate(s){
  (s.staff||(s.staff=[])).forEach(function(st){if(st.code==null)st.code='';if(st.rate==null)st.rate=0;if(!st.off)st.off=[];if(!st.skills)st.skills=[];if(!st.max&&st.max!==0)st.max=5;});

  s.shifts.forEach(function(sh){if(sh.hours==null)sh.hours=parseHours(sh.time)||7;});
  if(s.fullHours==null)s.fullHours=spanHours(s.shifts)||13;
  s.shifts.forEach(function(sh){if(sh.misa==null)sh.misa='';else if(sh.misa&&sh.name!==sh.misa)sh.name=sh.misa;});
  if(!s.misa||typeof s.misa!=='object')s.misa={full:'',off:'',leave:''};
  if(!s.misaOut||typeof s.misaOut!=='object')s.misaOut={};
  if(!Array.isArray(s.positions))s.positions=[];
  if(!Array.isArray(s.demand)||s.demand.length!==7)s.demand=[{},{},{},{},{},{},{}];
  if(!s.weeks)s.weeks={};
  if(!s.leaves)s.leaves={};
  if(!s.reg)s.reg={};
  if(!Array.isArray(s.swaps))s.swaps=[];
  if(!(s.kpiTarget>0))s.kpiTarget=95;
  if(s.site==null)s.site='';
  delete s.fairMode;delete s.links;delete s.vid;delete s.savedAt;
  s.staff.forEach(function(st){if(st.active===false&&!st.quitDate)st.quitDate=addDays(todayKey(),-1);delete st.active;if(st.role==='FT')st.rate=0;});
  s.v=4;

  Object.keys(s.leaves).forEach(function(id){var L=s.leaves[id];if(L.status!=='approved'||(L.to&&L.to<cut))delete s.leaves[id];});
  s.swaps=s.swaps.filter(function(w){return w.date>=cut;});
  return s;
}

var COMPC=null,COMPSIG='';
function compMap(){
  var sig=S.shifts.map(function(x){return x.id+'|'+x.time+'|'+x.name;}).join(';');if(COMPC&&sig===COMPSIG)return COMPC;COMPSIG=sig;
  var L=[];S.shifts.forEach(function(sh){var t=shiftSpan(sh);if(t)L.push({id:sh.id,t:t});});
  function chain(x,pool){var best=null;(function go(at,path){if(path.length>4||(best&&path.length>=best.length))return;if(at===x.t[1]){if(path.length>=2)best=path.slice();return;}
    pool.forEach(function(y){if(y.id!==x.id&&y.t[0]===at&&y.t[1]<=x.t[1]&&!(y.t[0]===x.t[0]&&y.t[1]===x.t[1])){path.push(y.id);go(y.t[1],path);path.pop();}});})(x.t[0],[]);return best;}
  var dec={};L.forEach(function(x){if(chain(x,L))dec[x.id]=1;});
  var atoms=L.filter(function(x){return !dec[x.id];}),m={};
  L.forEach(function(x){if(dec[x.id]){var c=chain(x,atoms);if(c)m[x.id]=sortIds(c);}});
  return (COMPC=m);
}
function isComp(id){return !!compMap()[id];}
function compParts(id){return compMap()[id]||null;}
function atomShifts(){return S.shifts.filter(function(x){return !isComp(x.id);});}
function atomIds(){return atomShifts().map(function(x){return x.id;});}
function sortIds(L){return S.shifts.map(function(x){return x.id;}).filter(function(id){return L.indexOf(id)>=0;});}
function expandIds(L){var out=[];L.forEach(function(id){if(!shift(id))return;(compParts(id)||[id]).forEach(function(x){if(out.indexOf(x)<0)out.push(x);});});return sortIds(out);}
/* gom các ca ngắn liền nhau thành ca dài (nếu có) để hiển thị, tính giờ công, xuất MISA */
function units(ids){
  var m=compMap(),comps=Object.keys(m).sort(function(a,b){return m[b].length-m[a].length;}),out=[],i=0;
  while(i<ids.length){var hit=null;for(var j=0;j<comps.length&&!hit;j++){var P=m[comps[j]];if(P.length>=2&&ids.slice(i,i+P.length).join(',')===P.join(','))hit=comps[j];}
    if(hit){out.push(shift(hit));i+=m[hit].length;}else{if(shift(ids[i]))out.push(shift(ids[i]));i++;}}
  return out;
}
/* ca gãy: các ca trong ngày không nối liền (vd sáng + tối) */

function availOk(a,s){

/* các khoảng giờ liên tục của đăng ký trong ngày (gộp các ca đăng ký nối liền / chồng nhau) */
function regWins(L){
  var ws=L.map(function(id){var sh=shift(id);return sh?shiftSpan(sh):null;}).filter(Boolean).sort(function(x,y){return x[0]-y[0];}),out=[];
  ws.forEach(function(w){var l=out[out.length-1];if(l&&w[0]<=l[1])l[1]=Math.max(l[1],w[1]);else out.push([w[0],w[1]]);});
